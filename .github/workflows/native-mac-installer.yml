name: Update native Mac installer

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/macos/FRI-*-mac-arm64.zip'
      - 'artifacts/macos/FRI-*-mac-arm64.dmg'
      - 'apple/Tools/update-macos-installer.sh'
      - '.github/workflows/native-mac-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-mac-installer-main
  cancel-in-progress: false

jobs:
  installer:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - name: Verify and publish the latest Apple silicon installer
        shell: bash
        run: |
          set -eu
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout --detach origin/main
            ./apple/Tools/update-macos-installer.sh
            git add -- 'artifacts/macos/FRI-*-mac-arm64.dmg' artifacts/macos/latest/FRI-mac-arm64.dmg
            if git diff --cached --quiet; then exit 0; fi
            git -c user.name=ank-less -c user.email=duyanhricky@gmail.com commit -m 'Refresh the native Mac download from the latest packaged build'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
