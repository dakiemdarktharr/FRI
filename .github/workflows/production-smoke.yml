name: Production website verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    name: Production ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      FRI_BROWSER: ${{ matrix.browser }}
      FRI_WEB_URL: https://getfri.vercel.app/
      FRI_SKIP_FRAMES: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: npm exec --prefix tests -- playwright install --with-deps "$FRI_BROWSER"
      - run: node website/verify-v2.cjs
      - run: node website/verify-responsive.cjs
      - run: node website/verify-product.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: production-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
