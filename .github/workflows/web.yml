name: Web verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      FRI_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: npm exec --prefix tests -- playwright install --with-deps "$FRI_BROWSER"
      - if: matrix.browser == 'chromium'
        run: npm run test:domain --prefix tests
      - run: npm run test:browser --prefix tests
      - run: npm ci --prefix preview
      - run: npm run build --prefix preview
      - run: npm test --prefix preview
      - run: node website/build.mjs
      - run: node website/verify-v2.cjs
        env:
          FRI_SKIP_FRAMES: '1'
