name: FRI
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  FRICore:
    path: Packages/FRICore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targetTemplates:
  App:
    type: application
    sources:
      - FRI
      - Shared
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Config/App-Info.plist
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: FRICore
        product: FRICore
      - package: FRICore
        product: FRIDesign
  Widget:
    type: app-extension
    sources:
      - Widgets
      - Shared
    settings:
      base:
        INFOPLIST_FILE: Config/Widget-Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: FRICore
        product: FRICore
targets:
  FRIMac:
    templates: [App]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FRI_BUNDLE_PREFIX).mac
        CODE_SIGN_ENTITLEMENTS: Config/Mac.entitlements
    dependencies:
      - target: FRIMacWidgets
        embed: true
  FRIiOS:
    templates: [App]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FRI_BUNDLE_PREFIX).ios
        CODE_SIGN_ENTITLEMENTS: Config/Shared.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: FRIiOSWidgets
        embed: true
  FRIMacWidgets:
    templates: [Widget]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FRI_BUNDLE_PREFIX).mac.widgets
        CODE_SIGN_ENTITLEMENTS: Config/MacWidget.entitlements
  FRIiOSWidgets:
    templates: [Widget]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FRI_BUNDLE_PREFIX).ios.widgets
        CODE_SIGN_ENTITLEMENTS: Config/Shared.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
  FRIMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(FRI_BUNDLE_PREFIX).mac.uitests
    dependencies:
      - target: FRIMac
  FRIiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(FRI_BUNDLE_PREFIX).ios.uitests
    dependencies:
      - target: FRIiOS
schemes:
  FRIMac:
    build:
      targets:
        FRIMac: all
    test:
      targets: [FRIMacUITests]
  FRIiOS:
    build:
      targets:
        FRIiOS: all
    test:
      targets: [FRIiOSUITests]
