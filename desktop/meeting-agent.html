<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src 'self'; media-src blob:; connect-src 'none'">
<title>FRI · Meeting assistant</title>
<style>
@font-face{font-family:BeVietnamPro;src:url(ui/BeVietnamPro-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:BeVietnamPro;src:url(ui/BeVietnamPro-SemiBold.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:BeVietnamPro;src:url(ui/BeVietnamPro-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
:root{color-scheme:light;--bg:#f4f7fa;--paper:#fff;--ink:#172b3a;--muted:#586d7c;--line:#dbe4eb;--accent:#087f8c;--on:#fff;--tint:#e0f2f2}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#14181f;--paper:#222833;--ink:#f2f4f8;--muted:#b3bece;--line:#465368;--accent:#75d8cc;--on:#14181f;--tint:#203d3b}}
:root[data-theme=dark]{color-scheme:dark;--bg:#14181f;--paper:#222833;--ink:#f2f4f8;--muted:#b3bece;--line:#465368;--accent:#75d8cc;--on:#14181f;--tint:#203d3b}
*{box-sizing:border-box}body{font:16px BeVietnamPro,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.5;color:var(--ink);background:var(--bg);margin:0;padding:28px}header{display:flex;align-items:center;gap:12px}.brand{font-size:25px;font-weight:750;letter-spacing:-1.5px}.eyebrow{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em}h1{font-size:29px;line-height:1.2;letter-spacing:-.7px;margin:25px 0 12px}p{color:var(--muted);margin:12px 0 20px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px}label{display:block;font-weight:600;margin-bottom:10px}select{display:block;width:100%;min-height:48px;border:1px solid light-dark(#7b8b98,#7d8ba1);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;padding:10px;margin-bottom:14px}.actions{display:flex;flex-wrap:wrap;gap:8px}button{min-height:46px;border:0;border-radius:14px;background:var(--tint);color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:10px 16px;cursor:pointer}#start{background:var(--accent);color:var(--on);flex:1}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}#status{font-size:14px;color:var(--accent);min-height:42px;margin:16px 0 0}.preference{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:400;margin:22px 0 0}input{accent-color:var(--accent);width:18px;height:18px}.privacy{font-size:13px;margin:18px 0 0}
</style>
<header><span class="brand">fri.</span></header>
<h1>Calendar assistant</h1><p>Read invitations in a window you choose. Every plan needs your approval.</p>

<section class="card"><label for="sources">Chat window</label><select id="sources" aria-label="Chat window"></select>
<div class="actions"><button id="refresh">Find windows</button><button id="start" disabled>Start reading</button><button id="pause" hidden>Pause</button><button id="stop" disabled>Forget windows</button></div>
<p id="status" role="status" aria-live="polite">Recognition off</p></section>
<label class="preference"><input id="login" type="checkbox">Open Fri when I sign in</label>

<p class="privacy">On this device only. Reading pauses when you switch away or lock your screen. A closed or renamed chat window needs to be selected again.</p><script src="meeting-view.js"></script></html>
