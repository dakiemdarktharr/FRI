<h1>Thư ký lịch</h1>
<p>Chọn một cửa sổ riêng cho Zalo hoặc Messenger mà bạn có quyền sử dụng. FRI đọc vùng chat ngay trên máy. Khi thấy lời chốt, FRI hỏi trước khi thêm lịch.</p>
<p id="status" role="status">Đang tắt</p>
<label for="sources">Cửa sổ chat</label>
<select id="sources"></select>
<button id="refresh">Tìm cửa sổ</button>
<button id="start" disabled>Bật nhận diện</button>
<button id="stop" disabled>Tắt</button>
<label><input id="login" type="checkbox"> Mở FRI khi đăng nhập</label>
