<!doctype html><html lang="en"><meta charset="utf-8"><title>Create FRI widget</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0002;color:white;font-family:system-ui;cursor:crosshair;user-select:none}p{position:absolute;top:30px;left:50%;transform:translateX(-50%);background:#151515e8;padding:14px 24px;border:1px solid #ffffff60;border-radius:20px;text-align:center;pointer-events:none}small{display:block;color:#bbb;margin-top:4px}#area{position:absolute;border:2px solid white;background:#ffffff28;border-radius:26px;display:none;box-shadow:0 10px 50px #0003}button{position:absolute;right:30px;top:30px;border:1px solid #fff8;border-radius:50%;background:#222;color:white;width:38px;height:38px;font-size:20px;cursor:pointer}</style><p>Draw a space for your day.<small>Drag to size · Esc to cancel</small></p><button aria-label="Cancel">×</button><div id="area"></div><script>let start=null;const area=document.querySelector('#area');document.querySelector('button').onclick=()=>friWidget.cancel();document.onkeydown=e=>{if(e.key==='Escape')friWidget.cancel()};document.onpointerdown=e=>{if(e.target.closest('button'))return;start={x:e.clientX,y:e.clientY};document.body.setPointerCapture(e.pointerId)};document.onpointermove=e=>{if(!start)return;area.style.display='block';Object.assign(area.style,{left:Math.min(start.x,e.clientX)+'px',top:Math.min(start.y,e.clientY)+'px',width:Math.abs(start.x-e.clientX)+'px',height:Math.abs(start.y-e.clientY)+'px'})};document.onpointerup=e=>{if(!start)return;const bounds={x:Math.round(Math.min(start.x,e.clientX)),y:Math.round(Math.min(start.y,e.clientY)),width:Math.round(Math.max(220,Math.abs(start.x-e.clientX))),height:Math.round(Math.max(150,Math.abs(start.y-e.clientY)))};start=null;friWidget.create(bounds)};</script></html>
