<!doctype html><html lang="en"><meta charset="utf-8"><title>Create FRI widget</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0002;color:white;font-family:system-ui;cursor:crosshair;user-select:none}p{position:absolute;top:30px;left:50%;transform:translateX(-50%);background:#151515e8;padding:14px 24px;border:1px solid #ffffff60;border-radius:20px;text-align:center;pointer-events:none}small{display:block;color:#bbb;margin-top:4px}#area{position:absolute;border:2px solid white;background:#ffffff28;border-radius:26px;display:none;box-shadow:0 10px 50px #0003}button{position:absolute;right:30px;top:30px;border:1px solid #fff8;border-radius:50%;background:#222;color:white;width:38px;height:38px;font-size:20px;cursor:pointer}</style><p>Draw a space for your day.<small>Drag to size · Enter to create · Arrows to move · Shift + arrows to resize · Esc to cancel</small></p><button aria-label="Cancel">×</button><div id="area" role="status" aria-label="Widget area"></div><script>let start=null;const area=document.querySelector('#area');document.querySelector('button').onclick=()=>friWidget.cancel();let keyboardBounds=null,creating=false;
function showBounds(b){area.style.display='block';Object.assign(area.style,{left:b.x+'px',top:b.y+'px',width:b.width+'px',height:b.height+'px'});area.setAttribute('aria-label',`Widget area ${b.width} by ${b.height}`)}
function create(b){if(creating)return;creating=true;friWidget.create(b).catch(()=>{creating=false;document.querySelector('p').firstChild.textContent='Could not create the widget. Try again.'})}
document.onkeydown=e=>{if(e.isComposing)return;if(e.key==='Escape'){e.preventDefault();friWidget.cancel();return}if(e.target.closest('button'))return;if(!['Enter','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();keyboardBounds??={x:Math.round((innerWidth-360)/2),y:Math.round((innerHeight-360)/2),width:360,height:360};if(e.key==='Enter'){create(keyboardBounds);return}const b=keyboardBounds,delta=10;if(e.key==='ArrowLeft')b[e.shiftKey?'width':'x']-=delta;if(e.key==='ArrowRight')b[e.shiftKey?'width':'x']+=delta;if(e.key==='ArrowUp')b[e.shiftKey?'height':'y']-=delta;if(e.key==='ArrowDown')b[e.shiftKey?'height':'y']+=delta;b.width=Math.min(innerWidth,Math.max(220,b.width));b.height=Math.min(innerHeight,Math.max(150,b.height));b.x=Math.max(0,Math.min(innerWidth-b.width,b.x));b.y=Math.max(0,Math.min(innerHeight-b.height,b.y));showBounds(b)};
document.onpointerdown=e=>{if(e.target.closest('button'))return;start={x:e.clientX,y:e.clientY};document.body.setPointerCapture(e.pointerId)};document.onpointermove=e=>{if(!start)return;area.style.display='block';Object.assign(area.style,{left:Math.min(start.x,e.clientX)+'px',top:Math.min(start.y,e.clientY)+'px',width:Math.abs(start.x-e.clientX)+'px',height:Math.abs(start.y-e.clientY)+'px'})};document.onpointerup=e=>{if(!start)return;const bounds={x:Math.round(Math.min(start.x,e.clientX)),y:Math.round(Math.min(start.y,e.clientY)),width:Math.round(Math.max(220,Math.abs(start.x-e.clientX))),height:Math.round(Math.max(150,Math.abs(start.y-e.clientY)))};start=null;create(bounds)};</script></html>
