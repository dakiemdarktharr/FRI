<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRI desktop widget</title>
<link rel="stylesheet" href="widget.css">
<section id="widget"><header tabindex="0"><b><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="currentColor"><path d="M23 54c-1-12-1-24 0-36C24 8 33 5 43 8l-2 9c-5-2-9-1-9 5l15-1 1 9-16 2 1 22Z"/><path d="M46 48c1-4 8-5 11-1 3 9-9 12-11 1Z"/></svg>fri.</b><button id="options" aria-label="Widget options" aria-expanded="false">⋯</button></header><div id="menu"><button data-action="open">Open FRI</button><button data-action="add">Add appointment</button><button data-action="integrations">Choose widgets</button><button data-action="remove">Remove widget</button></div><div class="dashboard"><div id="clock" class="panel"><div id="now-time"></div><div><div id="weekday"></div><div id="date"></div></div></div><div id="current" class="panel"><div><div class="eyebrow" id="next-label">Up next</div><h1 id="task">Loading your day…</h1><span id="time"></span></div><button id="add-first" aria-label="Create a plan" hidden>+</button><button id="done" aria-label="Complete current task" disabled>✓</button></div><div class="progress panel"><div class="track"><i id="progress"></i></div><small id="count"></small></div><div id="integrations" aria-label="Connected widgets"></div><ul id="later" aria-label="Later today"></ul></div><p id="error" class="error" role="status"></p></section><button class="resize" aria-label="Resize widget" title="Drag to resize; arrow keys resize">◢</button>
<script>
if(friWidget.platform==='win32')document.documentElement.classList.add('windows');
const $=s=>document.querySelector(s);let state,current,working=false,error='',notice='';
function render(payload){
 state=payload.state;document.documentElement.dataset.theme=state?.settings?.theme==='dark'?'dark':'light';notice=payload.notice??notice;const now=new Date(),key=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
 const tasks=(state?.tasks||[]).filter(t=>t.date===key).sort((a,b)=>a.time.localeCompare(b.time)),pending=tasks.filter(t=>!t.done),minute=now.getHours()*60+now.getMinutes();
 current=pending.find(t=>{const[h,m]=t.time.split(':').map(Number),start=h*60+m;return start<=minute&&start+t.duration>minute})||pending[0];
 $('#task').textContent=current?.title||(tasks.length?'Your day is clear.':'A fresh day.');$('#time').textContent=current?.time||'';$('#done').disabled=!current||working;$('#done').hidden=!current;$('#add-first').hidden=!!current;
 $('#now-time').textContent=now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});$('#weekday').textContent=now.toLocaleDateString('en-US',{weekday:'long'});$('#date').textContent=now.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
 $('#progress').style.width=(tasks.length?100*(tasks.length-pending.length)/tasks.length:0)+'%';$('#count').textContent=(tasks.length-pending.length)+' of '+tasks.length+' complete';
 $('#later').replaceChildren();const following=pending.filter(t=>t!==current);for(let i=0;i<5;i++){const t=following[i],li=document.createElement('li');if(t){const time=document.createElement('span'),title=document.createElement('strong');time.textContent=t.time;title.textContent=t.title;li.append(time,title)}else{const plus=document.createElement('button');plus.className='empty-next';plus.textContent='+';plus.setAttribute('aria-label','Add another appointment');plus.onclick=()=>friWidget.action('add');li.append(plus)}$('#later').append(li)}
 const settings=state?.settings||{},box=$('#integrations');box.replaceChildren();
 const specs=[['weather','Weather',settings.weather,settings.weather?Math.round(settings.weather.temperature)+'° · '+settings.weather.city:''],['spotify','Spotify',settings.spotifyUrl,'Open player'],['maps','Maps',settings.mapsRegion,settings.mapsRegion||''],['activity','Activity',settings.activity?.date===key,Number(settings.activity?.steps||0).toLocaleString()+' steps · manual']];
 for(const[action,label,enabled,detail]of specs){const b=document.createElement('button');b.className='service-slot'+(enabled?'':' empty');b.setAttribute('aria-label',enabled?label:'Add '+label);if(enabled){const title=document.createElement('strong'),small=document.createElement('small');title.textContent=action==='weather'?detail:label;small.textContent=action==='weather'?(Date.now()-settings.weather.fetchedAt>3600000?'Saved forecast':'Open-Meteo'):detail;b.append(title,small)}else b.textContent='+';
 b.onclick=async()=>{b.disabled=true;try{await friWidget.action(enabled&&(action==='spotify'||action==='maps')?action:'integrations')}catch{error='Could not open '+label+'. Try again.'}finally{b.disabled=false;$('#error').textContent=error||notice}};box.append(b)}$('#error').textContent=error||notice;
}

function manipulation(handle,resize){let start=null,pointer=null,latest=null,inflight=false;
 async function apply(){if(inflight||!latest)return;inflight=true;const value=latest;latest=null;try{await friWidget.bounds(value)}catch{error='Could not change widget bounds.';$('#error').textContent=error}finally{inflight=false;if(latest)apply()}}
 handle.addEventListener('pointerdown',async e=>{if(e.button!==0||(!resize&&e.target.closest('button')))return;e.preventDefault();pointer=e.pointerId;handle.setPointerCapture(pointer);const origin={x:e.screenX,y:e.screenY};const b=await friWidget.bounds();if(pointer===e.pointerId)start={...b,...origin,sx:origin.x,sy:origin.y,bx:b.x,by:b.y}});
 handle.addEventListener('pointermove',e=>{if(!start||e.pointerId!==pointer)return;const dx=e.screenX-start.sx,dy=e.screenY-start.sy;latest={x:resize?start.bx:start.bx+dx,y:resize?start.by:start.by+dy,width:start.width+(resize?dx:0),height:start.height+(resize?dy:0)};apply()});
 const end=()=>{pointer=null;start=null};handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end);
 handle.addEventListener('keydown',async e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const b=await friWidget.bounds(),delta=e.shiftKey?40:10;if(e.key==='ArrowLeft')b[resize?'width':'x']-=delta;if(e.key==='ArrowRight')b[resize?'width':'x']+=delta;if(e.key==='ArrowUp')b[resize?'height':'y']-=delta;if(e.key==='ArrowDown')b[resize?'height':'y']+=delta;await friWidget.bounds(b)});
}
$('header').tabIndex=0;$('header').setAttribute('aria-label','Move widget with arrow keys or drag');manipulation($('header'),false);manipulation($('.resize'),true);
$('#add-first').onclick=()=>friWidget.action('add');
$('#done').onclick=async()=>{if(!current||working)return;working=true;error='';$('#done').disabled=true;try{render(await friWidget.done(current.id))}catch{error='Could not save. Try again.'}finally{working=false;if(state)render({state})}};
$('#options').onclick=()=>{const open=$('#menu').classList.toggle('open');$('#options').setAttribute('aria-expanded',open)};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>friWidget.action(b.dataset.action));document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#menu').classList.remove('open');$('#options').setAttribute('aria-expanded','false')}});friWidget.onState(render);friWidget.read().then(render).catch(()=>{$('#error').textContent='Could not open your calendar. Open FRI to try again.'});setInterval(()=>state&&render({state}),30000);
</script></html>
