<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRI desktop widget</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:#f7f7f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:6px}button{font:inherit;cursor:pointer;color:inherit}#widget{height:100%;padding:20px;border:1px solid #ffffff55;border-radius:28px;background:#242424dd;box-shadow:inset 0 1px 0 #ffffff28,0 4px 15px #0004;overflow:hidden;container-type:size;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;gap:12px;touch-action:none;cursor:grab;user-select:none;min-height:20px}header b{font-size:14px;letter-spacing:-.6px}button{-webkit-app-region:no-drag;border:0;background:#ffffff18;border-radius:50%;width:28px;height:28px}#menu{display:none;position:absolute;inset:38px 14px auto;z-index:4;padding:6px;background:#222;border:1px solid #ffffff55;border-radius:14px}#menu.open{display:grid}#menu button{border-radius:8px;width:100%;height:36px;text-align:left;padding:0 12px}#current{display:flex;gap:12px;align-items:center;flex:1;min-height:42px;margin:14px 0}#current>div{min-width:0;flex:1}#task{font-size:clamp(16px,7cqw,28px);line-height:1.15;margin:6px 0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;letter-spacing:-.6px}#time{font-size:12px;color:#ccc}#done{width:42px;height:42px;flex:none;background:#f2f2f2;color:#171717;font-size:22px}#done:disabled{opacity:.35;cursor:default}#weekday{font-size:20px;font-weight:600;letter-spacing:-.6px}#date{font-size:12px;color:#ccc;margin-top:3px}.progress{margin-top:15px}.track{height:4px;background:#ffffff25;border-radius:5px;overflow:hidden}.track i{display:block;height:100%;background:#fff;transition:width .3s}.progress small{display:block;font-size:11px;margin:7px 0;color:#ccc}#integrations{font-size:12px;padding:10px 0;display:none}#integrations .services{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}#integrations button{width:auto;height:30px;border-radius:9px;padding:0 9px;font-size:12px}#later{list-style:none;margin:0;padding:0;font-size:13px}#later li{display:flex;gap:12px;padding:9px 0;border-top:1px solid #ffffff18}#later span{color:#aaa;font-size:11px;white-space:nowrap}#later strong{font-weight:400;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.resize{position:absolute;right:14px;bottom:12px;font-size:12px;color:#aaa;touch-action:none;cursor:nwse-resize;width:28px;height:28px;background:transparent}.error{font-size:11px;color:#ddd;margin:6px 0}button:focus-visible{outline:2px solid white;outline-offset:3px}
html.windows body{padding:0}html.windows #widget{background:#242424}
@container (max-height: 380px){#later{display:none}}@container (max-height: 290px){#integrations{display:none!important}}@container (max-height: 230px){.progress{display:none}}@container (max-height: 180px){#date{display:none}}@container (max-height: 140px){#weekday{display:none}#current{margin:8px 0}}@container (max-height: 100px){header{display:none}#current{margin:0}#task{-webkit-line-clamp:2;font-size:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<section id="widget"><header><b>fri.</b><button id="options" aria-label="Widget options" aria-expanded="false">⋯</button></header><div id="menu"><button data-action="open">Open FRI</button><button data-action="remove">Remove widget</button></div><div id="current"><div><span id="time"></span><h1 id="task">Loading your day…</h1></div><button id="done" aria-label="Complete current task" disabled>✓</button></div><div id="weekday"></div><div id="date"></div><div class="progress"><div class="track"><i id="progress"></i></div><small id="count"></small></div><div id="integrations"></div><ul id="later"></ul><p id="error" class="error" role="status"></p></section><button class="resize" aria-label="Resize widget" title="Drag to resize; arrow keys resize">◢</button>
<script>
if(friWidget.platform==='win32')document.documentElement.classList.add('windows');
const $=s=>document.querySelector(s);let state,current,working=false,error='',notice='';
function render(payload){state=payload.state;notice=payload.notice??notice;const now=new Date(),key=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-'),tasks=(state?.tasks||[]).filter(t=>t.date===key).sort((a,b)=>a.time.localeCompare(b.time)),pending=tasks.filter(t=>!t.done),minute=now.getHours()*60+now.getMinutes();current=pending.find(t=>{const [h,m]=t.time.split(':').map(Number),start=h*60+m;return start<=minute&&start+t.duration>minute})||pending[0];$('#task').textContent=current?.title||(tasks.length?'Your day is clear.':'A fresh day.');$('#time').textContent=current?.time||'';$('#done').disabled=!current||working;$('#weekday').textContent=now.toLocaleDateString('en-US',{weekday:'long'});$('#date').textContent=now.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});$('#progress').style.width=(tasks.length?100*(tasks.length-pending.length)/tasks.length:0)+'%';$('#count').textContent=(tasks.length-pending.length)+' of '+tasks.length+' complete';$('#later').replaceChildren();for(const t of pending.filter(t=>t!==current).slice(0,5)){const li=document.createElement('li'),time=document.createElement('span'),title=document.createElement('strong');time.textContent=t.time;title.textContent=t.title;li.append(time,title);$('#later').append(li)}const settings=state?.settings||{},weather=settings.weather,box=$('#integrations');box.replaceChildren();if(weather){const line=document.createElement('div');line.textContent=weather.city+' · '+Math.round(weather.temperature)+'°C · '+(Date.now()-weather.fetchedAt>3600000?'Saved forecast':'Open-Meteo');box.append(line)}const services=document.createElement('div');services.className='services';for(const [action,label,enabled] of [['spotify','Spotify',settings.spotifyUrl],['maps','Maps',settings.mapsRegion]])if(enabled){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{b.disabled=true;error='';try{await friWidget.action(action)}catch{error='Could not open '+label+'. Open FRI to reconnect.'}finally{b.disabled=false;$('#error').textContent=error||notice}};services.append(b)}if(settings.activity?.date===key){const steps=document.createElement('div');steps.textContent=Number(settings.activity.steps||0).toLocaleString()+' steps · manual';box.append(steps)}if(services.childElementCount)box.append(services);box.style.display=box.childElementCount?'block':'none';$('#error').textContent=error||notice}

function manipulation(handle,resize){let start=null,pointer=null,latest=null,inflight=false;
 async function apply(){if(inflight||!latest)return;inflight=true;const value=latest;latest=null;try{await friWidget.bounds(value)}catch{error='Could not change widget bounds.';$('#error').textContent=error}finally{inflight=false;if(latest)apply()}}
 handle.addEventListener('pointerdown',async e=>{if(e.button!==0||(!resize&&e.target.closest('button')))return;e.preventDefault();pointer=e.pointerId;handle.setPointerCapture(pointer);const origin={x:e.screenX,y:e.screenY};const b=await friWidget.bounds();if(pointer===e.pointerId)start={...b,...origin,sx:origin.x,sy:origin.y,bx:b.x,by:b.y}});
 handle.addEventListener('pointermove',e=>{if(!start||e.pointerId!==pointer)return;const dx=e.screenX-start.sx,dy=e.screenY-start.sy;latest={x:resize?start.bx:start.bx+dx,y:resize?start.by:start.by+dy,width:start.width+(resize?dx:0),height:start.height+(resize?dy:0)};apply()});
 const end=()=>{pointer=null;start=null};handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end);
 handle.addEventListener('keydown',async e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const b=await friWidget.bounds(),delta=e.shiftKey?40:10;if(e.key==='ArrowLeft')b[resize?'width':'x']-=delta;if(e.key==='ArrowRight')b[resize?'width':'x']+=delta;if(e.key==='ArrowUp')b[resize?'height':'y']-=delta;if(e.key==='ArrowDown')b[resize?'height':'y']+=delta;await friWidget.bounds(b)});
}
$('header').tabIndex=0;$('header').setAttribute('aria-label','Move widget with arrow keys or drag');manipulation($('header'),false);manipulation($('.resize'),true);
$('#done').onclick=async()=>{if(!current||working)return;working=true;error='';$('#done').disabled=true;try{render(await friWidget.done(current.id))}catch{error='Could not save. Try again.'}finally{working=false;if(state)render({state})}};
$('#options').onclick=()=>{const open=$('#menu').classList.toggle('open');$('#options').setAttribute('aria-expanded',open)};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>friWidget.action(b.dataset.action));document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#menu').classList.remove('open');$('#options').setAttribute('aria-expanded','false')}});friWidget.onState(render);friWidget.read().then(render).catch(()=>{$('#error').textContent='Could not open your calendar. Open FRI to try again.'});setInterval(()=>state&&render({state}),30000);
</script></html>
