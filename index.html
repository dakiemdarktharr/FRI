  document.querySelector('#top').innerHTML = `<div class="top-label">${mobile.matches ? brand() : `${icon(pages[page][1])}<span>${pages[page][0]}</span>`}</div><div class="top-actions">${button('Tìm mục', 'search',{icon:'search',iconOnly:true,kind:'ghost'})}${mobile.matches ? button('Cài đặt','page',{id:'settings',icon:'settings',iconOnly:true,kind:'ghost'}) : ''}${button('Thêm nguồn','intake',{icon:'sources',iconOnly:mobile.matches})}${button('Thêm hẹn','appointment',{icon:'plus',primary:true,kind:hasAppointmentDraft() ? 'appointment-pending' : ''})}</div>`;
  if (hasAppointmentDraft()) document.querySelector('#top [data-action="appointment"]').title = 'Tiếp tục bản nháp hẹn';
}

function render({keepFocus = false} = {}) {
  const active = keepFocus ? document.activeElement?.closest('[data-action]') : null;
  applyTheme();
  renderChrome();
  const content = {today:() => calendarPage(true),calendar:() => calendarPage(false),sources:sourcesPage,review:reviewPage,widgets:widgetsPage,settings:settingsPage};
  main.innerHTML = `${!isOnline() ? '<div class="notice warn" style="margin-bottom:10px">Đang ngoại tuyến. Bạn vẫn có thể thêm ảnh, dán văn bản và xếp lịch đã lưu.</div>' : ''}${storageError || loadHadError ? '<div class="notice danger" role="alert" style="margin-bottom:10px">Không thể đọc hoặc ghi kho dữ liệu của trình duyệt. Hãy giữ tab này mở để tiếp tục với dữ liệu trong phiên.</div>' : ''}${content[page]()}`;
  if (active && !drawer.open) focusAction(active);
  document.title = `${pages[page][0]} · Fri`;
}

function focusAction(element) {
  if (element?.isConnected && element.getClientRects().length) return element.focus({preventScroll:true});
  if (!element?.dataset?.action) return false;
  const next = [...document.querySelectorAll('[data-action]')].find(node => node.getClientRects().length && node.dataset.action === element.dataset.action && node.dataset.id === element.dataset.id);
  if (next) next.focus({preventScroll:true});
  return Boolean(next);
}

function go(next, {hash = true, focus = true} = {}) {
  if (!Object.hasOwn(pages, next)) return;
  if (drawer.open) closeDialog();
  page = next;
  if (hash && location.hash !== `#${next}`) history.pushState(null,'',`#${next}`);
  render();
  window.scrollTo(0,0);
  if (focus) main.focus({preventScroll:true});
}

function openDialog(title, body) {
  const wasOpen = drawer.open;
  if (!wasOpen) restoreFocus = document.activeElement;
  document.querySelector('#dialog-title').textContent = title;
  dialogBody.innerHTML = body;
  if (!wasOpen) drawer.showModal();
  drawer.scrollTop = 0;
  const firstInput = dialogBody.querySelector('[autofocus]') || dialogBody.querySelector('input:not([type=hidden]),textarea,select');
  (firstInput ?? document.querySelector('#close-dialog')).focus({preventScroll:true});
}

function closeDialog() {
  if (drawer.open) drawer.close();
}

function timeRange(item) {
  if (!Number.isFinite(item.start)) return item.kind === 'task' ? 'Chưa xếp' : item.kind === 'deadline' && !item.allDay ? 'Chưa rõ giờ' : 'Cả ngày';
  return item.kind === 'deadline' || !Number.isFinite(item.end) || item.start === item.end ? time(item.start) : `${time(item.start)}–${time(item.end)}`;
}

function visibleItem(item) {
  if (item.kind !== 'trip') return item;
  return {...item,...(D.travelBlock(item) || {})};
}

function snapshotForDate(date) {
  const now = state.demo ? 420 : date === realDate() ? D.parseTime(clockFormat.format(new Date())) : 0;
  return D.snapshot(state.items,date,state.revision,now);
}

function sortedItems(date) {
  return state.items.filter(item => D.isDayItem(item,date)).map(item => {
    const visible = visibleItem(item);
    if (item.kind === 'trip' && visible.leaveDate !== visible.date) {
      return date === visible.leaveDate ? {...visible,start:visible.leaveAt,end:1440} : {...visible,start:0};
    }
    return {...visible,start:!visible.allDay && date > item.date ? 0 : visible.start,end:!visible.allDay && item.endDate > date ? 1440 : visible.end};
  }).sort((a,b) => (a.start ?? -1) - (b.start ?? -1) || (a.kind === 'context' ? -1 : 0) - (b.kind === 'context' ? -1 : 0));
}

function itemLine(item) {
  const [label, glyph] = kinds[item.kind] || kinds.fixed;
  return `<button type="button" class="agenda-row kind-${e(item.kind)}${item.kind === 'child' ? ' child' : ''}" data-action="item" data-id="${e(item.id)}"><span class="when">${Number.isFinite(item.start) ? time(item.start) : timeRange(item)}</span><span class="event-icon">${icon(glyph)}</span><span><strong>${e(item.title)}</strong><small>${e(label)}${item.kind === 'child' && item.parentId ? ` · ${e(state.items.find(parent => parent.id === item.parentId)?.title ?? '')}` : ''}${item.location ? ` · ${e(item.location)}` : ''}${item.done ? ' · Đã xong' : ''}${item.locked ? ' · Đã khóa' : ''}</small></span>${icon(item.done ? 'check' : 'right')}</button>`;
}

function agenda(date, extra = '') {
  const items = sortedItems(date);
  return `<div class="agenda ${extra}">${items.length ? items.map(itemLine).join('') : empty('Ngày này chưa có lịch','Thêm một hẹn hoặc chọn ngày khác.',button('Thêm hẹn','appointment',{icon:'plus',id:date}))}</div>`;
}

function dayPick(date, {week = true, outside = false} = {}) {
  const day = weekdays[(new Date(date).getUTCDay() + 6) % 7];
  return `<button type="button" class="day-pick${outside ? ' outside' : ''}" data-action="date" data-id="${date}" aria-label="${e(fullDay(date))}" aria-pressed="${date === selectedDate}">${week ? `<span>${day}</span>` : ''}<b>${Number(date.slice(8,10))}</b>${!week ? `<span class="dots">${sortedItems(date).slice(0,3).map(item => `<i class="pip kind-${e(item.kind)}"></i>`).join('')}</span>` : ''}</button>`;
}

function week(date) {
  const monday = D.startOfWeek(date);
  const days = Array.from({length:7},(_, index) => D.addDays(monday,index));
  const all = days.map(sortedItems);
  const timed = all.flat().filter(item => Number.isFinite(item.start));
  const firstHour = Math.min(7,...timed.map(item => Math.floor(item.start / 60)));
  const lastHour = Math.min(24,Math.max(18,...timed.map(item => Math.ceil(Math.max(item.start + 20,item.end ?? item.start) / 60))));
  const hours = Array.from({length:lastHour-firstHour},(_, index) => firstHour + index);
  const untimed = all.filter((items, index) => days[index] === date).flat().filter(item => !Number.isFinite(item.start));
  return `<div class="week-head"><small>GMT+7</small>${days.map(day => dayPick(day)).join('')}</div><div class="week-grid" style="--slots:${hours.length}"><div class="time-axis" aria-hidden="true">${hours.map((hour,index) => `<span class="hour" style="top:calc(${index} * var(--slot))">${time(hour*60)}</span>`).join('')}</div>${days.map((day,index) => `<div class="day-lane${day === date ? ' selected' : ''}" aria-label="${e(fullDay(day))}">${all[index].filter(item => Number.isFinite(item.start)).sort((a,b) => (a.kind === 'context' ? -1 : 0) - (b.kind === 'context' ? -1 : 0)).map((item,_,items) => weekBlock(item,firstHour,items)).join('')}</div>`).join('')}</div>${untimed.length ? `<div class="agenda untimed">${untimed.map(itemLine).join('')}</div>` : ''}${agenda(date,'mobile-agenda')}<div class="week-footer">${Object.entries(kinds).map(([key,[label]]) => `<span class="legend-mark kind-${key}"><i class="pip"></i>${label}</span>`).join('')}</div>`;
}

function weekBlock(item, firstHour, items) {
  const label = kinds[item.kind]?.[0] ?? 'Mục lịch';
  const top = (item.start - firstHour*60) / 60;
  const duration = (Math.max(item.start + 20,item.end ?? item.start) - item.start) / 60;
  const overlapping = items.filter(other => item.kind !== 'context' && item.kind !== 'child' && other.kind !== 'context' && other.kind !== 'child' && other.start < Math.max(item.start + 20,item.end ?? item.start) && item.start < Math.max(other.start + 20,other.end ?? other.start));
  const offset = overlapping.length > 1 ? `;left:calc(${overlapping.indexOf(item) * (100 / overlapping.length)}% + 4px);width:calc(${100 / overlapping.length}% - 7px);right:auto` : '';
  return `<button type="button" class="block kind-${e(item.kind)} ${e(item.kind)}${duration < .76 ? ' compact' : ''}${item.done ? ' is-done' : ''}" data-action="item" data-id="${e(item.id)}" style="--top:${top};--len:${duration}${offset}" aria-label="${e(`${item.title}, ${label}, ${timeRange(item)}`)}" title="${e(`${label} · ${timeRange(item)} · ${item.title}`)}"><span>${time(item.start)}${item.kind === 'child' ? ' · Con' : item.kind === 'deadline' ? ' · Hạn' : ''}</span><strong>${e(item.title)}</strong></button>`;
}

function month(date) {
  const start = D.startOfWeek(`${date.slice(0,7)}-01`);
  const days = Array.from({length:42},(_, index) => D.addDays(start,index));
  return `<div class="month-grid">${weekdays.map(day => `<div class="month-header">${day}</div>`).join('')}${days.map(day => dayPick(day,{week:false,outside:day.slice(0,7)!==date.slice(0,7)})).join('')}</div>${agenda(date)}`;
}

function list(date) {
  const start = D.startOfWeek(date);
  const dates = Array.from({length:7},(_, index) => D.addDays(start,index));
  const groups = dates.map(day => [day,sortedItems(day)]).filter(([,items]) => items.length);
  return `<div class="agenda">${groups.length ? groups.map(([day,items]) => `<p class="day-group">${e(readableDate(day))}</p>${items.map(itemLine).join('')}`).join('') : empty('Tuần này chưa có lịch','Chọn một tuần khác hoặc tạo mục mới.')}</div>`;
}

function selectedRange(view) {
  if (view === 'month') return monthFormat.format(new Date(selectedDate));
  if (view === 'day') return readableDate(selectedDate);
  const from = D.startOfWeek(selectedDate);
  const to = D.addDays(from,6);
  return `${dateShort(from)} – ${dateShort(to)}/${to.slice(0,4)}`;
}

function calendarPage(today) {
  const view = calendarView;
  const start = D.startOfWeek(selectedDate);
  const strip = `<div class="week-head day-strip">${Array.from({length:7},(_,index) => dayPick(D.addDays(start,index))).join('')}</div>`;
  const summary = view === 'day' ? strip + agenda(selectedDate) : view === 'month' ? month(selectedDate) : view === 'list' ? list(selectedDate) : week(selectedDate);
  const range = selectedRange(view);
  const toolbar = `<div class="cal-tools"><div class="cal-left">${button('Hôm nay','today')}${button('Trước','shift',{id:'-1',icon:'left',iconOnly:true})}${button('Sau','shift',{id:'1',icon:'right',iconOnly:true})}<button type="button" class="cal-range" data-action="date-jump" aria-label="${e(`Chọn ngày, ${range}`)}">${e(range)}</button></div><div class="segment" role="group" aria-label="Chế độ lịch">${Object.entries(views).map(([key,label]) => `<button type="button" data-action="view" data-id="${key}" aria-pressed="${key === view}">${label}</button>`).join('')}</div></div>`;
  return `${intro(today ? 'Không gian kế hoạch' : 'Kế hoạch cá nhân', today ? 'Lịch của bạn' : 'Lịch', `${readableDate(selectedDate)} · Giờ Việt Nam${state.demo ? ' · Lịch mẫu' : ''}`,button('Xếp việc','plan',{icon:'spark'}))}${mobileGlance()}<div class="split"><section class="card calendar" aria-label="Lịch">${toolbar}${summary}</section><aside class="stack aside" aria-label="Tóm tắt kế hoạch">${dailyAside()}</aside></div>`;
}

function mobileGlance() {
  const {next,trip} = snapshotForDate(selectedDate);
  const entry = (label,text,name,item) => `<button type="button" data-action="${item ? 'item' : 'item-new'}" data-id="${e(item?.id || 'trip')}"><i class="event-icon kind-${e(item?.kind || 'trip')}">${icon(name)}</i><span><span class="caption">${e(label)}</span><strong>${e(text)}</strong></span></button>`;
  if (!next && !trip) return '';
  return `<div class="card mobile-glance" aria-label="Xem nhanh">${entry('Di chuyển',trip ? `Rời đi ${time(trip.leaveAt)}` : 'Thêm chuyến đi','route',trip)}${next ? entry('Tiếp theo',`${Number.isFinite(next.start) ? `${time(next.start)} · ` : ''}${next.title}`,'calendar',next) : ''}</div>`;
}

function dailyAside() {
  const items = sortedItems(selectedDate);
  const trip = items.find(item => item.kind === 'trip' && Number.isFinite(item.start));
  const report = D.plan(state.items,selectedDate);
  const problems = [...report.conflicts,...report.shortages];
  const next = items.filter(item => !['context','trip'].includes(item.kind) && !item.done && (Number.isFinite(item.start) || item.kind === 'deadline')).slice(0,4);
  const snapshot = snapshotForDate(selectedDate);
  const tripCard = trip ? `<button type="button" class="journey-hit" data-action="item" data-id="${e(trip.id)}"><div class="journey-top">${badge('Rời đi','warn')}${icon('route')}</div><div class="big-time">${time(trip.leaveAt)}</div><h3>${e(trip.destination || trip.title)}</h3><p class="muted">${e(trip.origin || 'Điểm xuất phát chưa rõ')}${trip.leaveDate !== selectedDate ? ` · ${dateShort(trip.leaveDate)}` : ''}</p><div class="journey-meta"><span>${time(trip.arriveBy ?? trip.end)} có mặt${trip.date !== selectedDate ? ` · ${dateShort(trip.date)}` : ''}</span><span>·</span><span>${e(trip.duration)} phút đi + ${e(trip.buffer ?? 0)} phút đệm</span></div></button>` : `<div class="journey-top">${badge('Di chuyển')}${icon('route')}</div><h3>Chưa có chuyến đi</h3><p class="muted">Thêm chuyến đi để tính giờ rời đi.</p><button type="button" class="link-btn" data-action="item-new" data-id="trip">Thêm chuyến đi</button>`;
  const nextCard = next.length ? next.map(item => `<button type="button" class="mini-row kind-${e(item.kind)}" data-action="item" data-id="${e(item.id)}"><i class="pip"></i><span>${e(item.title)}</span><span>${Number.isFinite(item.start) ? time(item.start) : timeRange(item)}</span></button>`).join('') : '<p class="muted">Bạn chưa có mục nào sắp tới.</p>';
  return `<section class="card panel journey" aria-label="Giờ rời đi">${tripCard}</section><section class="card panel"><div class="section-title"><h2>Trong ngày</h2><span class="caption">${dateShort(selectedDate)}</span></div>${nextCard}<div class="callout"><div class="section-title" style="margin:0"><strong>Tiến độ</strong><span class="muted">${snapshot.completed}/${snapshot.total}</span></div><div class="progress" role="progressbar" aria-label="Tiến độ ngày" aria-valuemin="0" aria-valuemax="${Math.max(1,snapshot.total)}" aria-valuenow="${snapshot.completed}"><i style="width:${snapshot.total ? 100*snapshot.completed/snapshot.total : 0}%"></i></div></div></section><section class="card panel"><div class="section-title"><h2>Cần để ý</h2>${icon('warning')}</div>${problems.length ? `<p class="muted">${e(problems[0].message || problems[0].title)}</p><button class="link-btn" type="button" data-action="plan">Xem ${problems.length} lưu ý</button>` : `<p class="muted">Chưa thấy xung đột trong ngày.</p>${state.items.some(item => item.kind === 'task' && !Number.isFinite(item.start) && item.date === selectedDate) ? '<button class="link-btn" type="button" data-action="plan">Xem việc chờ xếp</button>' : ''}`}</section>`;
}

function shiftDate(amount) {
  if (calendarView === 'month') {
    const [year, month, day] = selectedDate.split('-').map(Number);
    const first = new Date(Date.UTC(year,month - 1 + amount,1));
    const maxDay = new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate();
    first.setUTCDate(Math.min(day,maxDay));
    return first.toISOString().slice(0,10);
  }
  return D.addDays(selectedDate, amount * (calendarView === 'day' ? 1 : 7));
}

const option = (value,label,selected) => `<option value="${e(value)}"${value === selected ? ' selected' : ''}>${e(label)}</option>`;
const input = (name,value = '',attributes = '') => `<input name="${e(name)}" value="${e(value)}" ${attributes}>`;

function readAppointmentBatch() {
  try {
    const batch = JSON.parse(localStorage.getItem(APPOINTMENT_KEY));
    if (batch?.version === 1 && batch.id && Array.isArray(batch.rows) && batch.current?.id && ['entry','review'].includes(batch.phase)) return batch;
  } catch {
    // A previously unavailable store can still be used for this session's input.
  }
  return null;
}

function blankAppointment() {
  return {id:id(),title:'',date:'',start:'',end:'',location:'',notes:'',overnight:false};
}

function hasAppointmentValues(row) {
  return Boolean(row && (row.title || row.date || row.start || row.end || row.location || row.notes || row.overnight));
}

function hasAppointmentDraft() {
  return Boolean(appointmentBatch?.rows.length || hasAppointmentValues(appointmentBatch?.current));
}

function writeAppointmentDraft() {
  try {
    if (hasAppointmentDraft()) localStorage.setItem(APPOINTMENT_KEY,JSON.stringify(appointmentBatch));
    else localStorage.removeItem(APPOINTMENT_KEY);
    appointmentStorageError = false;
    return true;
  } catch {
    appointmentStorageError = true;
    return false;
  }
}

function appointmentSaveStatus(form) {
  const storageHint = form.querySelector('[data-appointment-storage]');
  storageHint.hidden = writeAppointmentDraft();
}

function appointmentEntryValues(form) {
  const values = Object.fromEntries(new FormData(form));
  return {...appointmentBatch.current,...values,overnight:values.overnight === 'on'};
}

function updateAppointmentDraft(event) {
  const form = event.target.form;
  if (!appointmentBatch || !form) return;
  if (form.id === 'appointment-entry-form') {
    const hadDraft = hasAppointmentDraft();
    appointmentBatch.current = appointmentEntryValues(form);
    if (hadDraft !== hasAppointmentDraft()) form.querySelector('[data-appointment-secondary]').innerHTML = appointmentSecondary();
  } else if (form.id === 'appointment-review-form') {
    appointmentBatch.answer = {...Object.fromEntries(new FormData(form)),rowId:form.dataset.rowId,field:form.dataset.field};
  } else return;
  if (event.target.getAttribute('aria-invalid') === 'true') {
    event.target.removeAttribute('aria-invalid');
    form.querySelector('[data-error]').hidden = true;
  }
  appointmentSaveStatus(form);
}

function appointmentQueue(rows) {
  if (!rows.length) return '';
  return `<p class="caption">Trong danh sách · ${rows.length} hẹn</p><ul class="appointment-queue" aria-label="Danh sách hẹn nháp">${rows.map(row => {
    const missing = D.appointmentQuestions([row]).length;
    return `<li><div><strong>${e(row.title)}</strong><p class="muted">${row.date ? e(dateShort(row.date)) + ' · ' : ''}${missing ? `Còn ${missing} thông tin cần bổ sung` : `${e(row.start)}–${e(row.end)}${row.overnight ? ' (+1 ngày)' : ''}`}</p></div>${button(`Sửa ${row.title}`,'appointment-edit',{id:row.id,icon:'text',iconOnly:true,kind:'ghost'})}${button(`Xóa ${row.title}`,'appointment-remove',{id:row.id,icon:'close',iconOnly:true,kind:'ghost'})}</li>`;
  }).join('')}</ul>`;
}

const appointmentLabels = {title:'Tên hẹn',date:'Ngày',start:'Bắt đầu',end:'Kết thúc'};
const appointmentTypes = {title:'text',date:'date',start:'time',end:'time'};
const appointmentPrompts = {title:'Cuộc hẹn này tên gì?',date:'Cuộc hẹn diễn ra ngày nào?',start:'Cuộc hẹn bắt đầu lúc mấy giờ?',end:'Cuộc hẹn kết thúc lúc mấy giờ?'};
const appointmentStorageHint = () => `<p class="error" data-appointment-storage role="status"${appointmentStorageError ? '' : ' hidden'}>Trình duyệt chưa lưu được bản nháp. Hãy giữ tab này mở.</p>`;

function appointmentInput(fieldName,value,attributes = '') {
  const detail = fieldName === 'title' ? ' maxlength="160" placeholder="Ví dụ: Họp nhóm"' : '';
  return field(appointmentLabels[fieldName],input(fieldName,value,`type="${appointmentTypes[fieldName]}"${detail} ${attributes}`));
}

function appointmentOvernight(checked) {
  return `<label class="field check"><input type="checkbox" name="overnight"${checked ? ' checked' : ''}>Kết thúc vào ngày hôm sau</label>`;
}

function appointmentSecondary() {
  return hasAppointmentDraft() ? button('Bỏ bản nháp','appointment-discard',{kind:'ghost'}) : button('Tạo mục khác','item-new',{kind:'ghost'});
}

function openAppointmentEntry() {
  const {current,rows} = appointmentBatch;
  const editing = rows.some(row => row.id === current.id);
  openDialog('Thêm hẹn',`<form class="form appointment-entry" id="appointment-entry-form" novalidate>
    <p class="muted">Chọn <strong>Xong</strong> để rà thông tin còn thiếu. Lịch dùng giờ Việt Nam.</p>
    ${appointmentInput('title',current.title,'required autofocus')}
    ${appointmentInput('date',current.date)}
    <div class="form-grid">${appointmentInput('start',current.start)}${appointmentInput('end',current.end)}</div>
    ${appointmentOvernight(current.overnight)}
    ${field('Địa điểm (tùy chọn)',input('location',current.location,'maxlength="160"'))}
    ${field('Ghi chú (tùy chọn)',`<textarea name="notes" maxlength="1500">${e(current.notes)}</textarea>`)}
    ${appointmentQueue(rows)}
    <p class="error" data-error role="alert" hidden></p>${appointmentStorageHint()}
    <div class="actions appointment-actions"><div class="actions" data-appointment-secondary>${appointmentSecondary()}</div><div class="actions"><button class="btn" type="submit" value="next">${editing ? 'Lưu và thêm hẹn' : 'Hẹn mới'}</button><button class="btn primary" type="submit" value="done">Xong</button></div></div>
  </form>`);
}

function openAppointment(date) {
  reconcileAppointmentDraft();
  if (!appointmentBatch) {
    const current = blankAppointment();
    if (validDate(date)) current.date = date;
    appointmentBatch = {version:1,id:id(),rows:[],current,phase:'entry',answered:0,answer:null};
  }
  if (appointmentBatch.phase === 'review') return openAppointmentQuestion();
  openAppointmentEntry();
}

function upsertAppointment(row) {
  const index = appointmentBatch.rows.findIndex(candidate => candidate.id === row.id);
  if (index < 0) appointmentBatch.rows.push(row);
  else appointmentBatch.rows[index] = row;
}

function stageAppointment(form, allowBlank) {
  const row = appointmentEntryValues(form);
  if (!allowBlank || hasAppointmentValues(row)) {
    if (!row.title.trim()) {
      showFormError(form,'Nhập tên hẹn trước khi tiếp tục.');
      form.elements.title.setAttribute('aria-invalid','true');
      form.elements.title.focus();
      return false;
    }
    upsertAppointment({...row,title:row.title.trim()});
  }
  appointmentBatch.current = blankAppointment();
  return true;
}

function submitAppointmentEntry(form, done) {
  if (!stageAppointment(form,done && appointmentBatch.rows.length > 0)) return;
  if (!done) {
    writeAppointmentDraft();
    openAppointmentEntry();
    announce(`Đã lưu ${appointmentBatch.rows.length} hẹn nháp. Nhập hẹn tiếp theo.`);
    return;
  }
  appointmentBatch.phase = 'review';
  appointmentBatch.answered = 0;
  writeAppointmentDraft();
  if (D.appointmentQuestions(appointmentBatch.rows).length) openAppointmentQuestion();
  else commitAppointments();
}

function editAppointmentDraft(rowId) {
  const form = dialogBody.querySelector('#appointment-entry-form');
  if (!form || !stageAppointment(form,true)) return;
  const row = appointmentBatch.rows.find(candidate => candidate.id === rowId);
  if (!row) return;
  appointmentBatch.current = {...row};
  writeAppointmentDraft();
  openAppointmentEntry();
}

function removeAppointmentDraftRow(rowId) {
  appointmentBatch.rows = appointmentBatch.rows.filter(row => row.id !== rowId);
  if (appointmentBatch.current.id === rowId) appointmentBatch.current = blankAppointment();
  if (appointmentBatch.answer?.rowId === rowId) appointmentBatch.answer = null;
  writeAppointmentDraft();
  openAppointmentEntry();
  announce('Đã bỏ một hẹn nháp.');
}

function openAppointmentQuestion() {
  const {rows,answered,answer} = appointmentBatch;
  const questions = D.appointmentQuestions(rows);
  if (!questions.length) return openAppointmentRetry();
  const question = questions[0];
  const row = rows.find(candidate => candidate.id === question.rowId);
  const fieldName = question.field;
  const draftAnswer = answer?.rowId === row.id && answer.field === fieldName ? answer : null;
  const total = answered + questions.length;
  const stage = `Câu ${answered + 1}/${total}`;
  const help = question.reason === 'order' ? 'Giờ kết thúc phải sau giờ bắt đầu, hoặc hãy chọn kết thúc vào ngày hôm sau.' : question.reason === 'overnight-range' ? 'Chọn ngày có thể lưu cuộc hẹn kết thúc vào hôm sau.' : appointmentPrompts[fieldName];
  const context = [fieldName !== 'date' && row.date ? dateShort(row.date) : null,fieldName === 'end' && row.start ? `Bắt đầu ${row.start}` : null].filter(Boolean).join(' · ');
  openDialog('Bổ sung thông tin',`<form class="form" id="appointment-review-form" data-row-id="${e(row.id)}" data-field="${fieldName}" novalidate>
    <div class="appointment-question"><div class="section-title" style="margin:0"><span class="caption">${stage}</span><span class="muted">${rows.length} hẹn nháp</span></div>
    <div class="progress" role="progressbar" aria-label="Tiến độ bổ sung thông tin" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${answered}"><i style="width:${100 * answered / total}%"></i></div>
    <h3>${e(row.title || 'Hẹn chưa có tên')}</h3>${context ? `<p class="caption">${e(context)}</p>` : ''}<p class="muted" id="appointment-question-help">${e(help)}</p>
    ${appointmentInput(fieldName,draftAnswer?.[fieldName] ?? row[fieldName],'required autofocus aria-describedby="appointment-question-help"')}
    ${fieldName === 'end' ? appointmentOvernight(draftAnswer ? draftAnswer.overnight === 'on' : row.overnight) : ''}
    <p class="error" data-error role="alert" hidden></p>${appointmentStorageHint()}</div>
    <div class="actions appointment-actions">${button('Quay lại danh sách','appointment-back')}<button class="btn primary" type="submit">Tiếp tục</button></div>
  </form>`);
  announce(`${stage}. ${row.title}. ${help}`);
}

function answerAppointmentQuestion(form) {
  const {rowId,field:fieldName} = form.dataset;
  const row = appointmentBatch.rows.find(candidate => candidate.id === rowId);
  const question = D.appointmentQuestions(appointmentBatch.rows)[0];
  if (!row || question?.rowId !== rowId || question.field !== fieldName) return openAppointment();
  const values = new FormData(form);
  const updated = {...row,[fieldName]:String(values.get(fieldName) ?? '').trim()};
  if (fieldName === 'end') updated.overnight = values.has('overnight');
  const issue = D.appointmentQuestions([updated]).find(candidate => candidate.field === fieldName);
  if (issue) {
    showFormError(form,issue.reason === 'order' ? 'Giờ kết thúc phải sau giờ bắt đầu.' : `Nhập ${appointmentLabels[fieldName].toLocaleLowerCase('vi')} hợp lệ.`);
    form.elements[fieldName].setAttribute('aria-invalid','true');
    form.elements[fieldName].focus();
    return;
  }
  upsertAppointment(updated);
  appointmentBatch.answered += 1;
  appointmentBatch.answer = null;
  writeAppointmentDraft();
  if (D.appointmentQuestions(appointmentBatch.rows).length) openAppointmentQuestion();
  else commitAppointments();
}

function openAppointmentRetry(message = 'Các hẹn đã đủ thông tin và sẵn sàng đưa lên lịch.') {
  openDialog('Lưu hẹn',`<div class="form"><p class="notice">${e(message)}</p><div class="actions end">${button('Quay lại danh sách','appointment-back')}${button('Lưu vào lịch','appointment-commit',{primary:true,icon:'check'})}</div></div>`);
}

function commitAppointments() {
  const items = appointmentBatch?.rows.map(D.appointmentItem);
  if (!items?.length) return openAppointment();
  if (items.some(item => !item)) return openAppointmentRetry('Kiểm tra ngày và giờ trong danh sách hẹn.');
  const latest = readSaved();
  if (latest?.revision > state.revision) state = latest;
  const existingIds = new Set(state.items.map(item => item.id));
  const additions = items.filter(item => !existingIds.has(item.id));
  const previousState = state;
  const previousDate = selectedDate;
  const previousView = calendarView;
  state = {...state,items:state.items.concat(additions),lastAppointmentBatchId:appointmentBatch.id};
  selectedDate = items[0].date;
  calendarView = 'day';
  persist({bump:additions.length > 0});
  if (storageError) {
    state = previousState;
    selectedDate = previousDate;
    calendarView = previousView;
    return openAppointmentRetry('Trình duyệt chưa ghi được lịch. Bản nháp vẫn mở để bạn thử lại.');
  }
  clearAppointmentDraft();
  go('calendar');
  notify(`Đã thêm ${items.length} hẹn vào lịch.`,additions.length ? () => undoAppointments(additions) : undefined);
}

function undoAppointments(items) {
  const latest = readSaved();
  if (latest?.revision > state.revision) state = latest;
  const ids = new Set(items.map(item => item.id));
  const previous = state;
  state = {...state,items:state.items.filter(item => !ids.has(item.id))};
  persist({bump:true});
  if (storageError) {
    state = previous;
    return notify('Trình duyệt chưa hoàn tác được.');
  }
  render();
  notify(`Đã hoàn tác thêm ${items.length} hẹn.`);
}

function clearAppointmentDraft() {
  appointmentBatch = null;
  writeAppointmentDraft();
}

function reconcileAppointmentDraft() {
  if (appointmentBatch && appointmentBatch.id === state.lastAppointmentBatchId) clearAppointmentDraft();
}

function changeAppointmentStage(action, rowId) {
  switch (action) {
    case 'appointment': return openAppointment(rowId);
    case 'appointment-edit': return editAppointmentDraft(rowId);
    case 'appointment-remove': return removeAppointmentDraftRow(rowId);
    case 'appointment-back':
      appointmentBatch.phase = 'entry';
      writeAppointmentDraft();
      return openAppointmentEntry();
    case 'appointment-commit': return commitAppointments();
    case 'appointment-discard': return openDialog('Bỏ bản nháp',`<div class="form"><p>Bỏ các hẹn đang nhập? Lịch đã lưu vẫn giữ nguyên.</p><div class="actions end">${button('Giữ bản nháp','appointment')}${button('Bỏ bản nháp','appointment-discard-confirm',{primary:true})}</div></div>`);
    case 'appointment-discard-confirm':
      clearAppointmentDraft();
      closeDialog();
      renderChrome();
      return notify('Đã bỏ bản nháp.');
  }
}

function itemForm(item, kind = item?.kind || 'fixed', draft = {}) {
  const data = {title:'',date:selectedDate,location:'',effort:60,duration:30,buffer:5,...item,...draft,kind};
  const flex = kind === 'task';
  const trip = kind === 'trip';
  const deadline = kind === 'deadline';
  const child = kind === 'child';
  const timed = !trip && !deadline;
  const endDate = data.endDate || data.date;
  const parents = state.items.filter(candidate => candidate.kind === 'fixed' && candidate.id !== item?.id);
  const typeField = field('Loại mục',`<select name="kind" data-item-kind>${Object.entries(kinds).map(([key,[label]]) => option(key,label,kind)).join('')}</select>`);
  const title = field('Tên mục',input('title',data.title,'required maxlength="160" autofocus placeholder="Ví dụ: Duyệt slide với nhóm"'));
  const day = field(deadline ? 'Ngày nộp' : trip ? 'Ngày cần có mặt' : 'Ngày',input('date',data.date,'type="date" required'));
  const place = trip ? '' : field('Địa điểm',input('location',data.location,'maxlength="160" placeholder="Không bắt buộc"'));
  const notes = item?.notes !== undefined ? field('Ghi chú (tùy chọn)',`<textarea name="notes" maxlength="1500">${e(data.notes)}</textarea>`) : '';
  const allDay = (kind === 'fixed' || kind === 'context') ? `<label class="field check"><input type="checkbox" name="allDay"${data.allDay === true || data.allDay === 'on' ? ' checked' : ''}>Cả ngày</label>` : '';
  const start = (timed || deadline) ? field(deadline ? 'Giờ nộp' : flex ? 'Bắt đầu (tùy chọn)' : 'Bắt đầu',input('start',typeof data.start === 'string' ? data.start : clock(data.start),'type="time"')) : '';
  const end = timed ? field(flex ? 'Kết thúc (tùy chọn)' : 'Kết thúc',input('end',typeof data.end === 'string' ? data.end : clock(data.end),'type="time"')) : '';
  const endDay = item?.endDate && endDate !== data.date && timed ? field('Ngày kết thúc',input('endDate',endDate,'type="date"')) : '';
  const taskFields = flex ? `<div class="form-grid">${field('Thời lượng (phút)',input('effort',data.effort,'type="number" min="1" max="1440" required'))}${field('Giờ hạn nộp',input('deadline',typeof data.deadline === 'string' ? data.deadline : clock(data.deadline?.minute ?? data.deadline),'type="time"'))}</div><p class="help">Để trống giờ bắt đầu và kết thúc nếu muốn Fri đề xuất khung giờ phù hợp.</p>` : '';
  const tripFields = trip ? `<div class="form-grid">${field('Điểm xuất phát',input('origin',data.origin,'required maxlength="160"'))}${field('Điểm đến',input('destination',data.destination,'required maxlength="160"'))}${field('Giờ cần có mặt',input('arriveBy',typeof data.arriveBy === 'string' ? data.arriveBy : clock(data.arriveBy),'type="time" required'))}${field('Giờ hẹn',input('appointmentAt',typeof data.appointmentAt === 'string' ? data.appointmentAt : clock(data.appointmentAt),'type="time"'))}${field('Số phút đi',input('duration',data.duration,'type="number" min="1" max="1440" required'))}${field('Số phút đệm',input('buffer',data.buffer,'type="number" min="0" max="1439" required'))}</div><p class="help">Fri tính giờ rời đi từ giờ có mặt trừ thời gian đi và đệm.</p>` : '';
  const parent = child ? field('Buổi cha',`<select name="parentId" required><option value="">Chọn buổi cố định</option>${parents.map(candidate => option(candidate.id,`${candidate.title} · ${dateShort(candidate.date)} ${time(candidate.start)}`,data.parentId)).join('')}</select>`) : '';
  const zone = item?.timezone && item.timezone !== D.DEMO_ZONE ? `<p class="help">Giờ hiển thị theo Việt Nam. Múi giờ gốc: ${e(item.timezone)}.</p>` : '';
  return `<form class="form" id="item-form" data-item-id="${e(item?.id || '')}">${title}<div class="form-grid">${typeField}${day}</div>${allDay}${start || end ? `<div class="form-grid">${start}${end}</div>` : ''}${endDay}${parent}${place}${notes}${taskFields}${tripFields}${zone}<p class="error" data-error role="alert" hidden></p><div class="actions end">${button('Hủy','close-dialog')}<button type="submit" class="btn primary">${item ? 'Lưu thay đổi' : 'Tạo mục'}</button></div></form>`;
}

function openItemForm(itemId, kind) {
  const item = state.items.find(candidate => candidate.id === itemId);
  openDialog(item ? 'Sửa mục' : 'Tạo mục',itemForm(item,kind));
}

function showFormError(form, message) {
  const target = form.querySelector('[data-error]');
  target.hidden = false;
  target.textContent = message;
}

function formMinute(value) {
  return value ? D.parseTime(value) : null;
}

function saveItem(form) {
  const data = Object.fromEntries(new FormData(form));
  const existing = state.items.find(item => item.id === form.dataset.itemId);
  const draft = {...existing,id:existing?.id ?? id(),title:data.title.trim(),kind:data.kind,date:data.date,endDate:data.endDate || data.date,location:data.location?.trim() || '',start:formMinute(data.start),end:formMinute(data.end),allDay: data.allDay === 'on',timezone:D.DEMO_ZONE};
  if (data.notes !== undefined) draft.notes = data.notes.trim();
  if (draft.allDay) draft.start = draft.end = null;
  if (draft.kind === 'task') {
    draft.effort = Number(data.effort);
    draft.deadline = formMinute(data.deadline);
    if (draft.start == null && draft.end != null) return showFormError(form,'Nhập giờ bắt đầu hoặc để trống cả hai giờ để Fri xếp việc.');
    if (draft.start != null && draft.end == null) draft.end = draft.start + draft.effort;
    if (draft.start != null && draft.end != null) draft.effort = draft.end - draft.start;
    if (draft.locked && draft.start == null) return showFormError(form,'Mở khóa phiên trước khi xóa khung giờ.');
  }
  if (draft.kind === 'child') draft.parentId = data.parentId;
  if (draft.kind === 'trip') {
    Object.assign(draft,{origin:data.origin.trim(),destination:data.destination.trim(),arriveBy:formMinute(data.arriveBy),appointmentAt:formMinute(data.appointmentAt),duration:Number(data.duration),buffer:Number(data.buffer)});
    if (draft.appointmentAt != null && draft.appointmentAt < draft.arriveBy) return showFormError(form,'Giờ hẹn phải bằng hoặc sau giờ cần có mặt.');
  }
  const validity = D.validateItem(draft);
  if (!validity.ok) return showFormError(form,validity.message);
  const conflict = D.previewPlacement(draft,state.items);
  if (!conflict.ok && (draft.kind === 'task' || draft.kind === 'child')) return showFormError(form,conflict.message);
  const invalidChild = state.items.filter(item => item.parentId === draft.id).find(item => !D.previewPlacement(item,state.items.filter(value => value.id !== draft.id).concat(draft)).ok);
  if (invalidChild) return showFormError(form,`Thay đổi làm “${invalidChild.title}” nằm ngoài buổi cha. Sửa hoạt động con trước.`);
  if (existing?.sourceOriginal) draft.sourceOriginal = existing.sourceOriginal;
  if (existing?.sourceOriginal || existing?.original || existing?.sourceData) {
    const source = existing.sourceOriginal || existing.original || existing.sourceData;
    draft.overrides = Object.fromEntries(D.candidateDiff(source,draft).map(({field,after}) => [field,after]));
  }
  const previous = clone(state.items);
  state.items = state.items.filter(item => item.id !== draft.id).concat(draft);
  selectedDate = draft.date;
  persist({bump:true});
  closeDialog();
  if (page !== 'today' && page !== 'calendar') go('calendar');
  else render();
  notify(conflict.ok ? (existing ? 'Đã lưu thay đổi.' : 'Đã tạo mục trong lịch.') : `Đã lưu. ${conflict.message}`,() => undoItems(previous));
}

function undoItems(items) {
  state.items = items;
  persist({bump:true});
  render();
  notify('Đã hoàn tác thay đổi lịch.');
}

function openItem(itemId) {
  const original = state.items.find(item => item.id === itemId);
  if (!original) return notify('Mục này đã được xóa.');
  const item = visibleItem(original);
  const [label,glyph] = kinds[item.kind] || kinds.fixed;
  const checks = D.plan(state.items,item.date).conflicts.filter(problem => problem.itemIds.includes(item.id));
  const routes = item.kind === 'trip' && Number.isFinite(item.leaveAt) ? `<div class="form-grid"><div class="notice"><span class="caption">Rời đi</span><div class="big-time">${time(item.leaveAt)}</div><span class="muted">${e(item.origin || 'Chưa rõ điểm xuất phát')}${item.leaveDate !== item.date ? ` · ${dateShort(item.leaveDate)}` : ''}</span></div><div class="notice"><span class="caption">Có mặt</span><div class="big-time">${time(item.arriveBy)}</div><span class="muted">${e(item.destination || 'Chưa rõ điểm đến')}</span></div></div><p class="muted">Đến dự kiến ${time(item.arrivalAt)} · ${item.duration} phút đi + ${item.buffer} phút đệm${Number.isFinite(item.appointmentAt) ? ` · Hẹn ${time(item.appointmentAt)}` : ''}</p><p class="help">${state.prefs.reminders ? 'Mốc nhắc có trong bản xem trước Web.' : 'Xem trước nhắc rời đi đang tắt.'}</p>` : '';
  const description = item.kind === 'task' && !Number.isFinite(item.start) ? `Chờ xếp · ${item.effort} phút` : timeRange(item);
  const overnight = item.endDate > item.date ? ` · đến ${dateShort(item.endDate)}` : '';
  const action = item.kind === 'task' && !Number.isFinite(item.start) ? button('Xếp việc','plan-item',{id:item.id,icon:'spark',primary:true}) : item.kind === 'task' && !item.done && !item.locked ? button('Tìm khung khác','plan-item',{id:item.id,icon:'spark'}) : '';
  const tracking = ['fixed','task','child','deadline'].includes(item.kind) ? button(item.done ? 'Đánh dấu chưa xong' : 'Đánh dấu đã xong','toggle-done',{id:item.id,icon:'check'}) : '';
  const lock = item.kind === 'task' && Number.isFinite(item.start) ? button(item.locked ? 'Mở khóa phiên' : 'Khóa phiên','toggle-lock',{id:item.id,icon:'lock'}) : '';
  const changes = checks.map(problem => `<p class="notice warn">${e(problem.message)}</p>`).join('');
  openDialog(item.title,`<div class="form"><div class="actions"><span class="event-icon kind-${e(item.kind)}">${icon(glyph)}</span>${badge(label)}${item.done ? badge('Đã xong','good') : ''}${item.locked ? badge('Đã khóa') : ''}</div><p><strong>${e(fullDay(item.date))} · ${e(description + overnight)}</strong></p>${item.location && item.kind !== 'trip' ? `<p class="muted">${icon('pin')} ${e(item.location)}</p>` : ''}${item.notes ? `<p class="notice appointment-notes">${e(item.notes)}</p>` : ''}${routes}${item.reason ? `<p class="notice">${e(item.reason)}</p>` : ''}${changes}<div class="actions">${action}${tracking}${lock}</div><div class="divider"></div><div class="actions end">${button('Xóa mục','delete-item',{id:item.id,kind:'danger'})}${button('Sửa','item-edit',{id:item.id,primary:true})}</div></div>`);
}

function toggleItem(itemId, property) {
  const item = state.items.find(candidate => candidate.id === itemId);
  if (!item) return;
  const previous = clone(state.items);
  item[property] = !item[property];
  persist({bump:true});
  render();
  openItem(itemId);
  const message = property === 'done' ? (item.done ? 'Đã đánh dấu hoàn thành.' : 'Đã mở lại mục.') : (item.locked ? 'Đã khóa phiên.' : 'Đã mở khóa phiên.');
  notify(message,() => undoItems(previous));
}

function openDelete(itemId) {
  const item = state.items.find(candidate => candidate.id === itemId);
  if (!item) return;
  const children = state.items.filter(candidate => candidate.parentId === itemId);
  openDialog('Xóa mục',`<div class="form"><p>Xóa “${e(item.title)}” khỏi lịch?${children.length ? ` ${children.length} hoạt động con cũng sẽ được xóa.` : ''}</p><div class="actions end">${button('Quay lại','item',{id:itemId})}${button('Xóa mục','delete-item-confirm',{id:itemId,primary:true})}</div></div>`);
}

function deleteItem(itemId) {
  const previous = clone(state.items);
  state.items = state.items.filter(item => item.id !== itemId && item.parentId !== itemId);
  persist({bump:true});
  closeDialog();
  render();
  notify('Đã xóa mục khỏi lịch.',() => undoItems(previous));
}

function openPlan(itemId) {
  const target = state.items.find(item => item.id === itemId);
  const date = target?.date || selectedDate;
  const reschedule = Boolean(target && Number.isFinite(target.start));
  const alternatives = reschedule ? [{start:480,end:Math.min(target.start,1260)},{start:Math.max(target.end,480),end:1260}]
    .filter(window => window.end > window.start) : undefined;
  planPreview = D.plan(state.items,date,{revision:state.revision,targetId:itemId || undefined,reschedule,availability:alternatives});
  const {placements,conflicts,shortages} = planPreview;
  const placementRows = placements.map(item => `<div class="notice"><strong>${e(item.title)}</strong><p>${e(timeRange(item))} · ${item.effort} phút${item.location ? ` · ${e(item.location)}` : ''}</p><p class="help">Còn trống và đáp ứng thời lượng${item.location ? ' và địa điểm' : ''}.</p></div>`).join('');
  const problems = [...conflicts,...shortages].map(problem => `<div class="notice warn"><strong>${e(problem.title)}</strong><p>${e(problem.message)}</p>${(problem.itemIds || []).filter(itemId => state.items.some(item => item.id === itemId)).map(itemId => `<button type="button" class="link-btn" data-action="item" data-id="${e(itemId)}">${e(state.items.find(item => item.id === itemId).title)} →</button>`).join(' ')}</div>`).join('');
  openDialog('Xem trước kế hoạch',`<div class="form"><p class="muted">${e(fullDay(date))} · ${placements.length} đề xuất</p>${placementRows}${problems}${!placements.length && !problems ? empty('Chưa có việc cần xếp','Tạo việc linh hoạt và nhập thời lượng để Fri tìm khe trống.') : ''}<div class="actions end">${button('Đóng','close-dialog')}${placements.length ? button('Áp dụng kế hoạch','plan-apply',{primary:true,icon:'check'}) : ''}</div></div>`);
}

function applyPlan() {
  const latest = readSaved();
  if (latest && latest.revision > state.revision) state = latest;
  const result = D.commitPlan(state,planPreview);
  if (!result.ok) {
    openDialog('Xếp việc',`<div class="form"><p class="notice warn">${e(result.message)}</p>${button('Xem đề xuất mới','plan',{primary:true})}</div>`);
    return;
  }
  const previous = clone(state.items);
  state = result.state;
  persist();
  closeDialog();
  render();
  notify('Đã áp dụng kế hoạch.',() => undoItems(previous));
}

function settingsPage() {
  const mode = document.documentElement.dataset.mode;
  const colorOffset = mode === 'dark' ? 4 : 1;
  const paletteCards = Object.entries(palettes).map(([key,palette]) => `<button type="button" class="palette" data-action="pref-theme" data-id="${key}" aria-pressed="${state.prefs.theme === key}"><span class="swatches" aria-hidden="true">${palette.slice(colorOffset,colorOffset+3).map(color => `<i style="background:${color}"></i>`).join('')}</span>${e(palette[0])}</button>`).join('');
  const modes = [['system','Theo hệ thống'],['light','Sáng'],['dark','Tối']].map(([key,label]) => `<button type="button" data-action="pref-mode" data-id="${key}" aria-pressed="${state.prefs.mode === key}">${label}</button>`).join('');
  return `${intro('Tùy chỉnh','Cài đặt','Giao diện, dữ liệu và mục hiển thị trên widget.')}<div class="settings-layout"><section class="card panel"><div class="setting"><h2>Giao diện</h2><div class="segment" role="group" aria-label="Chế độ màu">${modes}</div></div><div class="setting"><h3>Bảng màu</h3><div class="palettes" role="group" aria-label="Bảng màu">${paletteCards}</div></div><div class="setting">${prefCheck('Giảm trong suốt','solid')}<p class="muted">Dùng nền đặc cho thanh điều hướng và widget.</p></div></section><div class="stack"><section class="card panel stack"><h2>Widget và nhắc</h2>${prefCheck('Ẩn chi tiết ở màn hình khóa','private')}${prefCheck('Xem trước nhắc rời đi','reminders')}<p class="muted">Mốc nhắc chỉ hiển thị trong Fri trên Web.</p>${button('Mở widget','page',{id:'widgets',icon:'widgets'})}</section><section class="card panel stack"><h2>Dữ liệu</h2><p class="muted">Lịch và bằng chứng được lưu trong trình duyệt này.</p><div class="actions">${button('Xuất lịch Fri','export',{icon:'download'})}${button('Quản lý dữ liệu','reset',{kind:'ghost'})}</div></section></div></div>`;
}

function prefCheck(label,key) {
  return `<label class="field check"><input type="checkbox" data-pref="${e(key)}"${state.prefs[key] ? ' checked' : ''}>${e(label)}</label>`;
}

function widgetsPage() {
  const snapshot = snapshotForDate(selectedDate);
  const {next,trip,milestones,completed,total} = snapshot;
  const tint = state.prefs.tint ? ' tinted' : '';
  const redirect = (item) => item ? `data-action="widget-item" data-id="${e(item.id)}"` : 'data-action="page" data-id="today"';
  const widgetBrand = `<span class="widget-brand">${icon('fri')} Fri <span class="muted">· ${dateShort(selectedDate)}</span></span>`;
  const small = `<button type="button" class="widget small${tint}" ${redirect(trip || next)}>${widgetBrand}${trip ? `<span class="caption">Rời đi</span><span class="big-time">${time(trip.leaveAt)}</span><strong>${e(trip.destination || trip.title)}</strong>` : next ? `<span class="caption">Tiếp theo</span><strong>${e(next.title)}</strong><span>${e(timeRange(next))}</span>` : '<strong>Chưa có lịch</strong><span>Mở Fri</span>'}</button>`;
  const medium = `<button type="button" class="widget${tint}" ${redirect(next || trip)}>${widgetBrand}<span class="caption">Tiếp theo</span><strong>${e(next?.title || 'Chưa có lịch')}</strong><span>${next ? e(timeRange(next)) : 'Mở Fri'}${trip ? ` · Rời đi ${time(trip.leaveAt)}` : ''}</span><span class="caption">Tiến độ ${completed}/${total}</span></button>`;
  const desktop = `<button type="button" class="widget${tint}" ${redirect(milestones[0] || trip)}>${widgetBrand}<span class="caption">Trong ngày</span>${milestones.length ? milestones.map(item => `<strong>${e(timeRange(item))} · ${e(item.title)}</strong>`).join('') : '<strong>Chưa có mốc sắp tới</strong>'}${trip ? `<span>Rời đi ${time(trip.leaveAt)}</span>` : ''}</button>`;
  const lock = `<button type="button" class="widget${tint}" ${redirect(trip || next)}>${widgetBrand}<strong>${e(state.prefs.private ? (trip ? `Rời đi ${time(trip.leaveAt)}` : 'Xem lịch trong Fri') : (trip ? `${time(trip.leaveAt)} · ${trip.destination || trip.title}` : next?.title || 'Chưa có lịch'))}</strong><span>${state.prefs.private ? 'Chi tiết ẩn trên màn hình khóa' : 'Chi tiết đang hiển thị'}</span></button>`;
  const reminder = state.prefs.reminders && snapshot.reminders?.length ? `<p class="muted">${snapshot.reminders.length} mốc nhắc trong bản xem trước · Mốc đầu ${time(snapshot.reminders[0].minute)}</p>` : `<p class="muted">${state.prefs.reminders ? 'Chưa có mốc nhắc rời đi.' : 'Xem trước nhắc rời đi đang tắt.'}</p>`;
  return `${intro('Xem nhanh','Widget','Bản xem trước iPhone và macOS dùng cùng dữ liệu với lịch.',button('Cài đặt','page',{id:'settings',icon:'settings'}))}<div class="card panel stack"><div class="section-title"><h2>${e(readableDate(selectedDate))}</h2><span class="muted">Lịch v${state.revision}</span></div><div class="actions">${button('Trước','widget-date',{id:'-1',icon:'left',iconOnly:true})}${button('Sau','widget-date',{id:'1',icon:'right',iconOnly:true})}${prefCheck('Màu nhấn hệ thống','tint')}${prefCheck('Ẩn chi tiết ở màn hình khóa','private')}</div><div class="widget-grid">${[['iPhone · Nhỏ',small],['iPhone · Vừa',medium],['macOS · Màn hình nền',desktop],['iPhone · Màn hình khóa',lock]].map(([label,html]) => `<section class="widget-host"><span>${label}</span>${html}</section>`).join('')}</div>${reminder}</div>`;
}

function encodeIcs(value) {
  return String(value || '').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
}

function exportIcs() {
  const exported = state.items.filter(item => item.generated && item.kind === 'task' && Number.isFinite(item.start));
  if (!exported.length) return notify('Áp dụng một kế hoạch để xuất các phiên Fri đã xếp.');
  const invalid = exported.find(item => !D.previewPlacement(item,state.items).ok);
  if (invalid) return notify(`Kiểm tra xung đột của “${invalid.title}” trước khi xuất lịch.`);
  const utc = (date,minute) => new Date(Date.parse(`${date}T00:00:00+07:00`) + minute*60000).toISOString().replace(/[-:]|\.\d{3}/g,'');
  const stamp = new Date().toISOString().replace(/[-:]|\.\d{3}/g,'');
  const content = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FRI//Web V1//VI',...exported.flatMap(item => ['BEGIN:VEVENT',`UID:${encodeIcs(item.id)}@fri.local`,`DTSTAMP:${stamp}`,`DTSTART:${utc(item.date,item.start)}`,`DTEND:${utc(item.endDate || item.date,item.end)}`,`SUMMARY:${encodeIcs(item.title)}`,`LOCATION:${encodeIcs(item.location)}`,'END:VEVENT']),'END:VCALENDAR',''].join('\r\n');
  const url = URL.createObjectURL(new Blob([content],{type:'text/calendar;charset=utf-8'}));
  const link = Object.assign(document.createElement('a'),{href:url,download:'fri-ke-hoach.ics'});
  link.click();
  setTimeout(() => URL.revokeObjectURL(url),1000);
  notify(`Đã xuất ${exported.length} phiên Fri.`);
}

function searchable(value) {
  return String(value || '').normalize('NFD').replace(/\p{Diacritic}/gu,'').replace(/[đĐ]/g,'d').toLowerCase();
}

function showSearch() {
  openDialog('Tìm trong lịch',`<div class="form">${field('Tên mục hoặc địa điểm',input('search','', 'type="search" maxlength="160" placeholder="Ví dụ: Robotics" autocomplete="off" autofocus data-search'))}<div id="search-results" aria-live="polite"></div></div>`);
  updateSearch('');
}

function updateSearch(query) {
  const search = searchable(query).trim();
  const matches = search ? state.items.filter(item => searchable(`${item.title} ${item.location || ''}`).includes(search)).slice(0,15) : [];
  dialogBody.querySelector('#search-results').innerHTML = matches.length ? matches.map(item => `<button type="button" class="mini-row kind-${e(item.kind)}" data-action="widget-item" data-id="${e(item.id)}"><i class="pip"></i><span>${e(item.title)}</span><span>${e(dateShort(item.date))} · ${e(timeRange(item))}</span></button>`).join('') : `<p class="muted">${search ? 'Không tìm thấy mục phù hợp.' : 'Nhập một vài chữ để tìm mục trên lịch.'}</p>`;
}

function resetDialog() {
  openDialog('Quản lý dữ liệu',`<div class="form"><p>Chọn bắt đầu với lịch trống hoặc khôi phục lịch minh họa. Cả hai sẽ thay thế lịch và nguồn đang lưu trong trình duyệt.</p><div class="actions end">${button('Hủy','close-dialog')}${button('Lịch trống','reset-confirm',{id:'empty',kind:'danger'})}${button('Khôi phục lịch mẫu','reset-confirm',{id:'demo',primary:true})}</div></div>`);
}

function resetData(mode) {
  const previousPrefs = state.prefs;
  const revision = state.revision + 1;
  state = mode === 'demo' ? D.demoState() : {items:[],sources:[],candidates:[]};
  state.demo = mode === 'demo';
  state.prefs = previousPrefs;
  state.revision = revision;
  clearAppointmentDraft();
  selectedDate = state.demo ? D.DEMO_DATE : realDate();
  persist();
  go('today');
  notify(state.demo ? 'Đã khôi phục lịch mẫu.' : 'Đã tạo lịch trống.');
}

function setSelectedDate(date) {
  if (!validDate(date)) return;
  selectedDate = date;
  persist();
  render({keepFocus:true});
}

function openWidgetItem(itemId) {
  const item = state.items.find(candidate => candidate.id === itemId);
  if (!item) return go('today');
  selectedDate = item.date;
  persist();
  go('calendar',{hash:false});
  const address = `#calendar/item/${encodeURIComponent(itemId)}`;
  if (location.hash !== address) history.pushState(null,'',address);
  openItem(itemId);
}

function syncHash() {
  const destination = location.hash.slice(1);
  const link = /^calendar\/item\/([a-zA-Z0-9._-]+)$/.exec(destination);
  if (link) return openWidgetItem(link[1]);
  if (destination !== page || drawer.open) go(Object.hasOwn(pages,destination) ? destination : 'today',{hash:false});
}

function dateDialog() {
  openDialog('Chọn ngày',`<form class="form" id="date-form">${field('Ngày muốn xem',input('date',selectedDate,'type="date" required autofocus'))}<div class="actions end">${button('Hủy','close-dialog')}<button type="submit" class="btn primary">Đến ngày</button></div></form>`);
}

function launch() {
  reconcileAppointmentDraft();
  document.querySelector('#close-dialog').innerHTML = icon('close');
  document.querySelector('#close-dialog').addEventListener('click',closeDialog);
  drawer.addEventListener('close',() => {
    if (drawer.open) return;
    if (location.hash.startsWith('#calendar/item/')) history.replaceState(null,'','#calendar');
    renderChrome();
    focusAction(restoreFocus);
  });
  document.addEventListener('click', event => {
    const node = event.target.closest('button[data-action]');
    if (!node || node.disabled) return;
    const {action,id:itemId} = node.dataset;
    if (action === 'appointment' || action.startsWith('appointment-')) return changeAppointmentStage(action,itemId);
    switch (action) {
      case 'page': return go(itemId);
      case 'date': return setSelectedDate(itemId);
      case 'date-jump': return dateDialog();
      case 'today': return setSelectedDate(state.demo ? D.DEMO_DATE : realDate());
      case 'shift': return setSelectedDate(shiftDate(Number(itemId)));
      case 'widget-date': return setSelectedDate(D.addDays(selectedDate,Number(itemId)));
      case 'view': calendarView = itemId; persist(); return render({keepFocus:true});
      case 'item': return openItem(itemId);
      case 'widget-item': return openWidgetItem(itemId);
      case 'item-new': return openItemForm(null,itemId);
      case 'item-edit': return openItemForm(itemId);
      case 'delete-item': return openDelete(itemId);
      case 'delete-item-confirm': return deleteItem(itemId);
      case 'toggle-done': return toggleItem(itemId,'done');
      case 'toggle-lock': return toggleItem(itemId,'locked');
      case 'plan': return openPlan();
      case 'plan-item': return openPlan(itemId);
      case 'plan-apply': return applyPlan();
      case 'pref-mode': state.prefs.mode = itemId; persist(); return render({keepFocus:true});
      case 'pref-theme': state.prefs.theme = itemId; persist(); return render({keepFocus:true});
      case 'close-dialog': return closeDialog();
      case 'search': return showSearch();
      case 'hide-toast': return hideToast();
      case 'undo': if (undoAction) return undoAction(); break;
      case 'reset': return resetDialog();
      case 'reset-confirm': return resetData(itemId);
      case 'export': return exportIcs();
      default: return handleSourceAction(action,itemId,node);
    }
  });
  document.addEventListener('submit', event => {
    if (event.target.id === 'appointment-entry-form') {
      event.preventDefault();
      return submitAppointmentEntry(event.target,event.submitter?.value === 'done');
    }
    if (event.target.id === 'appointment-review-form') {
      event.preventDefault();
      return answerAppointmentQuestion(event.target);
    }
    if (event.target.id === 'date-form') {
      event.preventDefault();
      const date = new FormData(event.target).get('date');
      closeDialog();
      setSelectedDate(date);
      return;
    }
    if (event.target.id !== 'item-form') return handleSourceSubmit(event);
    event.preventDefault();
    saveItem(event.target);
  });
  document.addEventListener('change', event => {
    const node = event.target;
    if (node.form?.id.startsWith('appointment-')) return updateAppointmentDraft(event);
    if (node.dataset.pref) {
      state.prefs[node.dataset.pref] = node.checked;
      persist();
      return applyTheme(), node.dataset.pref !== 'solid' ? render() : undefined;
    }
    if (node.matches('[data-item-kind]')) {
      const form = node.form;
      const existing = state.items.find(item => item.id === form.dataset.itemId);
      const draft = Object.fromEntries(new FormData(form));
      openDialog(existing ? 'Sửa mục' : 'Tạo mục',itemForm(existing,node.value,draft));
      dialogBody.querySelector('[data-item-kind]').focus();
    }
  });
  document.addEventListener('input', event => {
    if (event.target.matches('[data-search]')) updateSearch(event.target.value);
    else updateAppointmentDraft(event);
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'k' && (event.metaKey || event.ctrlKey)) {
      event.preventDefault();
      if (!drawer.open) showSearch();
    }
    if (!drawer.open && event.target.matches('.day-pick') && ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)) {
      event.preventDefault();
      const delta = {ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[event.key];
      setSelectedDate(D.addDays(event.target.dataset.id,delta));
      main.querySelector(`.day-pick[data-id="${selectedDate}"]`)?.focus();
    }
  });
  window.addEventListener('storage',event => {
    if (event.key === APPOINTMENT_KEY) {
      appointmentBatch = readAppointmentBatch();
      if (drawer.open && dialogBody.querySelector('[id^="appointment-"]')) {
        if (appointmentBatch) openAppointment();
        else closeDialog();
      }
      renderChrome();
      return;
    }
    if (event.key !== KEY) return;
    const latest = readSaved();
    if (latest?.revision > state.revision) {
      state = latest;
      render();
      announce('Lịch đã được cập nhật từ tab khác.');
    }
  });
  window.addEventListener('online',() => { render(); announce('Đã kết nối mạng.'); });
  window.addEventListener('offline',() => { render(); announce('Đang ngoại tuyến.'); });
  window.addEventListener('hashchange',syncHash);
  mobile.addEventListener('change',renderChrome);
  mediaDark.addEventListener('change',() => { if (state.prefs.mode === 'system') render(); });
  render();
  if (location.hash) syncHash();
}

launch();
</script>
</body>
</html>
