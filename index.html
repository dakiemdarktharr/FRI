<!doctype html>
<html lang="vi" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E9F4FA">
<meta name="description" content="Fri giúp gom lịch từ ảnh và liên kết, duyệt thông tin rồi xếp việc quanh lịch hẹn và giờ di chuyển.">
<title>Fri – Lịch và kế hoạch</title>
<style>
:root {
  color-scheme: light;
  --bg: #e9f4fa;
  --primary: #12608c;
  --accent: #855307;
  --text: #142a40;
  --muted: #486073;
  --surface: #f8fcff;
  --raised: #fff;
  --line: #cbdde8;
  --good: #216c5a;
  --danger: #9c304d;
  --glass: rgba(248, 252, 255, 0.72);
  --shadow: 0 20px 52px #1e53781b;
  --focus: var(--primary);
  --radius: 24px;
  --head: 68px;
  --rail: 202px;
}
:root[data-mode="dark"] {
  color-scheme: dark;
  --bg: #081e35;
  --primary: #6dcaf5;
  --accent: #ffd268;
  --text: #edf7ff;
  --muted: #aac0d1;
  --surface: #142b40;
  --raised: #1a344b;
  --line: #365067;
  --good: #8be3c4;
  --danger: #ffadbc;
  --glass: rgba(14, 36, 56, 0.78);
  --shadow: 0 20px 55px #0005;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  color: var(--text);
  font:
    14px/1.45 system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:
    radial-gradient(
      ellipse at 82% 0%,
      color-mix(in srgb, var(--primary) 20%, transparent),
      transparent 53%
    ),
    radial-gradient(
      ellipse at 4% 95%,
      color-mix(in srgb, var(--primary) 13%, transparent),
      transparent 55%
    ),
    var(--bg);
  background-attachment: fixed;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  opacity: 0.53;
  cursor: default;
}
a {
  color: var(--primary);
}
button,
a,
input,
textarea,
select {
  touch-action: manipulation;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2,
h3,
.brand {
  letter-spacing: -0.035em;
}
svg {
  width: 20px;
  height: 20px;
  flex: none;
  vertical-align: middle;
}
fieldset {
  border: 0;
  padding: 0;
  margin: 0;
  min-width: 0;
}
legend {
  padding: 0;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.skip {
  position: fixed;
  top: 8px;
  left: 8px;
  transform: translateY(-150%);
  z-index: 50;
  padding: 10px;
  background: var(--raised);
}
.skip:focus {
  transform: none;
}
[hidden] {
  display: none !important;
}
.shell {
  width: min(1664px, 100%);
  margin: auto;
  min-height: 100vh;
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
}
.rail {
  padding: 20px 14px;
  position: sticky;
  top: 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 26px;
  border-right: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
  background: var(--glass);
  backdrop-filter: blur(24px) saturate(140%);
  z-index: 5;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 8px;
  color: var(--text);
  font-weight: 760;
  font-size: 25px;
}
.logo {
  width: 40px;
  height: 40px;
  display: inline-grid;
  place-items: center;
  border-radius: 13px;
  background: linear-gradient(155deg, #246e96, #124b6d);
  color: #fff;
  box-shadow:
    inset 0 1px 0 #fff8,
    0 3px 8px #133a5836;
}
.logo svg {
  width: 26px;
  height: 26px;
}
.rail-nav {
  display: grid;
  gap: 4px;
}
.nav-action {
  border: 0;
  background: transparent;
  text-align: left;
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 11px;
  border-radius: 12px;
  color: var(--muted);
  font-weight: 630;
}
.nav-action svg {
  width: 19px;
  height: 19px;
}
.nav-action:hover,
.nav-action[aria-current="page"] {
  background: color-mix(in srgb, var(--primary) 12%, transparent);
  color: var(--primary);
}
.nav-action .count {
  margin-left: auto;
}
.nav-label {
  font-size: 11px;
  font-weight: 730;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 11px 5px;
}
.rail-end {
  margin-top: auto;
  display: grid;
  gap: 5px;
}
.rail-foot {
  margin: 6px 11px 0;
  border-top: 1px solid var(--line);
  padding-top: 14px;
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 11px;
}
.status-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--good);
  flex: none;
}
.status-dot.offline {
  background: var(--accent);
}
.mobile-nav {
  display: none;
}
.workspace {
  min-width: 0;
}
.top {
  height: var(--head);
  position: sticky;
  top: 0;
  z-index: 4;
  padding: 0 clamp(20px, 2.55vw, 42px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  background: var(--glass);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
  backdrop-filter: blur(24px) saturate(150%);
}
.top-label {
  font-weight: 680;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
}
.top-label svg {
  width: 17px;
  height: 17px;
  color: var(--primary);
}
.top-actions,
.actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.actions.end {
  justify-content: flex-end;
}
.btn,
.icon-btn,
.segment button,
.chip-button {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 42px;
  padding: 0 12px;
  font-weight: 670;
  text-decoration: none;
  white-space: nowrap;
  transition:
    background 0.15s,
    border-color 0.15s,
    color 0.15s;
}
.btn:hover,
.icon-btn:hover,
.segment button:hover,
.chip-button:hover {
  background: var(--raised);
  border-color: var(--primary);
  color: var(--primary);
}
.btn.primary {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--bg);
}
.btn.primary:hover {
  background: color-mix(in srgb, var(--primary) 85%, var(--text));
  color: var(--bg);
}
.btn.ghost,
.icon-btn.ghost {
  background: transparent;
  border-color: transparent;
}
.btn.danger {
  color: var(--danger);
}
.btn svg {
  width: 17px;
  height: 17px;
}
.icon-btn {
  width: 42px;
  padding: 0;
}
.icon-btn svg {
  width: 19px;
  height: 19px;
}
.section {
  padding: clamp(23px, 2.6vw, 43px) clamp(20px, 2.55vw, 42px) 40px;
  max-width: 1500px;
  margin: auto;
}
.intro {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 16px;
  margin-bottom: 22px;
}
.intro h1 {
  font-size: clamp(30px, 3.1vw, 49px);
  font-weight: 735;
  line-height: 1.05;
  letter-spacing: -0.061em;
  margin: 4px 0 9px;
}
.eyebrow {
  color: var(--primary);
  font-weight: 760;
  font-size: 11px;
  letter-spacing: 0.105em;
  text-transform: uppercase;
}
.muted,
.intro p {
  color: var(--muted);
}
.muted {
  font-size: 13px;
}
.intro p {
  font-size: 14px;
}
.intro-actions {
  margin-bottom: 2px;
}
.card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  min-width: 0;
}
.panel {
  padding: 20px;
}
.panel h2 {
  font-size: 20px;
  font-weight: 730;
}
.panel h3 {
  font-size: 16px;
}
.split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(245px, 285px);
  gap: 18px;
  align-items: start;
}
.stack {
  display: grid;
  gap: 14px;
  min-width: 0;
}
.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
.section-title h2 {
  font-size: 21px;
}
.caption {
  font-size: 11px;
  font-weight: 760;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.badge,
.count {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 100px;
  color: var(--primary);
  background: color-mix(in srgb, var(--primary) 11%, var(--surface));
  padding: 4px 9px;
  font-weight: 690;
  font-size: 11px;
  line-height: 1.35;
}
.count {
  padding: 3px 7px;
}
.badge.warn {
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 13%, var(--surface));
}
.badge.good {
  color: var(--good);
  background: color-mix(in srgb, var(--good) 12%, var(--surface));
}
.badge.danger {
  color: var(--danger);
  background: color-mix(in srgb, var(--danger) 11%, var(--surface));
}
.notice {
  border: 1px solid var(--line);
  padding: 12px 14px;
  border-radius: 14px;
  background: var(--surface);
  color: var(--muted);
  overflow-wrap: anywhere;
}
.notice.warn {
  border-color: color-mix(in srgb, var(--accent) 42%, var(--line));
  color: var(--accent);
}
.notice.danger {
  color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 45%, var(--line));
}
.empty {
  padding: 30px 17px;
  text-align: center;
  color: var(--muted);
}
.empty svg {
  width: 27px;
  height: 27px;
  color: var(--primary);
  margin-bottom: 10px;
}
.empty strong {
  display: block;
  color: var(--text);
  margin-bottom: 3px;
}
.empty .btn {
  margin-top: 12px;
}
.calendar {
  overflow: hidden;
}
.cal-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  padding: 14px 15px;
  gap: 10px;
  border-bottom: 1px solid var(--line);
}
.cal-left {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}
.cal-left .icon-btn {
  width: 36px;
  min-height: 36px;
}
.cal-left .btn {
  min-height: 36px;
}
.cal-left strong {
  margin-left: 6px;
  letter-spacing: -0.025em;
}
.segment {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  background: color-mix(in srgb, var(--primary) 7%, var(--surface));
  border: 1px solid var(--line);
  border-radius: 12px;
  max-width: 100%;
}
.segment button {
  min-height: 33px;
  padding: 0 9px;
  border-color: transparent;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
}
.segment button[aria-pressed="true"] {
  color: var(--text);
  background: var(--raised);
  border-color: var(--line);
  box-shadow: 0 1px 3px #10283d17;
}
.week-head {
  display: grid;
  grid-template-columns: 53px repeat(7, minmax(0, 1fr));
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.week-head small {
  align-self: end;
  justify-self: center;
  font-size: 10px;
  margin: 0 0 8px;
  color: var(--muted);
}
.day-pick {
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 3px;
  min-height: 62px;
  border: 0;
  border-left: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 640;
}
.day-pick b {
  font-size: 17px;
  color: var(--text);
  line-height: 27px;
  min-width: 27px;
  border-radius: 100px;
  text-align: center;
}
.day-pick:hover,
.day-pick[aria-pressed="true"] {
  background: color-mix(in srgb, var(--primary) 8%, var(--surface));
}
.day-pick[aria-pressed="true"] b {
  background: var(--primary);
  color: var(--bg);
}
.week-grid {
  --slot: 48px;
  height: calc(var(--slots) * var(--slot));
  display: grid;
  grid-template-columns: 53px repeat(7, minmax(0, 1fr));
  position: relative;
}
.time-axis,
.day-lane {
  position: relative;
  min-width: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0 calc(var(--slot) - 1px),
    var(--line) calc(var(--slot) - 1px) var(--slot)
  );
}
.day-lane {
  border-left: 1px solid var(--line);
}
.day-lane.selected {
  background-color: color-mix(in srgb, var(--primary) 4%, var(--surface));
}
.hour {
  position: absolute;
  left: 0;
  right: 0;
  text-align: center;
  color: var(--muted);
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  padding-top: 3px;
}
.kind-fixed {
  --event: #376f9a;
}
.kind-task {
  --event: #387f70;
}
.kind-context {
  --event: #567993;
}
.kind-child {
  --event: #6e57a5;
}
.kind-trip {
  --event: #ae7020;
}
.kind-deadline {
  --event: #aa4c6a;
}
:root[data-mode="dark"] .kind-fixed {
  --event: #8ec9f1;
}
:root[data-mode="dark"] .kind-task {
  --event: #86d8be;
}
:root[data-mode="dark"] .kind-context {
  --event: #9ab3ca;
}
:root[data-mode="dark"] .kind-child {
  --event: #c5b2fa;
}
:root[data-mode="dark"] .kind-trip {
  --event: #f6bd75;
}
:root[data-mode="dark"] .kind-deadline {
  --event: #f3a4bc;
}
.block {
  position: absolute;
  left: 4px;
  right: 4px;
  top: calc(var(--top) * var(--slot));
  height: max(34px, calc(var(--len) * var(--slot) - 3px));
  padding: 4px 5px 4px 6px;
  text-align: left;
  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--event) 27%, var(--line));
  border-left: 3px solid var(--event);
  border-radius: 7px;
  background: color-mix(in srgb, var(--event) 13%, var(--surface));
  color: var(--text);
  line-height: 1.16;
  z-index: 1;
}
.block:hover,
.block:focus-visible {
  background: color-mix(in srgb, var(--event) 25%, var(--surface));
  z-index: 4;
}
.block strong {
  display: block;
  font-size: 11px;
  overflow-wrap: anywhere;
}
.block span {
  font-size: 9px;
  color: var(--muted);
  font-weight: 650;
  display: block;
  margin-bottom: 3px;
}
.block.context {
  background: color-mix(in srgb, var(--event) 5%, var(--surface));
  border-style: dashed;
  z-index: 0;
  right: 2px;
  left: 1px;
}
.block.child {
  left: 16px;
  z-index: 2;
}
.block.deadline {
  border-style: dashed;
  border-left-style: solid;
}
.block.is-done {
  opacity: 0.74;
}
.week-footer {
  padding: 10px 14px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  border-top: 1px solid var(--line);
  font-size: 10px;
  color: var(--muted);
}
.legend-mark {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.pip {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--event, var(--primary));
  display: inline-block;
  flex: none;
}
.mobile-agenda {
  display: none;
}
.agenda {
  padding: 8px 14px 14px;
  display: grid;
  gap: 0;
}
.agenda-row {
  width: 100%;
  display: grid;
  grid-template-columns: 57px 34px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  text-align: left;
  background: transparent;
  color: var(--text);
  border: 0;
  border-bottom: 1px solid var(--line);
  min-height: 61px;
  padding: 6px 4px;
  border-radius: 0;
}
.agenda-row:last-child {
  border-bottom-color: transparent;
}
.agenda-row:hover {
  background: color-mix(in srgb, var(--event) 8%, var(--surface));
  border-radius: 10px;
}
.agenda-row.child {
  padding-left: 17px;
}
.agenda-row .when {
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.event-icon {
  width: 33px;
  height: 33px;
  border-radius: 10px;
  display: inline-grid;
  place-items: center;
  color: var(--event, var(--primary));
  background: color-mix(
    in srgb,
    var(--event, var(--primary)) 13%,
    var(--surface)
  );
}
.event-icon svg {
  width: 17px;
  height: 17px;
}
.agenda-row strong,
.agenda-row small {
  display: block;
  overflow-wrap: anywhere;
}
.agenda-row small {
  color: var(--muted);
  font-size: 11px;
  margin-top: 2px;
}
.agenda-row > svg {
  width: 14px;
  color: var(--muted);
}
.day-group {
  padding: 10px 0 3px;
  font-weight: 740;
  font-size: 13px;
  border-bottom: 1px solid var(--line);
}
.month-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  padding: 8px;
  gap: 3px;
}
.month-header {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  padding: 6px 0;
}
.month-grid .day-pick {
  border: 1px solid var(--line);
  border-radius: 11px;
  min-height: 55px;
}
.month-grid .outside {
  opacity: 0.66;
}
.month-grid .dots {
  display: flex;
  gap: 3px;
}
.month-grid .pip {
  width: 5px;
  height: 5px;
}
.aside .panel {
  padding: 16px;
}
.aside .section-title {
  margin-bottom: 10px;
}
.aside h2 {
  font-size: 17px;
}
.journey {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(
      ellipse at 100% 0%,
      color-mix(in srgb, var(--primary) 18%, transparent),
      transparent 70%
    ),
    var(--surface);
}
.journey-hit {
  width: 100%;
  display: block;
  text-align: left;
  border: 0;
  background: transparent;
  color: var(--text);
  padding: 0;
  border-radius: 11px;
}
.journey-hit:hover h3 {
  color: var(--primary);
}
.journey-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  gap: 6px;
}
.journey-top svg {
  width: 16px;
  color: var(--primary);
}
.big-time {
  font-size: 37px;
  font-weight: 725;
  letter-spacing: -0.085em;
  line-height: 1.03;
  font-variant-numeric: tabular-nums;
  margin: 5px 0;
  color: var(--text);
}
.journey h3 {
  font-size: 15px;
  margin: 3px 0;
}
.journey-meta {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  border-top: 1px solid var(--line);
  padding-top: 10px;
  margin-top: 11px;
  color: var(--muted);
  font-size: 11px;
}
.mini-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 42px;
  width: 100%;
  text-align: left;
  padding: 4px 0;
  border: 0;
  border-top: 1px solid var(--line);
  background: transparent;
  color: var(--text);
}
.mini-row:hover {
  color: var(--primary);
}
.mini-row:first-of-type {
  border-top: 0;
}
.mini-row span:nth-child(2) {
  flex: 1;
  font-weight: 630;
  overflow-wrap: anywhere;
}

  const MINUTE_MS = 60000;

  const datePattern = /^\d{4}-\d{2}-\d{2}$/;

  function calendarDate(value) {
    if (typeof value !== 'string' || !datePattern.test(value)) return null;
    const stamp = Date.parse(value + 'T00:00:00Z');

  function parseIcsEvent(fields, component, canceledFeed) {

    if (start?.temporal === 'floating') uncertain.push(start.note || 'Xác nhận múi giờ của giờ địa phương.');
    if (end?.note && end.note !== start?.note) uncertain.push(end.note);
    if (appointment && start?.minute !== null && start && !end && !canceled) uncertain.push('Nguồn thiếu giờ kết thúc. Hãy xác nhận thời lượng.');

      start: start?.minute ?? null, end: end?.minute ?? null, instant: start?.instant ?? null,
      endInstant: end?.instant ?? null, timezone: start?.timezone ?? null, temporal: start?.temporal ?? null,

  function parseIcs(text) {

        fields = {};

  function parseJsonLd(input) {

    const nodes = [...payloads];
    for (let index = 0; index < nodes.length && index < 3000; index++) {

      if (start.minute !== null && !end) uncertain.push('Nguồn thiếu giờ kết thúc. Hãy xác nhận thời lượng.');

        start: start.minute, end: end?.minute ?? null, location, temporal: start.temporal,
        timezone: start.timezone, instant: start.instant ?? null, endInstant: end?.instant ?? null,
        allDay: start.temporal === 'date', uncertain, notes: [],
        canceled: typeof node.eventStatus === 'string' && node.eventStatus.endsWith('EventCancelled'),

      });

    return results;
  }

  function parseSourceText(text) {
    return String(text).split(/\r?\n/).map(line => line.trim()).filter(Boolean).slice(0, 60).map(line => {
      const iso = /\b\d{4}-\d{2}-\d{2}\b/.exec(line);
      const numeric = /\b(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?\b/.exec(line);
      const dateInput = iso?.[0] ?? (numeric?.[3] ? numeric[3] + '-' + numeric[2].padStart(2, '0') + '-' + numeric[1].padStart(2, '0') : null);
      const date = calendarDate(dateInput);
      const times = [...line.matchAll(/\b(\d{1,2})(?::(\d{2})|h(\d{2})?)(?:\s*(sáng|chiều|tối|trưa))?(?=\s|$|[^\wÀ-ỹ])/giu)];
      const uncertain = [];
      const values = times.map(time => {
        const rawHour = Number(time[1]);
        const period = time[4]?.toLowerCase();
        if (!period && !time[2] && rawHour <= 12) return null;
        const shift = period === 'sáng' && rawHour === 12 ? 0 : ['chiều', 'tối', 'trưa'].includes(period) && rawHour < 12 ? rawHour + 12 : rawHour;
        return parseTime(shift + ':' + (time[2] || time[3] || '00'));

      if (!date) uncertain.push(/(?:mai|hôm nay|ngày kia)/i.test(line) ? 'Xác nhận ngày gửi để biết ngày chính xác.' : 'Xác nhận ngày, tháng và năm.');
      const kind = /(?:^|\s)(?:nộp|hạn|deadline)(?:\s|$)/iu.test(line) ? 'deadline' : 'fixed';
      const start = values[0] ?? null;
      const end = kind === 'deadline' ? null : values[1] ?? null;
      if (start === null) uncertain.push('Xác nhận giờ và sáng/tối nếu có.');
      if (kind === 'fixed' && end === null) uncertain.push('Xác nhận giờ kết thúc.');
      if (end !== null && start !== null && end <= start) uncertain.push('Xác nhận giờ kết thúc sau giờ bắt đầu.');
      const startOfDetails = [iso?.index, numeric?.index, times[0]?.index].filter(Number.isInteger);
      const title = (startOfDetails.length ? line.slice(0, Math.min(...startOfDetails)) : line).replace(/[\s|:–—-]+$/, '').trim();

  function absoluteMinute(day, minute) {

  function tripName(item) {

    const rawLeave = arrive - duration - buffer;
    const rawArrival = rawLeave + duration;
    const leaveDate = rawLeave < 0 ? addDays(item.date, -1) : item.date;
    return {
      ...item,
      title: item.title || tripName(item),
      date: item.date,
      start: rawLeave,
      end: arrive,
      leaveAt: (rawLeave + DAY) % DAY,

  function interval(item) {

  function placementWindows(item, items, date, options) {

    const cutoff = deadlineAt(item, date);
    const minutes = item.effort;
    const windows = (options.availability || [{start: options.start ?? 480, end: options.end ?? 1260}]).flatMap(window => {
      if (!validMinute(window.start) || !validMinute(window.end, true) || window.start >= window.end) return [];
      const end = Math.min(window.end + dayStart, cutoff ?? Infinity);
      const start = window.start + dayStart;
      return start < end ? [{start, end}] : [];
    });
    let free = mergeWindows(windows);
    for (const rest of options.breaks ?? [{start: 720, end: 780}]) {
      if (validMinute(rest.start) && validMinute(rest.end, true) && rest.start < rest.end)
        free = subtract(free, {start: dayStart + rest.start, end: dayStart + rest.end});
    }
    const location = normalizedLocation(item);
    const knownLocations = location ? items.filter(other => other.kind === 'context' &&
      normalizedLocation(other) === location && isDayItem(other, date)).map(interval).filter(Boolean) : [];
    if (knownLocations.length) {
      free = mergeWindows(free.flatMap(window => knownLocations.filter(context => overlaps(window, context))
        .map(context => ({start: Math.max(window.start, context.start), end: Math.min(window.end, context.end)}))));
    }
    for (const other of items) {
      if (other.id === item.id) continue;
      const blocking = takesAttention(other) || (other.kind === 'context' && !sameLocation(item, other));
      if (!blocking) continue;
      const range = interval(other);
      if (range) free = subtract(free, range);
    }
    return {free, dayStart, capacity: free.reduce((sum, window) => sum + window.end - window.start, 0), minutes};
  }

  function issuesForDay(items, date) {
    const active = items.filter(item => isDayItem(item, date));
    const conflicts = [];
    const seen = new Set();
    for (const item of active) {
      if (!interval(item) || item.kind === 'context') continue;
      const check = previewPlacement(item, active);
      if (check.ok) continue;
      const ids = check.itemIds || [item.id];
      const key = [...ids].sort().join('|');
      if (seen.has(key)) continue;
      seen.add(key);
      const title = check.code === 'travel' ? 'Xung đột di chuyển' :
        check.code === 'parent' ? 'Kiểm tra hoạt động con' :
          check.code === 'location' ? 'Xung đột địa điểm' : 'Lịch bị trùng';
      conflicts.push({...check, title, itemIds: ids});
    }
    return conflicts;
  }

  function plan(items, date, options = {}) {
    const baseRevision = options.revision ?? options.baseRevision ?? null;
    const working = [...items];
    const conflicts = issuesForDay(working, date);
    const pending = working.filter(item => item.kind === 'task' && !item.done && !item.locked &&
      item.date === date && (!options.targetId || options.targetId === item.id) &&
      (!interval(item) || options.reschedule === true) && Number.isInteger(item.effort) && item.effort > 0)
      .map(item => ({item, slack: placementWindows(item, working, date, options).capacity - item.effort}))
      .sort((a,b) => a.slack - b.slack || (deadlineAt(a.item,date) ?? Infinity) - (deadlineAt(b.item,date) ?? Infinity) ||
        (b.item.priority ?? 0) - (a.item.priority ?? 0) || a.item.id.localeCompare(b.item.id));
    const placements = [];
    const shortages = [];
    for (const {item} of pending) {
      const {free, dayStart, capacity, minutes} = placementWindows(item, working, date, options);
      const oldRange = interval(item);
      const retained = oldRange && free.some(window => window.start <= oldRange.start && window.end >= oldRange.end);
      if (retained) continue;
      const fit = free.find(window => window.end - window.start >= minutes);
      if (fit) {
        const start = fit.start - dayStart;
        const placement = {...item, start, end: start + minutes, endDate: date, generated: true, reason: 'Khung rảnh phù hợp thời lượng và địa điểm.'};
        if (previewPlacement(placement, working).ok) {
          placements.push(placement);
          working[working.findIndex(entry => entry.id === item.id)] = placement;
          continue;
        }
      }
      const amount = capacity < minutes ? minutes - capacity : null;
      shortages.push({
        code: amount === null ? 'no-contiguous-time' : 'capacity',
        title: item.title,
        message: amount === null
          ? 'Có ' + capacity + ' phút rảnh, nhưng chưa có khung liền ' + minutes + ' phút.'
          : 'Thiếu ít nhất ' + amount + ' phút trong các khung đủ điều kiện của ngày đã chọn.',
        minutes: amount,
        capacity,
        itemIds: [item.id]
      });
    }
    const constraints = {start: options.start, end: options.end};
    for (const field of ['availability', 'breaks']) {
      if (options[field]) constraints[field] = options[field].map(window => ({start: window.start, end: window.end}));
    }
    return {baseRevision, date, placements, conflicts, shortages, constraints};
  }

  function commitPlan(state, proposal) {
    if (!proposal || proposal.baseRevision !== state.revision) {
      return {ok: false, state, code: 'stale', message: 'Lịch đã thay đổi. Hãy xem trước lại.'};
    }
    const items = [...state.items];
    const applied = new Set();
    for (const proposed of proposal.placements) {
      const index = items.findIndex(item => item.id === proposed.id && item.kind === 'task' && !item.locked && !item.done);
      const original = items[index];
      const date = proposal.date;
      const placement = original && {...original, start: proposed.start, end: proposed.end, endDate: date, generated: true,
        reason: 'Khung rảnh phù hợp thời lượng và địa điểm.'};
      const range = placement && interval(placement);
      const validTime = range && original.date === date && range.end - range.start === original.effort &&
        placementWindows(original, items, date, proposal.constraints || {}).free
          .some(window => window.start <= range.start && window.end >= range.end);
      if (!validTime || applied.has(original.id) || !previewPlacement(placement, items).ok) {
        return {ok: false, state, code: 'invalid', message: 'Khung giờ đề xuất hiện không còn hợp lệ.'};
      }
      items[index] = placement;
      applied.add(original.id);
    }
    const revision = state.revision + Number(proposal.placements.length > 0);
    return {ok: true, state: {...state, items, revision}, items, revision};
  }

  function snapshot(items, date, revision, now = 420) {
    const day = items.filter(item => isDayItem(item, date));
    const progressItems = [...new Map(day.filter(item => ['fixed','child','task','deadline'].includes(item.kind) &&
      !item.transparent && item.tracked !== false && (interval(item) || item.kind === 'deadline'))
      .map(item => [item.id, item])).values()];
    const sortByTime = (a,b) => (a.start ?? DAY) - (b.start ?? DAY) || String(a.id).localeCompare(String(b.id));
    const milestones = progressItems.filter(item => !item.done && (item.end ?? item.start ?? DAY) >= now).sort(sortByTime);
    const trips = day.filter(item => item.kind === 'trip').map(travelBlock).filter(Boolean).sort(sortByTime);
    const trip = trips.find(item => absoluteMinute(item.leaveDate, item.leaveAt) >= absoluteMinute(date, now)) || null;
    const reminders = trips.map(item => ({
      id: 'leave-' + item.id, itemId: item.id, date: item.leaveDate, minute: item.leaveAt,
      revision, label: 'Đến giờ rời đi', enabled: false, status: 'preview'
    }));
    return {
      date, revision, timezone: DEMO_ZONE, next: milestones[0] || null, trip,
      completed: progressItems.filter(item => item.done).length,
      total: progressItems.length, milestones: milestones.slice(0, 3), reminders
    };
  }

  const diffFields = ['title','kind','date','endDate','start','end','location','timezone','allDay','transparent','canceled'];

  function candidateDiff(original, incoming) {
    return diffFields.flatMap(field => {
      const before = original?.[field] ?? null;
      const after = incoming?.[field] ?? null;
      return Object.is(before, after) ? [] : [{field, before, after}];
    });
  }

  function demoBatch() {
    return [
      {kind: 'image', name: 'zalo-nhom-lab.png', fixture: true, text: 'Họp nhóm lab mai 7h tại phòng B2'},
      {kind: 'image', name: 'lms-storyboard.png', fixture: true, text: 'Nộp bản nháp storyboard | 2026-11-25 | 17:00 | LMS'},
      {kind: 'link', name: 'Lịch thực hành · ICS', fixture: true, url: 'https://demo.fri.example/lich-thuc-hanh.ics', text:
        'BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nUID:fri-workshop-2026\nSUMMARY:Duyệt bản mẫu với nhóm\nDTSTART;TZID=Asia/Ho_Chi_Minh:20261123T113000\nDTEND;TZID=Asia/Ho_Chi_Minh:20261123T120000\nLOCATION:Phòng B2\nEND:VEVENT\nEND:VCALENDAR'},
      {kind: 'link', name: 'Lịch trên cổng sinh viên', fixture: true, fail: true, url: 'https://demo.fri.example/lich-can-dang-nhap'}
    ];
  }

  function demoState() {
    const monday = DEMO_DATE;
    const day = (offset, fields) => ({date: addDays(monday, offset), location: '', ...fields});
    const items = [
      day(0, {id:'notes', title:'Chuẩn bị tài liệu Robotics', kind:'task', start:390, end:410, effort:20, done:true}),
      day(0, {id:'review', title:'Xem lại ghi chú nhóm', kind:'task', start:410, end:420, effort:10, done:true}),
      day(0, {id:'school-trip', title:'Đến trường', kind:'trip', start:435, end:470, arriveBy:470, appointmentAt:480, duration:30, buffer:5, origin:'Nhà', destination:'Trường', location:'Nhà → Trường'}),
      day(0, {id:'campus', title:'Có mặt tại trường', kind:'context', start:470, end:720, location:'Trường'}),
      day(0, {id:'robotics', title:'Robotics', kind:'fixed', start:480, end:630, location:'Phòng B2 · Trường', site:'Trường'}),
      day(0, {id:'robotics-report', title:'Báo cáo trong buổi học', kind:'child', start:570, end:600, parentId:'robotics', location:'Phòng B2 · Trường', site:'Trường', tracked:false}),
      day(0, {id:'slides', title:'Làm slide Demo Day', kind:'task', start:840, end:900, effort:60, deadline:1020, location:'', reason:'Khung tập trung 60 phút trước hạn nộp.'}),
      day(0, {id:'storyboard', title:'Nộp bản nháp storyboard', kind:'deadline', start:1020, end:null, location:'LMS'}),
      day(0, {id:'prototype-review', title:'Viết báo cáo Prototype', kind:'task', start:null, end:null, effort:60, deadline:1020, location:'Trường'}),
      day(1, {id:'ux-research', title:'Lớp UX Research', kind:'fixed', start:540, end:630, location:'Phòng A.305'}),
      day(1, {id:'interview', title:'Phỏng vấn người dùng', kind:'fixed', start:660, end:705, location:'Trực tuyến'}),
      day(2, {id:'syllabus', title:'Đọc syllabus', kind:'task', start:570, end:630, effort:60}),
      day(3, {id:'club', title:'Họp câu lạc bộ', kind:'fixed', start:840, end:900, location:'Phòng sinh hoạt chung'}),
      day(4, {id:'demo-day', title:'Demo Day', kind:'fixed', start:870, end:930, location:'Hội trường A'})
    ];
    return {items, sources:[], candidates:[], revision:1};
  }

  function appointmentQuestions(rows) {
    return rows.flatMap(row => {
      const ask = (field, reason) => ({rowId: row.id, field, reason});
      const questions = [];
      const start = parseTime(row.start);
      const end = parseTime(row.end);
      if (!row.title?.trim()) questions.push(ask('title'));
      if (!calendarDate(row.date)) questions.push(ask('date'));
      else if (row.overnight && !calendarDate(addDays(row.date,1))) questions.push(ask('date','overnight-range'));
      if (start == null) questions.push(ask('start'));
      if (end == null) questions.push(ask('end'));
      else if (start != null && end <= start && !row.overnight) questions.push(ask('end','order'));
      return questions;
    });
  }

  function appointmentItem(row) {
    if (appointmentQuestions([row]).length) return null;
    const item = {
      id: row.id, kind: 'fixed', title: row.title.trim(), date: row.date,
      endDate: row.overnight ? addDays(row.date,1) : row.date, timezone: DEMO_ZONE,
      start: parseTime(row.start), end: parseTime(row.end),
      location: (row.location || '').trim(), notes: (row.notes || '').trim()
    };
    return calendarDate(item.endDate) && validateItem(item).ok ? item : null;
  }

  return {
    DEMO_DATE, DEMO_ZONE, calendarDate, addDays, startOfWeek, dateLabel, formatTime, parseTime,
    hash, normalizeUrl, parseIcs, parseJsonLd, parseSourceText, demoBatch, demoState,
    isDayItem, overlaps, travelBlock, validateItem, previewPlacement, plan, commitPlan, snapshot, candidateDiff,
    appointmentQuestions, appointmentItem
  };
})();

const sourceKinds = {fixed: 'Lịch cố định', task: 'Việc linh hoạt', deadline: 'Hạn nộp', context: 'Bối cảnh', child: 'Việc trong buổi'};
const sourceStatuses = {
  reading: ['Đang đọc', ''], ready: ['Đã đọc', 'good'], manual: ['Cần nhập tay', 'warn'], error: ['Không đọc được', 'danger'],
};
const SOURCE_TEXT_LIMIT = 1000000;
const SOURCE_IMAGE_LIMIT = 16 * 1024 * 1024;
const sourceIntake = {files: [], draftLinks: '', draftText: ''};
const reviewFields = ['title', 'kind', 'date', 'endDate', 'location', 'parentId', 'start', 'end', 'deadline', 'effort', 'allDay'];
let activeCandidateId = '';
let showLaterCandidates = false;
const sourceReads = new Set();

function sourceIcon(kind) {
  return {image: 'image', link: 'link', file: 'text', text: 'text'}[kind] || 'inbox';
}

function sourceById(id) {
  return state.sources.find(source => source.id === id);
}

function reviewCandidates() {
  return state.candidates.filter(candidate => candidate.status === 'pending' || (showLaterCandidates && candidate.status === 'later'))
    .sort((a, b) => Number(b.uncertain?.length > 0) - Number(a.uncertain?.length > 0));
}

function sourceRow(source) {
  const effective = sourceEffectiveStatus(source);
  const [status, style] = sourceStatuses[effective] || sourceStatuses.error;
  const retry = source.kind === 'link' || source.fixture;
  const isWaiting = effective === 'reading';
  return `<article class="source-row">
    <span class="event-icon" aria-hidden="true">${icon(sourceIcon(source.kind))}</span>
    <div><strong>${e(source.label)}</strong>
      <div>${source.fixture ? '<span class="badge">Mẫu</span> ' : ''}<span class="badge ${style}">${status}</span></div>
      <p class="muted">${e(sourceMessage(source))}</p>
    </div>
    <div class="actions">
      ${retry && !isWaiting ? button(effective === 'error' ? 'Thử lại' : 'Kiểm tra lại', 'source-retry', {id: source.id}) : ''}
      ${['manual', 'error'].includes(effective) ? button('Dán nội dung', 'source-fallback', {id: source.id}) : ''}
      ${button('Xóa nguồn', 'source-remove', {id: source.id, kind: 'ghost'})}
    </div>
  </article>`;
}

function sourcesPage() {
  const sourceIntro = intro('Nhập lịch', 'Nguồn', 'Thêm ảnh, link lịch, tệp ICS hoặc đoạn tin nhắn để đưa vào hàng đợi duyệt.');
  if (!state.sources.length) {
    return sourceIntro + `<section class="card">${empty('Chưa có nguồn', 'Bạn có thể thử quy trình nhập, đối chiếu và lên lịch bằng dữ liệu mẫu.', button('Dùng dữ liệu mẫu', 'source-sample', {icon: 'plus'}))}</section>`;
  }
  return sourceIntro + `<div class="split"><section class="card panel"><div class="section-title"><h2>Nguồn đã thêm</h2><span class="count">${state.sources.length}</span></div>
    ${state.sources.map(sourceRow).join('')}</section><aside class="stack aside"><section class="card panel stack"><h2>Cần duyệt</h2>
    <p class="muted">Fri giữ từng bản nháp cạnh bằng chứng. Bạn có thể duyệt các mục đã đọc trong khi nguồn khác đang xử lý.</p>
    <div class="actions">${button('Mở hàng đợi', 'review-open', {icon: 'inbox', primary: true})}</div></section></aside></div>`;
}

function sourceControls(form, message) {
  const element = form.querySelector('[data-source-error]');
  element.textContent = message;
  element.hidden = !message;
}

function sourceInputTime(value) {
  return Number.isInteger(value) && value >= 0 && value < 1440 ? D.formatTime(value) : '';
}

function itemFromReview(candidate, form) {
  const data = form ? new FormData(form) : null;
  const fields = data ? Object.fromEntries(data) : null;
  const input = key => (fields ? String(fields[key] ?? '').trim() : candidate[key]);
  const kind = input('kind');
  const allDay = kind === 'fixed' && (fields ? fields.allDay === 'on' : candidate.allDay === true);
  const start = allDay || kind === 'task' ? null : fields ? D.parseTime(input('start')) : input('start');
  const end = kind === 'deadline' || kind === 'task' || allDay ? null : fields ? D.parseTime(input('end')) : input('end');
  const date = D.calendarDate(input('date'));
  const endDate = kind === 'deadline' || kind === 'task' ? date : D.calendarDate(input('endDate')) || date;
  const title = String(input('title') || '').trim();
  const location = String(input('location') || '').trim();
  const effort = kind === 'task' ? Number(input('effort')) : null;
  const deadline = kind === 'task' ? (fields ? D.parseTime(input('deadline')) : input('deadline')) : null;
  const parentId = kind === 'child' ? input('parentId') : '';
  if (!title || !date || !sourceKinds[kind]) return {error: 'Nhập tên mục, loại và ngày đầy đủ.'};
  if (!allDay && kind !== 'task' && !Number.isInteger(start)) return {error: 'Xác nhận giờ chính xác trước khi đưa vào lịch.'};
  if (!allDay && !['task', 'deadline'].includes(kind) && !Number.isInteger(end)) return {error: 'Nhập giờ kết thúc.'};
  if (allDay && endDate < date || !allDay && !['task', 'deadline'].includes(kind) && (endDate < date || endDate === date && end <= start)) {
    return {error: 'Giờ kết thúc cần sau giờ bắt đầu. Với lịch qua nửa đêm, chọn ngày kết thúc.'};
  }
  if (kind === 'task' && (!Number.isInteger(effort) || effort < 1 || effort > 1440)) return {error: 'Nhập số phút làm việc từ 1 đến 1440.'};
  if (kind === 'child' && !parentId) return {error: 'Chọn buổi học hoặc cuộc hẹn chứa việc này.'};
  if (kind === 'child') {
    const parent = state.items.find(item => item.id === parentId);
    if (!parent || parent.date !== date || endDate !== date || start < parent.start || end > parent.end || (location && location !== parent.location)) {
      return {error: 'Việc trong buổi cần nằm trong khung giờ và địa điểm của lịch cha.'};
    }
  }
  const originalTime = candidate.sourceValues || candidate;
  const unchangedTime = date === originalTime.date && start === originalTime.start && end === originalTime.end;
  const temporal = allDay ? 'date' : unchangedTime && originalTime.temporal === 'instant' ? 'instant' : 'floating';
  return {value: {title, kind, date, endDate, start, end, effort, deadline, location, parentId, allDay, temporal, transparent: Boolean(candidate.transparent),
    timezone: temporal === 'date' ? null : temporal === 'floating' ? D.DEMO_ZONE : originalTime.timezone,
    instant: temporal === 'instant' ? originalTime.instant : null, endInstant: temporal === 'instant' ? originalTime.endInstant : null}};
}

function reviewForm(candidate) {
  const draft = candidate.draft || candidate;
  const task = draft.kind === 'task';
  const child = draft.kind === 'child';
  const deadline = draft.kind === 'deadline';
  const allDay = draft.kind === 'fixed' && draft.allDay;
  const options = Object.entries(sourceKinds).map(([value, label]) => `<option value="${value}"${value === draft.kind ? ' selected' : ''}>${label}</option>`).join('');
  const parents = state.items.filter(item => item.kind === 'fixed' && !item.allDay).map(item =>
    `<option value="${e(item.id)}"${item.id === draft.parentId ? ' selected' : ''}>${e(item.title)} · ${e(item.date)}</option>`).join('');
  const date = field('Ngày', `<input type="date" name="date" value="${e(draft.date || '')}">`);
  const endDate = field('Ngày kết thúc', `<input type="date" name="endDate" value="${e(draft.endDate || '')}">`);
  const times = `<div class="form-grid">${field(deadline ? 'Hạn nộp lúc' : 'Bắt đầu', `<input type="time" name="start" value="${e(sourceInputTime(draft.start))}">`)}
    ${deadline ? '' : field('Kết thúc', `<input type="time" name="end" value="${e(sourceInputTime(draft.end))}">`)}</div>`;
  const duplicate = duplicateReviewItem(candidate);
  return `<form class="form" id="source-review-form" data-candidate="${e(candidate.id)}" data-version="${e(candidate.version ?? 1)}" novalidate>
    ${field('Tên mục', `<input type="text" name="title" maxlength="120" value="${e(draft.title || '')}">`)}
    ${field('Loại mục', `<select name="kind">${options}</select>`)}
    <div class="form-grid">${date}${!deadline && !task ? endDate : ''}</div>
    ${draft.kind === 'fixed' ? `<label class="field check"><input type="checkbox" name="allDay"${allDay ? ' checked' : ''}> Cả ngày</label>` : ''}
    ${allDay || task ? '' : times}
    ${task ? `<div class="form-grid">${field('Thời lượng (phút)', `<input type="number" name="effort" min="1" max="1440" value="${e(draft.effort ?? '')}">`)}${field('Cần xong trước (tùy chọn)', `<input type="time" name="deadline" value="${e(sourceInputTime(draft.deadline))}">`)}</div>` : ''}
    ${child ? field('Lịch cha', `<select name="parentId"><option value="">Chọn lịch cha</option>${parents}</select>`) : ''}
    ${field('Địa điểm', `<input type="text" name="location" maxlength="160" value="${e(draft.location || '')}">`)}
    ${duplicate ? `<div class="notice warn">Có mục tương tự “${e(duplicate.title)}” trong lịch. Bạn có thể giữ cả hai hoặc liên kết nguồn với mục đã có.</div>` : ''}
    <p class="error" data-source-error role="alert" hidden></p>
    <div class="actions">
      ${button('Để sau', 'review-later', {id: candidate.id, kind: 'ghost'})}${button('Bỏ qua', 'review-discard', {id: candidate.id, kind: 'ghost'})}
      ${duplicate ? button('Gộp với mục có sẵn', 'review-merge', {id: candidate.id}) : ''}
      <button class="btn primary" type="submit">${icon('check')}${duplicate ? 'Giữ riêng và xác nhận' : candidate.itemId ? 'Xác nhận thay đổi' : 'Xác nhận'}</button>
    </div></form>`;
}

const sourceValueLabels = {title: 'Tên', date: 'Ngày', endDate: 'Ngày kết thúc', start: 'Bắt đầu', end: 'Kết thúc', location: 'Địa điểm', allDay: 'Cả ngày', canceled: 'Hủy'};

function evidenceValue(key, value) {
  if (value === null || value === undefined || value === '') return 'Chưa rõ';
  if (key === 'start' || key === 'end') return D.formatTime(value);
  if (key === 'allDay' || key === 'canceled') return value ? 'Có' : 'Không';
  return String(value);
}

function sourceDiff(candidate) {
  if (!candidate.previous) return '';
  const item = state.items.find(entry => entry.id === candidate.itemId);
  return Object.keys(sourceValueLabels).filter(key => (candidate.previous[key] ?? null) !== (candidate.sourceValues[key] ?? null)).map(key => {
    const baseline = key === 'endDate' ? candidate.previous.endDate || candidate.previous.date : candidate.previous[key];
    const overridden = item && (item[key] ?? null) !== (baseline ?? null);
    return `<div class="diff"><strong>${e(sourceValueLabels[key])}</strong><del>${e(evidenceValue(key, candidate.previous[key]))}</del><ins>${e(evidenceValue(key, candidate.sourceValues[key]))}</ins>
      ${overridden ? `<span>Giá trị bạn đang dùng · ${e(evidenceValue(key, item[key]))}</span>` : ''}</div>`;
  }).join('');
}

function evidenceImage(source) {
  if (!source) return '';
  const preview = source.fixture && typeof FRI_SAMPLE_IMAGES !== 'undefined' ? FRI_SAMPLE_IMAGES[source.label] : source.preview;
  return typeof preview === 'string' && /^data:image\/(?:png|jpeg|webp);base64,[\w+/=]+$/.test(preview) ? preview : '';
}

function sourceEvidence(candidate) {
  const source = sourceById(candidate.sourceId);
  const image = evidenceImage(source);
  const uncertainties = candidate.uncertain?.length ? `<div class="notice warn" style="margin-top:10px"><strong>Cần xác nhận</strong><ul class="rules">${candidate.uncertain.map(note => `<li>${e(note)}</li>`).join('')}</ul></div>` : '';
  return `<section class="evidence" aria-label="Bằng chứng"><div class="caption">Bằng chứng</div>
    <h3>${e(source?.label || 'Nguồn đã xóa')}</h3>${source?.fixture ? '<span class="badge">Dữ liệu mẫu</span>' : ''}
    ${image ? `<img src="${e(image)}" alt="Ảnh bằng chứng ${e(source.label)}">${button('Mở ảnh', 'source-image', {id: source.id, icon: 'external', kind: 'ghost'})}` : ''}
    ${candidate.evidence ? `<blockquote>${e(candidate.evidence)}</blockquote>` : '<p class="muted">Dùng ảnh hoặc nội dung gốc để điền thông tin.</p>'}
    ${(candidate.notes || []).map(note => `<p class="muted">${e(note)}</p>`).join('')}${sourceDiff(candidate)}${uncertainties}</section>`;
}

function reviewPage() {
  const candidates = reviewCandidates();
  const active = candidates.find(candidate => candidate.id === activeCandidateId) || candidates[0];
  const later = state.candidates.filter(candidate => candidate.status === 'later').length;
  const errorSources = state.sources.filter(source => sourceEffectiveStatus(source) === 'error');
  const pendingSources = state.sources.filter(source => sourceEffectiveStatus(source) === 'reading').length;
  const ready = candidates.filter(readyForBulk).length;
  const actions = ready > 1 ? button('Xác nhận các mục có đủ thông tin', 'review-bulk', {icon: 'check'}) : '';
  const header = intro('Đối chiếu nguồn', 'Cần duyệt', 'Kiểm tra thông tin từ nguồn trước khi thêm vào lịch.', actions);
  const errors = errorSources.map(source => `<div class="notice warn"><strong>Không đọc được ${e(source.label)}</strong><p>${e(sourceMessage(source))}</p><div class="actions">
    ${source.kind === 'link' || source.fixture ? button('Thử lại', 'source-retry', {id: source.id}) : ''}${button('Dán nội dung', 'source-fallback', {id: source.id})}</div></div>`).join('');
  const statuses = pendingSources ? `<p class="notice" role="status">${pendingSources} nguồn đang đọc. Bạn có thể tiếp tục duyệt.</p>` : '';
  const laterButton = later ? `<div class="actions">${button(showLaterCandidates ? 'Ẩn mục để sau' : `Mục để sau (${later})`, 'review-show-later')}</div>` : '';
  if (!active) return header + `<div class="stack">${statuses}${errors}${laterButton}<section class="card">${empty('Không còn mục chờ duyệt', 'Bạn có thể thêm nguồn hoặc xem những mục đã xác nhận trong lịch.', button('Về lịch', 'review-calendar'))}</section></div>`;
  const cards = candidates.map(candidate => `<button class="review-entry" type="button" data-action="review-select" data-id="${e(candidate.id)}" aria-pressed="${candidate.id === active.id}">
    <strong>${e(candidate.title || sourceById(candidate.sourceId)?.label || 'Mục nhập tay')}</strong><small>${e(candidate.status === 'later' ? 'Để sau' : candidate.canceled ? 'Nguồn báo hủy' : candidate.previous ? 'Nguồn đã đổi' : candidate.uncertain?.length ? 'Cần xác nhận' : 'Đủ thông tin')}</small></button>`).join('');
  const cancelControls = `<div class="stack"><div class="notice warn">Nguồn thông báo hủy. Bạn có thể xác nhận xóa lịch hoặc giữ mục đã chốt.</div><div class="actions">
    ${button('Giữ lịch', 'review-discard', {id: active.id})}${button('Xác nhận hủy', 'review-cancel-item', {id: active.id, primary: true})}</div></div>`;
  return header + `<div class="stack">${statuses}${errors}${laterButton}<div class="review-grid"><nav class="card review-list" aria-label="Bản nháp">${cards}</nav>
    <section class="card panel stack"><h2 id="review-active-heading" tabindex="-1">${e(active.title || 'Điền thông tin')}</h2><div class="review-detail">${sourceEvidence(active)}${active.canceled ? cancelControls : reviewForm(active)}</div></section></div></div>`;
}

function saveSourceIntakeText() {
  const current = document.getElementById('source-intake-form');
  if (!current) return;
  sourceIntake.draftLinks = current.elements.links.value;
  sourceIntake.draftText = current.elements.text.value;
}

function sourceQueueMarkup() {
  return sourceIntake.files.map((entry, index) => `<div class="source-row"><span class="event-icon">${icon(sourceIcon(entry.kind))}</span><div><strong>${e(entry.file.name)}</strong>
    ${entry.previewUrl ? `<img src="${e(entry.previewUrl)}" alt="" width="52" height="42" style="display:block;object-fit:cover;border-radius:7px;margin-top:4px">` : ''}</div>
    <div class="actions">${button('Bỏ tệp', 'source-queue-remove', {id: index, kind: 'ghost'})}</div></div>`).join('');
}

function openIntake() {
  openDialog('Thêm nguồn', `<form class="form" id="source-intake-form" novalidate>
    <label class="file-drop field" id="source-drop">Thêm nhiều ảnh hoặc tệp ICS <span class="muted">Kéo thả vào đây hoặc chọn từ thiết bị.</span>
      <input type="file" id="source-files" name="files" accept="image/png,image/jpeg,image/webp,image/gif,image/avif,image/bmp,.ics,text/calendar" multiple></label>
    <div id="source-file-list">${sourceQueueMarkup()}</div>
    ${field('Link lịch', `<textarea name="links" placeholder="https://… (mỗi link một dòng)">${e(sourceIntake.draftLinks)}</textarea>`)}
    ${field('Nội dung dán', `<textarea name="text" maxlength="20000" placeholder="Tên việc | 2026-11-25 | 17:00">${e(sourceIntake.draftText)}</textarea>`)}
    <p class="help">Ảnh được giữ làm bằng chứng để bạn điền thông tin. Link được đọc khi truy cập công khai và cho phép trình duyệt đọc dữ liệu.</p>
    <p class="error" data-source-error role="alert" hidden></p>
    <div class="actions end">${button('Dùng dữ liệu mẫu', 'source-sample')}<button type="submit" class="btn primary">Đọc nguồn</button></div></form>`);
  const area = document.getElementById('source-drop');
  area.addEventListener('dragover', event => {event.preventDefault(); area.classList.add('drag');});
  area.addEventListener('dragleave', () => area.classList.remove('drag'));
  area.addEventListener('drop', event => {event.preventDefault(); area.classList.remove('drag'); stageSourceFiles(event.dataTransfer.files);});
  document.getElementById('source-files').addEventListener('change', event => {
    stageSourceFiles(event.target.files);
    event.target.value = '';
  });
}

function stageSourceFiles(files) {
  const allowedImages = /^image\/(?:jpeg|png|webp|gif|avif|bmp)$/i;
  let rejected = 0;
  for (const file of files) {
    const kind = /\.ics$/i.test(file.name) || file.type === 'text/calendar' ? 'file' : allowedImages.test(file.type) ? 'image' : '';
    if (!kind || sourceIntake.files.length >= 15 || file.size > (kind === 'file' ? SOURCE_TEXT_LIMIT : SOURCE_IMAGE_LIMIT)) {rejected++; continue;}
    if (sourceIntake.files.some(entry => entry.file.name === file.name && entry.file.size === file.size && entry.file.lastModified === file.lastModified)) continue;
    sourceIntake.files.push({file, kind, previewUrl: kind === 'image' ? URL.createObjectURL(file) : ''});
  }
  document.getElementById('source-file-list').innerHTML = sourceQueueMarkup();
  sourceControls(document.getElementById('source-intake-form'), rejected ? 'Một số tệp vượt giới hạn hoặc sai định dạng. Có thể thêm tối đa 15 tệp mỗi lượt, ảnh tối đa 16 MB và ICS tối đa 1 MB.' : '');
}

function clearSourceIntake() {
  for (const entry of sourceIntake.files) if (entry.previewUrl) URL.revokeObjectURL(entry.previewUrl);
  Object.assign(sourceIntake, {files: [], draftLinks: '', draftText: ''});
}

function sourceEffectiveStatus(source) {
  return source.status === 'reading' && !sourceReads.has(source) ? 'error' : source.status;
}

function sourceMessage(source) {
  if (source.status === 'reading' && !sourceReads.has(source)) return 'Lần đọc trước bị gián đoạn. Hãy thử lại hoặc dán nội dung.';
  return source.message || (source.kind === 'link' ? 'Chỉ đọc khi bạn yêu cầu.' : 'Dữ liệu lưu trên trình duyệt này.');
}

function sourceRender() {
  const current = document.activeElement;
  const sourceForm = current?.closest('#source-review-form');
  const fieldName = current?.getAttribute('name');
  const selection = current?.tagName === 'TEXTAREA' || current?.type === 'text' ? [current.selectionStart, current.selectionEnd] : null;
  render();
  const refreshed = document.getElementById('source-review-form');
  if (sourceForm && fieldName && refreshed?.dataset.candidate === sourceForm.dataset.candidate) {
    const input = refreshed.elements.namedItem(fieldName);
    if (input) {
      input.focus({preventScroll: true});
      if (selection) input.setSelectionRange(...selection);
    }
  }
}

function normalizeSourceValues(candidate) {
  return { ...candidate, endDate: candidate.endDate || null, allDay: Boolean(candidate.allDay),
    transparent: Boolean(candidate.transparent), canceled: Boolean(candidate.canceled) };
}

function sourceFieldsForUpdate(previous, incoming) {
  const item = state.items.find(entry => entry.id === previous?.itemId);
  const accepted = previous?.acceptedSourceValues || previous?.sourceValues;
  if (!item || !accepted) return incoming;
  const merged = {...incoming};
  for (const key of Object.keys(sourceValueLabels)) {
    if (key === 'canceled') continue;
    const baseline = key === 'endDate' ? accepted.endDate || accepted.date : accepted[key];
    if ((item[key] ?? null) !== (baseline ?? null)) merged[key] = item[key];
  }
  return merged;
}

function mergeSourceCandidates(source, parsed) {
  for (const result of parsed) {
    const values = normalizeSourceValues(result);
    if (!values.sourceKey) continue;
    const id = source.id + ':' + values.sourceKey;
    const index = state.candidates.findIndex(candidate => candidate.id === id);
    const previous = state.candidates[index];
    if (previous && (values.sourceVersion ?? 0) < (previous.sourceValues.sourceVersion ?? 0)) continue;
    const changes = previous && D.candidateDiff(previous.sourceValues, values);
    if (previous && !changes.length && previous.evidence === values.evidence) continue;
    const snapshot = previous?.acceptedSourceValues || previous?.sourceValues || null;
    const candidate = {...sourceFieldsForUpdate(previous, values), id, sourceId: source.id, sourceValues: values,
      previous: snapshot, acceptedSourceValues: previous?.acceptedSourceValues || null,
      status: 'pending', itemId: previous?.itemId || null, version: (previous?.version || 0) + 1};
    if (previous?.draft) {
      const entered = value => value === '' || value === undefined ? null : value;
      candidate.draft = Object.fromEntries(reviewFields.map(field => {
        const edited = Object.hasOwn(previous.draft, field) && entered(previous.draft[field]) !== entered(previous[field]);
        return [field, edited ? previous.draft[field] : candidate[field]];
      }));
    }
    if (index < 0) state.candidates.push(candidate);
    else state.candidates[index] = candidate;
  }
}

function fixtureEntry(source) {
  return D.demoBatch().find(item => item.name === source.label && item.kind === source.kind);
}

function parseSourceResponse(content) {
  return /^\s*BEGIN:VCALENDAR/i.test(content) ? D.parseIcs(content) : D.parseJsonLd(content);
}

async function readPublicCalendar(url) {
  if (!isOnline()) throw new Error('Bạn đang ngoại tuyến. Thử lại khi có mạng hoặc dán nội dung.');
  const signal = AbortSignal.timeout(8000);
  let response;
  try { response = await fetch(url, {signal, credentials: 'omit', redirect: 'error', referrerPolicy: 'no-referrer'}); }
  catch { throw new Error('Link chưa cho phép đọc từ trình duyệt, chuyển hướng hoặc kết nối bị gián đoạn. Dùng tệp ICS, ảnh hoặc dán nội dung.'); }
  if (!response.ok) throw new Error(response.status === 401 || response.status === 403
    ? 'Nguồn yêu cầu đăng nhập hoặc cấp quyền. Hãy gửi ảnh, tệp ICS hoặc dán nội dung.' : `Máy chủ trả về mã ${response.status}. Hãy kiểm tra link hoặc dùng tệp ICS.`);
  if (Number(response.headers.get('content-length')) > SOURCE_TEXT_LIMIT) throw new Error('Nội dung nguồn lớn hơn 1 MB. Hãy xuất tệp ICS nhỏ hơn.');
  if (!response.body) return '';
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let content = '';
  let total = 0;
  while (true) {
    const part = await reader.read();
    if (part.done) break;
    total += part.value.byteLength;
    if (total > SOURCE_TEXT_LIMIT) {
      await reader.cancel();
      throw new Error('Nội dung nguồn lớn hơn 1 MB. Hãy xuất tệp ICS nhỏ hơn.');
    }
    content += decoder.decode(part.value, {stream: true});
  }
  return content + decoder.decode();
}

async function prepareSourcePreview(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const scale = Math.min(1, 1120 / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
    const context = canvas.getContext('2d');
    context.drawImage(img, 0, 0, canvas.width, canvas.height);
    let preview = canvas.toDataURL('image/webp', 0.84);
    if (preview.length > 190000) preview = canvas.toDataURL('image/webp', 0.62);
    return preview.length < 260000 ? preview : '';
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function readSource(source, entry = {}) {
  if (sourceReads.has(source)) return;
  sourceReads.add(source);
  source.status = 'reading';
  source.message = 'Đang đọc nguồn…';
  persist();
  let parsed = [];
  let status = 'ready';
  let message = '';
  try {
    const fixture = source.fixture ? fixtureEntry(source) : null;
    if (entry.text !== undefined && entry.fallback) {
      parsed = parseSourceResponse(entry.text);
      if (!parsed.length) parsed = D.parseSourceText(entry.text);
    } else if (fixture?.fail) {
      throw new Error('Nguồn mẫu yêu cầu đăng nhập. Hãy thử lại hoặc dán nội dung.');
    } else if (source.kind === 'image') {
      if (fixture) parsed = D.parseSourceText(fixture.text);
      else {
        source.preview = await prepareSourcePreview(entry.file);
        parsed = [{sourceKey: 'image-manual', title: '', kind: 'fixed', uncertain: ['Điền ngày và giờ từ ảnh.'], evidence: '', notes: []}];
        status = 'manual';
        message = source.preview ? 'Ảnh sẵn sàng để đối chiếu khi nhập tay.' : 'Ảnh quá lớn cho bản xem trước. Mở ảnh gốc trên thiết bị để đối chiếu.';
      }
    } else if (source.kind === 'text') {
      parsed = D.parseSourceText(entry.text);
    } else {
      const content = fixture?.text ?? (entry.file ? await entry.file.text() : await readPublicCalendar(source.url));
      parsed = parseSourceResponse(content);
    }
    if (!parsed.length) throw new Error('Không tìm thấy mục ICS hoặc dữ liệu sự kiện JSON-LD có thể đọc. Dùng tệp ICS, ảnh hoặc dán nội dung.');
    if (sourceById(source.id) !== source) return;
    mergeSourceCandidates(source, parsed.slice(0, 100));
    source.status = status;
    source.message = message || `${Math.min(parsed.length, 100)} mục đọc được. ${entry.fallback ? 'Đã dùng nội dung bạn dán.' : 'Xác nhận thông tin trong Cần duyệt.'}`;
  } catch (error) {
    if (sourceById(source.id) !== source) return;
    source.status = 'error';
    source.message = error?.message || 'Không thể đọc nguồn. Hãy thử lại hoặc nhập tay.';
  } finally {
    sourceReads.delete(source);
    if (sourceById(source.id) === source) {
      persist();
      sourceRender();
    }
  }
}

async function fileFingerprint(file) {
  const bytes = await file.arrayBuffer();
  if (globalThis.crypto?.subtle) {
    const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
    return Array.from(hash, value => value.toString(16).padStart(2, '0')).join('');
  }
  let hash = 2166136261;
  for (const value of new Uint8Array(bytes)) hash = Math.imul(hash ^ value, 16777619);
  return (hash >>> 0).toString(36) + '-' + file.size;
}

async function addBatchSource(entry) {
  const batchState = state;
  const key = entry.url || (entry.file ? await fileFingerprint(entry.file) : entry.fixture ? entry.name : D.hash(entry.text));
  if (state !== batchState) return;
  const id = entry.kind + '-' + D.hash(key);
  const existing = sourceById(id);
  if (existing) {
    if (entry.kind === 'link' || entry.fixture || sourceEffectiveStatus(existing) === 'error') return readSource(existing, entry);
    return;
  }
  const source = {id, kind: entry.kind, label: entry.name, url: entry.url || null, status: 'reading', fixture: Boolean(entry.fixture)};
  state.sources.push(source);
  return readSource(source, entry);
}

function runSourceBatch(batch) {
  clearSourceIntake();
  closeDialog();
  activeCandidateId = '';
  const reads = batch.map(entry => addBatchSource(entry));
  go('review');
  sourceRender();
  void Promise.allSettled(reads).then(results => {
    if (results.some(result => result.status === 'rejected')) notify('Một tệp không thể mở. Các nguồn còn lại đã được giữ.');
  });
}

function submitSourceBatch(form) {
  const links = form.elements.links.value.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
  const entries = sourceIntake.files.map(entry => ({...entry, name: entry.file.name}));
  const text = form.elements.text.value.trim();
  if (links.length > 20) return sourceControls(form, 'Có thể thêm tối đa 20 link mỗi lượt.');
  const invalid = [];
  for (const raw of links) {
    const url = D.normalizeUrl(raw);
    if (!url) {invalid.push(raw); continue;}
    if (!entries.some(entry => entry.url === url)) entries.push({kind: 'link', name: url, url});
  }
  if (text) entries.push({kind: 'text', name: 'Nội dung dán', text});
  if (!entries.length) return sourceControls(form, invalid.length ? 'Nhập link http hoặc https hợp lệ.' : 'Thêm ảnh, tệp ICS, link hoặc nội dung để tiếp tục.');
  if (invalid.length) {
    for (const raw of invalid) {
      const id = 'invalid-' + D.hash(raw);
      if (!sourceById(id)) state.sources.push({id, kind: 'text', label: raw.slice(0, 100), status: 'error', message: 'Link chưa hợp lệ. Hãy nhập lại bằng https hoặc dán nội dung.'});
    }
  }
  runSourceBatch(entries);
}

function duplicateReviewItem(candidate) {
  if (candidate.itemId || !candidate.date || !candidate.title) return null;
  const normalize = value => String(value ?? '').toLocaleLowerCase('vi').trim().replace(/\s+/g, ' ');
  const current = candidate.draft || candidate;
  return state.items.find(item => item.kind === current.kind && item.date === current.date && item.start === current.start &&
    item.end === current.end && normalize(item.title) === normalize(current.title) &&
    (!item.location || !current.location || normalize(item.location) === normalize(current.location)));
}

function readReviewDraft(form, candidate) {
  const raw = Object.fromEntries(new FormData(form));
  const draft = {...(candidate.draft || candidate)};
  for (const name of ['title', 'kind', 'date', 'endDate', 'location', 'parentId']) {
    if (Object.hasOwn(raw, name)) draft[name] = raw[name];
  }
  for (const name of ['start', 'end', 'deadline']) {
    if (Object.hasOwn(raw, name)) draft[name] = D.parseTime(raw[name]);
  }
  if (Object.hasOwn(raw, 'effort')) draft.effort = raw.effort;
  if (form.elements.allDay) draft.allDay = raw.allDay === 'on';
  candidate.draft = Object.fromEntries(reviewFields.filter(key => Object.hasOwn(draft, key)).map(key => [key, draft[key]]));
}

function sourceReviewInput(event) {
  const form = event.target.closest('#source-review-form');
  if (!form || !event.target.name) return;
  const candidate = state.candidates.find(item => item.id === form.dataset.candidate);
  if (!candidate || String(candidate.version) !== form.dataset.version) return;
  readReviewDraft(form, candidate);
  persist();
  if (['kind', 'allDay'].includes(event.target.name)) sourceRender();
}

document.addEventListener('input', sourceReviewInput);
document.addEventListener('input', event => {if (event.target.closest('#source-intake-form')) saveSourceIntakeText();});

function replaceReviewedItem(id, data) {
  const index = state.items.findIndex(item => item.id === id);
  if (data && index >= 0) state.items[index] = data;
  else if (data) state.items.push(data);
  else if (index >= 0) state.items.splice(index, 1);
}

function confirmSourceCandidate(candidate, form, mergedItem = null) {
  const current = state.candidates.find(entry => entry.id === candidate.id);
  if (!current || current !== candidate || form && form.dataset.version !== String(current.version) || !['pending', 'later'].includes(candidate.status)) {
    return {error: 'Nguồn vừa thay đổi. Hãy đọc bản mới nhất rồi xác nhận lại.'};
  }
  const result = itemFromReview(candidate, form);
  if (!mergedItem && result.error) return result;
  const itemId = candidate.itemId || mergedItem?.id || 'source-item-' + D.hash(candidate.id);
  const previous = state.items.find(item => item.id === itemId);
  const previousCandidate = {...candidate};
  const workItem = mergedItem ? {...mergedItem, sourceIds: [...new Set([...(mergedItem.sourceIds || []), candidate.sourceId])]} :
    {...previous, ...result.value, id: itemId, sourceIds: [...new Set([...(previous?.sourceIds || []), candidate.sourceId])]};
  if (!mergedItem) {
    const validity = D.validateItem(workItem);
    if (!validity.ok) return {error: validity.message};
    if (workItem.kind === 'child') {
      const placement = D.previewPlacement(workItem, state.items);
      if (!placement.ok) return {error: placement.message};
    }
  }
  replaceReviewedItem(itemId, workItem);
  Object.assign(candidate, {status: 'confirmed', itemId, acceptedSourceValues: candidate.sourceValues, draft: null});
  return {workItem, undo: () => {
    if (state.candidates.find(entry => entry.id === candidate.id) !== candidate || state.items.find(item => item.id === itemId) !== workItem) return;
    replaceReviewedItem(itemId, previous);
    Object.assign(candidate, previousCandidate);
  }};
}

function commitReviewedCandidate(candidate, form, mergedItem) {
  const result = confirmSourceCandidate(candidate, form, mergedItem);
  if (result.error) return sourceControls(form, result.error);
  activeCandidateId = '';
  persist({bump: true});
  sourceRender();
  focusSourceReview();
  notify(mergedItem ? `Đã liên kết nguồn với ${result.workItem.title}.` : `Đã xác nhận ${result.workItem.title}.`, () => {
    result.undo();
    persist({bump: true});
    sourceRender();
  });
}

function readyForBulk(candidate) {
  return candidate.status === 'pending' && !candidate.uncertain?.length && !candidate.previous && !candidate.draft &&
    !candidate.canceled && !duplicateReviewItem(candidate) && !itemFromReview(candidate).error;
}

function confirmSourcesInBulk() {
  const candidates = reviewCandidates().filter(readyForBulk);
  const updates = candidates.flatMap(candidate => {
    if (duplicateReviewItem(candidate)) return [];
    const result = confirmSourceCandidate(candidate);
    return result.error ? [] : [result];
  });
  if (!updates.length) return notify('Hiện chưa có mục đủ thông tin để xác nhận cùng lúc.');
  activeCandidateId = '';
  persist({bump: true});
  sourceRender();
  focusSourceReview();
  notify(`Đã xác nhận ${updates.length} mục.`, () => {
    updates.reverse().forEach(update => update.undo());
    persist({bump: true});
    sourceRender();
  });
}

function moveReviewCandidate(candidate, status) {
  const previous = candidate.status;
  candidate.status = status;
  activeCandidateId = '';
  persist();
  sourceRender();
  focusSourceReview();
  notify(status === 'later' ? 'Đã để mục này lại để duyệt sau.' : 'Đã bỏ qua đề xuất.', () => {
    if (state.candidates.find(entry => entry.id === candidate.id) !== candidate) return;
    candidate.status = previous;
    activeCandidateId = candidate.id;
    persist();
    sourceRender();
  });
}

function cancelSourceItem(candidate) {
  const previous = state.items.find(item => item.id === candidate.itemId);
  const priorStatus = candidate.status;
  if (previous) replaceReviewedItem(previous.id, null);
  candidate.status = 'confirmed';
  activeCandidateId = '';
  persist({bump: Boolean(previous)});
  sourceRender();
  focusSourceReview();
  notify(previous ? 'Đã xác nhận hủy lịch.' : 'Đã ghi nhận thông báo hủy.', () => {
    if (previous && !state.items.some(item => item.id === previous.id)) replaceReviewedItem(previous.id, previous);
    candidate.status = priorStatus;
    persist({bump: Boolean(previous)});
    sourceRender();
  });
}

function focusSourceReview() {
  (document.getElementById('review-active-heading') || document.getElementById('main'))?.focus();
}

function openSourceImage(source) {
  const image = evidenceImage(source);
  if (!image) return;
  const extension = image.split(';', 1)[0].split('/')[1];
  const filename = source.label.replace(/\.[^.]+$/, '') + '.' + extension;
  openDialog(source.label, `<div class="evidence"><img src="${e(image)}" alt="Ảnh bằng chứng ${e(source.label)}" style="max-height:62dvh;margin:0"></div>
    <div class="actions end" style="margin-top:11px"><a class="btn" href="${e(image)}" download="${e(filename)}">${icon('download')}Tải ảnh bằng chứng</a></div>`);
}

function openSourceFallback(source) {
  openDialog('Dán nội dung', `<form class="form" id="source-fallback-form" data-source="${e(source.id)}">
    <p class="muted">Bổ sung nội dung cho ${e(source.label)}. Fri lưu bản nháp để bạn kiểm tra.</p>
    ${field('Nội dung dán', '<textarea name="text" maxlength="20000" required placeholder="Tên việc | 2026-11-25 | 17:00"></textarea>')}
    <div class="actions end"><button class="btn primary" type="submit">Đọc nội dung</button></div></form>`);
}

function requestSourceRemoval(source) {
  openDialog('Xóa nguồn', `<div class="stack"><p>Xóa ${e(source.label)} cùng dữ liệu và các bản nháp của nguồn này. Các mục đã xác nhận vẫn có trong lịch.</p>
    <div class="actions end">${button('Giữ nguồn', 'source-keep')}${button('Xóa nguồn', 'source-delete', {id: source.id, kind: 'danger'})}</div></div>`);
}

function removeSourceAndDrafts(source) {
  closeDialog();
  const index = state.sources.indexOf(source);
  if (index < 0) return;
  state.sources.splice(index, 1);
  state.candidates = state.candidates.filter(item => item.sourceId !== source.id);
  for (const item of state.items) if (item.sourceIds?.includes(source.id)) item.sourceIds = item.sourceIds.filter(id => id !== source.id);
  persist();
  sourceRender();
  notify('Đã xóa nguồn và bản nháp của nguồn.');
}

function handleSourceAction(action, id, element) {
  if (action === 'intake') {openIntake(); return true;}
  if (action === 'source-sample') {runSourceBatch(D.demoBatch()); return true;}
  if (action === 'source-queue-remove') {
    const [entry] = sourceIntake.files.splice(Number(id), 1);
    if (entry?.previewUrl) URL.revokeObjectURL(entry.previewUrl);
    document.getElementById('source-file-list').innerHTML = sourceQueueMarkup();
    (document.querySelector('#source-file-list .btn') || document.getElementById('source-files'))?.focus();
    return true;
  }
  if (action === 'source-keep') {closeDialog(); return true;}
  if (action.startsWith('source-')) {
    const source = sourceById(id);
    if (!source) return true;
    if (action === 'source-retry') {void readSource(source); sourceRender();}
    else if (action === 'source-image') openSourceImage(source);
    else if (action === 'source-fallback') openSourceFallback(source);
    else if (action === 'source-remove') requestSourceRemoval(source);
    else if (action === 'source-delete') removeSourceAndDrafts(source);
    return true;
  }
  if (action === 'review-open') {go('review'); return true;}
  if (action === 'review-calendar') {go('calendar'); return true;}
  if (action === 'review-bulk') {confirmSourcesInBulk(); return true;}
  if (action === 'review-show-later') {showLaterCandidates = !showLaterCandidates; sourceRender(); return true;}
  if (!action.startsWith('review-')) return false;
  const candidate = state.candidates.find(item => item.id === id);
  if (!candidate) return true;
  if (action === 'review-select') {
    activeCandidateId = id;
    sourceRender();
    [...document.querySelectorAll('.review-entry')].find(entry => entry.dataset.id === id)?.focus({preventScroll: true});
  } else if (action === 'review-later') moveReviewCandidate(candidate, 'later');
  else if (action === 'review-discard') moveReviewCandidate(candidate, 'discarded');
  else if (action === 'review-cancel-item') cancelSourceItem(candidate);
  else if (action === 'review-merge') commitReviewedCandidate(candidate, element.closest('form'), duplicateReviewItem(candidate));
  return true;
}

function handleSourceSubmit(event) {
  const form = event.target;
  if (!['source-intake-form', 'source-review-form', 'source-fallback-form'].includes(form.id)) return false;
  event.preventDefault();
  if (form.id === 'source-intake-form') submitSourceBatch(form);
  else if (form.id === 'source-fallback-form') {
    const source = sourceById(form.dataset.source);
    const text = form.elements.text.value.trim();
    if (source && text) {
      closeDialog();
      activeCandidateId = '';
      void readSource(source, {fallback: true, text});
      go('review');
    }
  } else {
    const candidate = state.candidates.find(item => item.id === form.dataset.candidate);
    if (candidate) commitReviewedCandidate(candidate, form);
  }
  return true;
}
