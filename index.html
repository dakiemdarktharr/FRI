<!doctype html>
<html lang="en" data-mode="light" data-theme="clay">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1E3D4">
<meta name="description" content="Fri is a personal calendar for planning activities, appointments and the time between them.">
<title>Fri — Your day</title>
<style>
:root {
  color-scheme: light;
  --bg: #e9f4fa;
  --primary: #12608c;
  --accent: #855307;
  --text: #142a40;
  --muted: #486073;
  --surface: #f8fcff;
  --raised: #fff;
  --line: #cbdde8;
  --good: #216c5a;
  --danger: #9c304d;
  --glass: rgba(248, 252, 255, 0.72);
  --shadow: 0 20px 52px #1e53781b;
  --focus: var(--primary);
  --radius: 24px;
  --head: 68px;
  --rail: 202px;
}
:root[data-mode="dark"] {
  color-scheme: dark;
  --bg: #081e35;
  --primary: #6dcaf5;
  --accent: #ffd268;
  --text: #edf7ff;
  --muted: #aac0d1;
  --surface: #142b40;
  --raised: #1a344b;
  --line: #365067;
  --good: #8be3c4;
  --danger: #ffadbc;
  --glass: rgba(14, 36, 56, 0.78);
  --shadow: 0 20px 55px #0005;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  color: var(--text);
  font:
    14px/1.45 system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background: var(--bg);
  background-attachment: fixed;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  opacity: 0.53;
  cursor: default;
}
a {
  color: var(--primary);
}
button,
a,
input,
textarea,
select {
  touch-action: manipulation;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2,
h3,
.brand {
  letter-spacing: -0.035em;
}
svg {
  width: 20px;
  height: 20px;
  flex: none;
  vertical-align: middle;
}
fieldset {
  border: 0;
  padding: 0;
  margin: 0;
  min-width: 0;
}
legend {
  padding: 0;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.skip {
  position: fixed;
  top: 8px;
  left: 8px;
  transform: translateY(-150%);
  z-index: 50;
  padding: 10px;
  background: var(--raised);
}
.skip:focus {
  transform: none;
}
[hidden] {
  display: none !important;
}
.shell {
  width: min(1664px, 100%);
  margin: auto;
  min-height: 100vh;
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
}
.rail {
  padding: 20px 14px;
  position: sticky;
  top: 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 26px;
  border-right: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
  background: var(--glass);
  backdrop-filter: blur(24px) saturate(140%);
  z-index: 5;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 8px;
  color: var(--text);
  font-weight: 760;
  font-size: 25px;
}
.logo {
  width: 40px;
  height: 40px;
  display: inline-grid;
  place-items: center;
  border-radius: 13px;
  background: var(--primary);
  color: #fff;
  box-shadow:
    inset 0 1px 0 #fff8,
    0 3px 8px #133a5836;
}
.logo svg {
  width: 26px;
  height: 26px;
}
.rail-nav {
  display: grid;
  gap: 4px;
}
.nav-action {
  border: 0;
  background: transparent;
  text-align: left;
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 11px;
  border-radius: 12px;
  color: var(--muted);
  font-weight: 630;
}
.nav-action svg {
  width: 19px;
  height: 19px;
}
.nav-action:hover,
.nav-action[aria-current="page"] {
  background: color-mix(in srgb, var(--primary) 12%, transparent);
  color: var(--primary);
}
.nav-action .count {
  margin-left: auto;
}
.nav-label {
  font-size: 11px;
  font-weight: 730;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 11px 5px;
}
.rail-end {
  margin-top: auto;
  display: grid;
  gap: 5px;
}
.rail-foot {
  margin: 6px 11px 0;
  border-top: 1px solid var(--line);
  padding-top: 14px;
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 11px;
}
.status-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--good);
  flex: none;
}
.status-dot.offline {
  background: var(--accent);
}
.mobile-nav {
  display: none;
}
.workspace {
  min-width: 0;
}
.top {
  height: var(--head);
  position: sticky;
  top: 0;
  z-index: 4;
  padding: 0 clamp(20px, 2.55vw, 42px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  background: var(--glass);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
  backdrop-filter: blur(24px) saturate(150%);
}
.top-label {
  font-weight: 680;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
}
.top-label svg {
  width: 17px;
  height: 17px;
  color: var(--primary);
}
.top-actions,
.actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.actions.end {
  justify-content: flex-end;
}
.btn,
.icon-btn,
.segment button,
.chip-button {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 42px;
  padding: 0 12px;
  font-weight: 670;
  text-decoration: none;
  white-space: nowrap;
  transition:
    background 0.15s,
    border-color 0.15s,
    color 0.15s;
}
.btn:hover,
.icon-btn:hover,
.segment button:hover,
.chip-button:hover {
  background: var(--raised);
  border-color: var(--primary);
  color: var(--primary);
}
.btn.primary {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--bg);
}
.btn.primary:hover {
  background: color-mix(in srgb, var(--primary) 85%, var(--text));
  color: var(--bg);
}
.btn.ghost,
.icon-btn.ghost {
  background: transparent;
  border-color: transparent;
}
.btn.danger {
  color: var(--danger);
}
.btn svg {
  width: 17px;
  height: 17px;
}
.icon-btn {
  width: 42px;
  padding: 0;
}
.icon-btn svg {
  width: 19px;
  height: 19px;
}
.section {
  padding: clamp(23px, 2.6vw, 43px) clamp(20px, 2.55vw, 42px) 40px;
  max-width: 1500px;
  margin: auto;
}
.intro {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 16px;
  margin-bottom: 22px;
}
.intro h1 {
  font-size: clamp(30px, 3.1vw, 49px);
  font-weight: 735;
  line-height: 1.05;
  letter-spacing: -0.061em;
  margin: 4px 0 9px;
}
.eyebrow {
  color: var(--primary);
  font-weight: 760;
  font-size: 11px;
  letter-spacing: 0.105em;
  text-transform: uppercase;
}
.muted,
.intro p {
  color: var(--muted);
}
.muted {
  font-size: 13px;
}
.intro p {
  font-size: 14px;
}
.intro-actions {
  margin-bottom: 2px;
}
.card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  min-width: 0;
}
.panel {
  padding: 20px;
}
.panel h2 {
  font-size: 20px;
  font-weight: 730;
}
.panel h3 {
  font-size: 16px;
}
.split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(245px, 285px);
  gap: 18px;
  align-items: start;
}
.stack {
  display: grid;
  gap: 14px;
  min-width: 0;
}
.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
.section-title h2 {
  font-size: 21px;
}
.caption {
  font-size: 11px;
  font-weight: 760;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.badge,
.count {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 100px;
  color: var(--primary);
  background: color-mix(in srgb, var(--primary) 11%, var(--surface));
  padding: 4px 9px;
  font-weight: 690;
  font-size: 11px;
  line-height: 1.35;
}
.count {
  padding: 3px 7px;
}
.badge.warn {
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 13%, var(--surface));
}
.badge.good {
  color: var(--good);
  background: color-mix(in srgb, var(--good) 12%, var(--surface));
}
.badge.danger {
  color: var(--danger);
  background: color-mix(in srgb, var(--danger) 11%, var(--surface));
}
.notice {
  border: 1px solid var(--line);
  padding: 12px 14px;
  border-radius: 14px;
  background: var(--surface);
  color: var(--muted);
  overflow-wrap: anywhere;
}
.notice.warn {
  border-color: color-mix(in srgb, var(--accent) 42%, var(--line));
  color: var(--accent);
}
.notice.danger {
  color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 45%, var(--line));
}
.empty {
  padding: 30px 17px;
  text-align: center;
  color: var(--muted);
}
.empty svg {
  width: 27px;
  height: 27px;
  color: var(--primary);
  margin-bottom: 10px;
}
.empty strong {
  display: block;
  color: var(--text);
  margin-bottom: 3px;
}
.empty .btn {
  margin-top: 12px;
}
.calendar {
  overflow: hidden;
}
.cal-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  padding: 14px 15px;
  gap: 10px;
  border-bottom: 1px solid var(--line);
}
.cal-left {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}
.cal-left .icon-btn {
  width: 36px;
  min-height: 36px;
}
.cal-left .btn {
  min-height: 36px;
}
.cal-left strong {
  margin-left: 6px;
  letter-spacing: -0.025em;
}
.segment {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  background: color-mix(in srgb, var(--primary) 7%, var(--surface));
  border: 1px solid var(--line);
  border-radius: 12px;
  max-width: 100%;
}
.segment button {
  min-height: 33px;
  padding: 0 9px;
  border-color: transparent;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
}
.segment button[aria-pressed="true"] {
  color: var(--text);
  background: var(--raised);
  border-color: var(--line);
  box-shadow: 0 1px 3px #10283d17;
}
.week-head {
  display: grid;
  grid-template-columns: 53px repeat(7, minmax(0, 1fr));
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.week-head small {
  align-self: end;
  justify-self: center;
  font-size: 10px;
  margin: 0 0 8px;
  color: var(--muted);
}
.day-pick {
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 3px;
  min-height: 62px;
  border: 0;
  border-left: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 640;
}
.day-pick b {
  font-size: 17px;
  color: var(--text);
  line-height: 27px;
  min-width: 27px;
  border-radius: 100px;
  text-align: center;
}
.day-pick:hover,
.day-pick[aria-pressed="true"] {
  background: color-mix(in srgb, var(--primary) 8%, var(--surface));
}
.day-pick[aria-pressed="true"] b {
  background: var(--primary);
  color: var(--bg);
}
.week-grid {
  --slot: 48px;
  height: calc(var(--slots) * var(--slot));
  display: grid;
  grid-template-columns: 53px repeat(7, minmax(0, 1fr));
  position: relative;
}
.time-axis,
.day-lane {
  position: relative;
  min-width: 0;
  background: transparent;
}
.day-lane {
  border-left: 1px solid var(--line);
}
.day-lane.selected {
  background-color: color-mix(in srgb, var(--primary) 4%, var(--surface));
}
.hour {
  position: absolute;
  left: 0;
  right: 0;
  text-align: center;
  color: var(--muted);
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  padding-top: 3px;
}
.kind-fixed {
  --event: #376f9a;
}
.kind-task {
  --event: #387f70;
}
.kind-context {
  --event: #567993;
}
.kind-child {
  --event: #6e57a5;
}
.kind-trip {
  --event: #ae7020;
}
.kind-deadline {
  --event: #aa4c6a;
}
:root[data-mode="dark"] .kind-fixed {
  --event: #8ec9f1;
}
:root[data-mode="dark"] .kind-task {
  --event: #86d8be;
}
:root[data-mode="dark"] .kind-context {
  --event: #9ab3ca;
}
:root[data-mode="dark"] .kind-child {
  --event: #c5b2fa;
}
:root[data-mode="dark"] .kind-trip {
  --event: #f6bd75;
}
:root[data-mode="dark"] .kind-deadline {
  --event: #f3a4bc;
}
.block {
  position: absolute;
  left: 4px;
  right: 4px;
  top: calc(var(--top) * var(--slot));
  height: max(34px, calc(var(--len) * var(--slot) - 3px));
  padding: 4px 5px 4px 6px;
  text-align: left;
  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--event) 27%, var(--line));
  border-left: 3px solid var(--event);
  border-radius: 7px;
  background: color-mix(in srgb, var(--event) 13%, var(--surface));
  color: var(--text);
  line-height: 1.16;
  z-index: 1;
}
.block:hover,
.block:focus-visible {
  background: color-mix(in srgb, var(--event) 25%, var(--surface));
  z-index: 4;
}
.block strong {
  display: block;
  font-size: 11px;
  overflow-wrap: anywhere;
}
.block span {
  font-size: 9px;
  color: var(--muted);
  font-weight: 650;
  display: block;
  margin-bottom: 3px;
}
.block.context {
  background: color-mix(in srgb, var(--event) 5%, var(--surface));
  border-style: dashed;
  z-index: 0;
  right: 2px;
  left: 1px;
}
.block.child {
  left: 16px;
  z-index: 2;
}
.block.deadline {
  border-style: dashed;
  border-left-style: solid;
}
.block.is-done {
  opacity: 0.74;
}
.week-footer {
  padding: 10px 14px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  border-top: 1px solid var(--line);
  font-size: 10px;
  color: var(--muted);
}
.legend-mark {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.pip {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--event, var(--primary));
  display: inline-block;
  flex: none;
}
.mobile-agenda {
  display: none;
}
.agenda {
  padding: 8px 14px 14px;
  display: grid;
  gap: 0;
}
.agenda-row {
  width: 100%;
  display: grid;
  grid-template-columns: 57px 34px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  text-align: left;
  background: transparent;
  color: var(--text);
  border: 0;
  border-bottom: 1px solid var(--line);
  min-height: 61px;
  padding: 6px 4px;
  border-radius: 0;
}
.agenda-row:last-child {
  border-bottom-color: transparent;
}
.agenda-row:hover {
  background: color-mix(in srgb, var(--event) 8%, var(--surface));
  border-radius: 10px;
}
.agenda-row.child {
  padding-left: 17px;
}
.agenda-row .when {
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.event-icon {
  width: 33px;
  height: 33px;
  border-radius: 10px;
  display: inline-grid;
  place-items: center;
  color: var(--event, var(--primary));
  background: color-mix(
    in srgb,
    var(--event, var(--primary)) 13%,
    var(--surface)
  );
}
.event-icon svg {
  width: 17px;
  height: 17px;
}
.agenda-row strong,
.agenda-row small {
  display: block;
  overflow-wrap: anywhere;
}
.agenda-row small {
  color: var(--muted);
  font-size: 11px;
  margin-top: 2px;
}
.agenda-row > svg {
  width: 14px;
  color: var(--muted);
}
.day-group {
  padding: 10px 0 3px;
  font-weight: 740;
  font-size: 13px;
  border-bottom: 1px solid var(--line);
}
.month-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  padding: 8px;
  gap: 3px;
}
.month-header {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  padding: 6px 0;
}
.month-grid .day-pick {
  border: 1px solid var(--line);
  border-radius: 11px;
  min-height: 55px;
}
.month-grid .outside {
  opacity: 0.66;
}
.month-grid .dots {
  display: flex;
  gap: 3px;
}
.month-grid .pip {
  width: 5px;
  height: 5px;
}
.aside .panel {
  padding: 16px;
}
.aside .section-title {
  margin-bottom: 10px;
}
.aside h2 {
  font-size: 17px;
}
.journey {
  position: relative;
  overflow: hidden;
  background: var(--surface);
}
.journey-hit {
  width: 100%;
  display: block;
  text-align: left;
  border: 0;
  background: transparent;
  color: var(--text);
  padding: 0;
  border-radius: 11px;
}
.journey-hit:hover h3 {
  color: var(--primary);
}
.journey-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  gap: 6px;
}
.journey-top svg {
  width: 16px;
  color: var(--primary);
}
.big-time {
  font-size: 37px;
  font-weight: 725;
  letter-spacing: -0.085em;
  line-height: 1.03;
  font-variant-numeric: tabular-nums;
  margin: 5px 0;
  color: var(--text);
}
.journey h3 {
  font-size: 15px;
  margin: 3px 0;
}
.journey-meta {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  border-top: 1px solid var(--line);
  padding-top: 10px;
  margin-top: 11px;
  color: var(--muted);
  font-size: 11px;
}
.mini-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 42px;
  width: 100%;
  text-align: left;
  padding: 4px 0;
  border: 0;
  border-top: 1px solid var(--line);
  background: transparent;
  color: var(--text);
}
.mini-row:hover {
  color: var(--primary);
}
.mini-row:first-of-type {
  border-top: 0;
}
.mini-row span:nth-child(2) {
  flex: 1;
  font-weight: 630;
  overflow-wrap: anywhere;
}
.mini-row span:last-child {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}
.progress {
  height: 6px;
  border-radius: 10px;
  background: var(--line);
  overflow: hidden;
  margin-top: 8px;
}
.progress > i {
  display: block;
  height: 100%;
  background: var(--primary);
  border-radius: inherit;
}
.link-btn {
  border: 0;
  background: transparent;
  color: var(--primary);
  padding: 0;
  font-weight: 700;
  min-height: 35px;
  text-align: left;
}
.link-btn:hover {
  text-decoration: underline;
}
.callout {
  border-top: 1px solid var(--line);
  padding-top: 8px;
  margin-top: 8px;
}
.warn-icon {
  color: var(--accent);
}
.review-grid {
  display: grid;
  grid-template-columns: minmax(0, 250px) minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}
.review-list {
  padding: 11px;
}
.review-entry {
  border: 1px solid transparent;
  border-bottom-color: var(--line);
  border-radius: 12px;
  background: transparent;
  color: var(--text);
  width: 100%;
  text-align: left;
  padding: 10px;
  min-height: 58px;
  overflow-wrap: anywhere;
}
.review-entry strong,
.review-entry small {
  display: block;
}
.review-entry small {
  color: var(--muted);
  margin-top: 3px;
}
.review-entry[aria-pressed="true"],
.review-entry:hover {
  background: color-mix(in srgb, var(--primary) 8%, var(--surface));
  border-color: var(--line);
}
.review-detail {
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
  gap: 16px;
}
.evidence {
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: color-mix(in srgb, var(--primary) 5%, var(--surface));
  overflow-wrap: anywhere;
}
.evidence blockquote {
  margin: 10px 0;
  padding: 9px 11px;
  border-left: 2px solid var(--primary);
  color: var(--text);
  white-space: pre-wrap;
  max-height: 230px;
  overflow: auto;
}
.evidence img {
  display: block;
  width: 100%;
  max-height: 340px;
  object-fit: contain;
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-top: 9px;
  background: var(--raised);
}
.diff {
  margin: 9px 0;
  padding: 8px 0;
  border-top: 1px solid var(--line);
  display: grid;
  gap: 2px;
  font-size: 12px;
  overflow-wrap: anywhere;
}
.diff del {
  color: var(--danger);
}
.diff ins {
  color: var(--good);
  text-decoration: none;
}
.source-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: start;
  gap: 12px;
  border-top: 1px solid var(--line);
  padding: 13px 0;
}
.source-row:first-of-type {
  border-top: 0;
}
.source-row strong,
.source-row p {
  overflow-wrap: anywhere;
}
.source-row .actions {
  justify-content: end;
}
.source-row .btn {
  min-height: 36px;
}
.file-drop {
  border: 1px dashed var(--primary);
  border-radius: 16px;
  padding: 13px;
  background: color-mix(in srgb, var(--primary) 6%, var(--surface));
  display: grid;
  gap: 7px;
}
.file-drop.drag {
  background: color-mix(in srgb, var(--primary) 16%, var(--surface));
}
.file-drop input {
  width: 100%;
  max-width: 100%;
}
.divider {
  height: 1px;
  background: var(--line);
  margin: 2px 0;
}
dialog {
  position: fixed;
  border: 1px solid var(--line);
  border-radius: 25px;
  background: var(--surface);
  color: var(--text);
  padding: 0;
  width: min(570px, calc(100% - 24px));
  max-height: min(86dvh, 850px);
  box-shadow: 0 25px 90px #0a273f55;
}
dialog::backdrop {
  background: #102b465e;
  backdrop-filter: blur(5px);
}
.dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 18px 14px 22px;
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.dialog-head h2 {
  font-size: 23px;
}
.dialog-body {
  padding: 19px 22px 22px;
}
.form {
  display: grid;
  gap: 12px;
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.field {
  display: grid;
  gap: 4px;
  min-width: 0;
  font-weight: 665;
  font-size: 12px;
}
.field input:not([type="checkbox"]),
.field select,
.field textarea {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--raised);
  padding: 8px 10px;
  min-height: 42px;
  min-width: 0;
  width: 100%;
  font-size: 14px;
  font-weight: 475;
}
.field textarea {
  min-height: 76px;
  resize: vertical;
}
.field input[type="checkbox"] {
  margin: 0;
  accent-color: var(--primary);
  width: 18px;
  height: 18px;
}
.field.check {
  display: flex;
  align-items: center;
  min-height: 38px;
  gap: 7px;
}
.fieldset-title {
  font-size: 13px;
  font-weight: 710;
  margin-bottom: 6px;
}
.form .help {
  font-size: 12px;
  color: var(--muted);
}
.form .error {
  color: var(--danger);
  font-size: 13px;
}
.form .actions {
  margin-top: 4px;
}
.form .actions .btn {
  min-height: 44px;
}
.settings-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(260px, 315px);
  gap: 17px;
  align-items: start;
}
.setting {
  display: grid;
  gap: 9px;
  padding-bottom: 14px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.setting:last-child {
  margin: 0;
  padding: 0;
  border: 0;
}
.setting h3 {
  font-size: 15px;
}
.palettes {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(115px, 1fr));
  gap: 8px;
}
.palette {
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--raised);
  color: var(--text);
  min-height: 58px;
  text-align: left;
  padding: 8px 9px;
  font-weight: 660;
  font-size: 12px;
}
.palette:hover,
.palette[aria-pressed="true"] {
  border-color: var(--primary);
}
.palette[aria-pressed="true"] {
  box-shadow: inset 0 0 0 1px var(--primary);
  color: var(--primary);
}
.swatches {
  display: flex;
  gap: 4px;
  margin-bottom: 5px;
}
.swatches i {
  display: block;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  border: 1px solid #67708066;
}
.widget-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 235px), 1fr));
  gap: 15px;
}
.widget-host {
  border-radius: 19px;
  min-height: 228px;
  padding: 13px;
  display: grid;
  align-content: start;
  gap: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
}
.widget-host > span {
  font-size: 12px;
  color: var(--muted);
  font-weight: 700;
}
.widget {
  display: grid;
  gap: 5px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 12px;
  background: var(--glass);
  backdrop-filter: blur(20px);
  color: var(--text);
  min-height: 124px;
}
.widget:hover {
  border-color: var(--primary);
}
.widget.small {
  width: min(100%, 148px);
  min-height: 140px;
}
.widget.tinted {
  background: color-mix(in srgb, var(--primary) 21%, var(--surface));
}
.widget h3 {
  font-size: 19px;
}
.widget .big-time {
  font-size: 29px;
  margin: 0;
}
.widget strong {
  overflow-wrap: anywhere;
}
.widget .widget-brand {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--primary);
  font-weight: 800;
}
.widget-brand svg {
  width: 15px;
  height: 15px;
}
.toast {
  position: fixed;
  z-index: 20;
  right: 20px;
  bottom: 19px;
  padding: 9px 12px;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 15px;
  box-shadow: var(--shadow);
  display: flex;
  gap: 7px;
  align-items: center;
  max-width: min(calc(100% - 40px), 520px);
  font-size: 13px;
}
.toast svg {
  width: 17px;
  color: var(--good);
}
.toast .btn {
  min-height: 32px;
}
.toast .icon-btn {
  min-height: 32px;
  width: 32px;
  margin-left: auto;
}
.shortcut {
  color: var(--muted);
  font-size: 10px;
  border: 1px solid var(--line);
  padding: 0 4px;
  border-radius: 4px;
}
.rules {
  display: grid;
  gap: 3px;
  padding: 0 0 0 19px;
  margin: 5px 0;
  color: var(--muted);
}
@media (max-width: 1220px) {
  :root {
    --rail: 166px;
  }
  .split {
    grid-template-columns: minmax(0, 1fr) minmax(225px, 245px);
    gap: 13px;
  }
  .rail {
    padding-inline: 10px;
  }
  .section,
  .top {
    padding-inline: 23px;
  }
  .aside .panel {
    padding: 14px;
  }
  .cal-left strong {
    font-size: 12px;
  }
  .cal-tools {
    padding: 10px;
  }
  .week-head,
  .week-grid {
    grid-template-columns: 44px repeat(7, minmax(0, 1fr));
  }
}
@media (max-width: 1000px) {
  :root {
    --rail: 140px;
  }
  .split {
    grid-template-columns: minmax(0, 1fr);
  }
  .aside {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    align-items: start;
  }
  .rail-nav .nav-action {
    gap: 7px;
    padding-inline: 7px;
  }
  .section,
  .top {
    padding-inline: 18px;
  }
  .review-grid {
    grid-template-columns: minmax(0, 170px) minmax(0, 1fr);
  }
  .review-detail {
    grid-template-columns: 1fr;
  }
  .settings-layout {
    grid-template-columns: 1fr;
  }
}
@media (max-width: 720px) {
  :root {
    --head: 57px;
  }
  .shell {
    display: block;
  }
  .rail {
    display: none;
  }
  .mobile-nav {
    position: fixed;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    left: 8px;
    right: 8px;
    bottom: max(7px, env(safe-area-inset-bottom));
    z-index: 6;
    background: var(--glass);
    backdrop-filter: blur(23px) saturate(150%);
    border: 1px solid var(--line);
    border-radius: 19px;
    box-shadow: var(--shadow);
    padding: 2px;
  }
  .mobile-nav .nav-action {
    position: relative;
    display: grid;
    justify-items: center;
    align-content: center;
    gap: 1px;
    padding: 4px 1px;
    text-align: center;
    font-size: 10px;
    min-height: 51px;
  }
  .mobile-nav .count {
    position: absolute;
    top: 0;
    left: calc(50% + 6px);
    padding: 1px 5px;
  }
  .top {
    padding: 0 12px;
  }
  .top-actions {
    gap: 5px;
  }
  .top-actions .btn,
  .top-actions .icon-btn {
    min-height: 44px;
  }
  .top-label {
    gap: 6px;
    font-size: 12px;
  }
  .top-label .brand {
    margin: 0;
    font-size: 21px;
    gap: 5px;
  }
  .top-label .logo {
    width: 30px;
    height: 30px;
    border-radius: 9px;
  }
  .top-label .logo svg {
    width: 21px;
    height: 21px;
    color: #fff;
  }
  .top-label > span:not(.brand) {
    display: none;
  }
  .section {
    padding: 19px 11px 86px;
  }
  .intro {
    align-items: start;
    margin-bottom: 15px;
    gap: 7px;
  }
  .intro h1 {
    margin-bottom: 6px;
  }
  .intro p {
    font-size: 12px;
  }
  .intro-actions .btn {
    min-height: 44px;
    padding-inline: 8px;
    font-size: 12px;
  }
  .aside {
    grid-template-columns: 1fr;
  }
  .aside .panel {
    padding: 14px;
  }
  .cal-tools {
    padding: 8px;
    gap: 7px;
  }
  .cal-left {
    justify-content: space-between;
    width: 100%;
  }
  .cal-left strong {
    margin-left: auto;
    margin-right: 4px;
  }
  .cal-left .btn,
  .cal-left .icon-btn,
  .segment button {
    min-height: 44px;
  }
  .cal-left .icon-btn {
    width: 42px;
  }
  .segment {
    flex: 1;
  }
  .segment button {
    flex: 1;
  }
  .week-head {
    grid-template-columns: repeat(7, minmax(0, 1fr));
  }
  .week-head small,
  .week-grid {
    display: none;
  }
  .week-head .day-pick:first-of-type {
    border-left: 0;
  }
  .day-pick {
    min-height: 54px;
  }
  .mobile-agenda {
    display: grid;
  }
  .week-footer {
    gap: 7px;
  }
  .agenda {
    padding: 5px 9px 9px;
  }
  .agenda-row {
    grid-template-columns: 40px 29px minmax(0, 1fr) auto;
    gap: 7px;
  }
  .agenda-row .when {
    font-size: 10px;
  }
  .event-icon {
    width: 29px;
    height: 29px;
  }
  .review-grid,
  .review-detail {
    grid-template-columns: minmax(0, 1fr);
  }
  .review-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr));
    gap: 3px;
  }
  .panel {
    padding: 14px;
  }
  .source-row {
    grid-template-columns: auto minmax(0, 1fr);
  }
  .source-row .actions {
    grid-column: 2;
    justify-content: start;
  }
  .source-row .btn {
    min-height: 44px;
  }
  .toast {
    bottom: 74px;
    right: 10px;
    max-width: calc(100% - 20px);
  }
  .shortcut {
    display: none;
  }
}
.agenda.mobile-agenda {
  display: none;
}
.block {
  display: flex;
  align-items: flex-start;
  flex-direction: column;
  justify-content: flex-start;
  height: max(15px, calc(var(--len) * var(--slot) - 2px));
}
.block.compact:not(.deadline) {
  justify-content: center;
  padding-block: 0;
}
.block.compact:not(.deadline) > span {
  display: none;
}
.block.compact:not(.deadline) > strong {
  white-space: nowrap;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}
.block.deadline {
  min-height: 31px;
}
.block.context {
  padding-top: 4px;
}
.cal-range {
  border: 0;
  background: transparent;
  min-height: 36px;
  padding: 0 6px;
  border-radius: 10px;
  font-weight: 700;
  letter-spacing: -0.025em;
  text-transform: capitalize;
}
.cal-range:hover {
  color: var(--primary);
  background: color-mix(in srgb, var(--primary) 7%, transparent);
}
.mobile-glance,
.day-strip {
  display: none;
}
@media (max-width: 720px) {
  .agenda.mobile-agenda {
    display: grid;
  }
  .agenda.untimed {
    display: none;
  }
  .top-actions {
    flex-wrap: nowrap;
    gap: 4px;
  }
  .top-actions .icon-btn {
    width: 44px;
    flex: none;
  }
  .top-actions .btn {
    padding-inline: 9px;
    font-size: 12px;
  }
  .top-label .brand {
    margin: 0;
  }
  .cal-range {
    margin-left: auto;
    min-height: 44px;
  }
  .day-strip {
    display: grid;
  }
  .mobile-glance {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
    padding: 6px;
    margin-bottom: 12px;
  }
  .mobile-glance button {
    display: flex;
    align-items: center;
    gap: 7px;
    text-align: left;
    min-height: 48px;
    border: 1px solid transparent;
    background: transparent;
    border-radius: 10px;
    padding: 4px 6px;
    color: var(--text);
    min-width: 0;
  }
  .mobile-glance button:hover {
    border-color: var(--line);
    background: var(--raised);
  }
  .mobile-glance button span {
    min-width: 0;
  }
  .mobile-glance button strong {
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 12px;
  }
  .mobile-glance .caption {
    font-size: 9px;
  }
  .mobile-glance .event-icon {
    flex: none;
  }
}
@media (max-width: 365px) {
  .top-actions .btn {
    padding-inline: 7px;
    font-size: 11px;
  }
  .top-actions .icon-btn {
    width: 44px;
  }
  .section {
    padding-inline: 8px;
  }
  .intro h1 {
    font-size: 28px;
  }
  .intro-actions .btn {
    padding-inline: 6px;
  }
}
.appointment-queue {
  list-style: none;
  margin: 0;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 14px;
  max-height: 180px;
  overflow: auto;
}
.appointment-queue li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px 6px 12px;
  border-bottom: 1px solid var(--line);
}
.appointment-queue li:last-child { border-bottom: 0; }
.appointment-queue li > div { min-width: 0; flex: 1; }
.appointment-queue strong, .appointment-question h3 { overflow-wrap: anywhere; }
.appointment-queue .icon-btn { min-height: 44px; width: 44px; flex: none; }
.appointment-question {
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: color-mix(in srgb, var(--primary) 5%, var(--raised));
  display: grid;
  gap: 10px;
}
.appointment-question h3 { font-size: 20px; line-height: 1.2; }
.appointment-question .progress { margin: 0; }
.appointment-entry label textarea { min-height: 60px; }
.appointment-notes { white-space: pre-wrap; }
.appointment-entry .field.check, .appointment-question .field.check { min-height: 44px; }
.appointment-actions { justify-content: space-between; }
.appointment-actions .actions { margin: 0; }
.appointment-pending::after {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
@media (max-width: 480px) {
  .appointment-actions > .actions:last-child { flex: 1 0 auto; justify-content: flex-end; }
  .appointment-question { padding: 12px; }
}
@media (max-width: 720px) {
  .appointment-entry .field input:not([type="checkbox"]),
  .appointment-entry .field textarea,
  .appointment-question .field input:not([type="checkbox"]) {
    font-size: 16px;
    min-height: 44px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
@media (prefers-reduced-transparency: reduce) {
  :root,
  :root[data-mode="dark"] {
    --glass: var(--surface);
  }
}
:root[data-solid="true"] {
  --glass: var(--surface);
}
:root[data-solid="true"] body {
  background: var(--bg);
}
:root[data-solid="true"] dialog::backdrop {
  backdrop-filter: none;
}

/* Fri materials */
:root {
  --bg: #f1e3d4;
  --primary: #955251;
  --accent: #805449;
  --text: #2d211e;
  --muted: #6c524a;
  --surface: #f9eee5;
  --raised: #fff8f2;
  --line: #6e47333d;
  --good: #725349;
  --danger: #863e42;
  --glass: #fff8f0b5;
  --focus: #843d49;
  --rim: #fffcf2e6;
  --shade-rim: #93645955;
  --sheen: #fffdfa9c;
  --depth: #6c3f2a22;
  --shadow: 0 16px 34px -19px #5a352a41, 0 32px 70px -44px #7a493457;
  --soft-shadow: 0 20px 55px -26px #6f3a2e63;
  --surface-fill: color-mix(in srgb, var(--surface) 80%, transparent);
  --pane-fill: color-mix(in srgb, var(--surface) 68%, transparent);
  --chrome-fill: color-mix(in srgb, var(--raised) 72%, transparent);
  --rail-fill: color-mix(in srgb, var(--surface) 78%, transparent);
  --rim-shadow: inset 0 1px 0 var(--rim), inset 1px 0 0 var(--sheen), inset 0 -1px 0 var(--shade-rim);
  --glass-filter: blur(23px) saturate(138%);
  --scene-inset: clamp(15px, 1.67vw, 30px);
  --rail: clamp(176px, 14vw, 222px);
  --head: 68px;
  --radius: 25px;
}

:root[data-mode="dark"] {
  --bg: #2b201e;
  --primary: #efa6a0;
  --accent: #e6b8a5;
  --text: #fff0e8;
  --muted: #dbbfb5;
  --surface: #392825;
  --raised: #493330;
  --line: #f4c9b536;
  --good: #dec0ae;
  --danger: #ffb3af;
  --glass: #392725e6;
  --focus: #ffc5b9;
  --rim: #fbdac578;
  --shade-rim: #160d0ab8;
  --sheen: #f6c4ba32;
  --depth: #08050361;
  --shadow: 0 16px 38px -17px #140907a3, 0 27px 62px -33px #100a07b3;
  --soft-shadow: 0 20px 55px -26px #100807b3;
}

body {
  position: relative;
  isolation: isolate;
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: var(--bg);
}

.shell {
  width: min(1696px, 100%);
  grid-template-columns: var(--rail) minmax(0, 1fr);
  padding: var(--scene-inset);
  gap: clamp(14px, 1.45vw, 25px);
  align-items: start;
}

.rail, .top, .mobile-nav, dialog {
  border: 1px solid var(--shade-rim);
  border-top-color: var(--rim);
  background: var(--surface);
  box-shadow: var(--rim-shadow), var(--shadow);
}

@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .rail, .top, .mobile-nav, dialog, .widget {
    -webkit-backdrop-filter: var(--glass-filter);
    backdrop-filter: var(--glass-filter);
  }

  .rail {
    background: var(--rail-fill);
  }

  .top, .mobile-nav, dialog {
    background: var(--chrome-fill);
  }
}

.rail {
  top: var(--scene-inset);
  height: calc(100dvh - var(--scene-inset) * 2);
  min-height: 0;
  padding: 20px 13px 15px;
  border-radius: 29px;
  gap: 22px;
  overflow-y: auto;
}

.brand {
  color: var(--text);
  font: 720 27px/1.08 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  letter-spacing: -.075em;
}

.brand .logo {
  border: 1px solid #f4c8ab8f;
  border-bottom-color: #773d3ca8;
  border-radius: 14px;
  color: #fff9ee;
  background: var(--primary);
  box-shadow: inset 0 1px 1px #ffe8ce9c, inset 0 -2px 3px #5d29215e, 0 5px 12px -5px #6e312a99;
}

:root[data-mode="dark"] .brand .logo {
  color: #2d211e;
}

.nav-label {
  font-size: 10px;
  font-weight: 720;
  letter-spacing: .09em;
}

.rail .nav-action {
  min-height: 44px;
  border: 1px solid transparent;
  border-radius: 14px;
  font-weight: 630;
}

.rail .nav-action[aria-current="page"] {
  border-color: color-mix(in srgb, var(--primary) 23%, transparent);
  border-top-color: var(--rim);
  background: color-mix(in srgb, var(--primary) 14%, var(--surface));
  box-shadow: inset 0 1px 1px var(--rim), inset 0 -1px 0 var(--shade-rim), 0 4px 10px -8px var(--primary);
}

.rail-foot {
  margin-top: 10px;
}

.workspace {
  min-width: 0;
  width: 100%;
}

.top {
  top: var(--scene-inset);
  padding-inline: 19px;
  border-radius: 24px;
  gap: 8px;
}

.top-label {
  color: var(--text);
  font-weight: 690;
  letter-spacing: -.025em;
}

.top-actions {
  flex-wrap: nowrap;
  justify-content: end;
}

.section {
  width: 100%;
  max-width: none;
  margin: 0;
  padding: 24px 0 26px;
}

.intro {
  align-items: end;
  gap: 12px;
  margin: 4px 1px 20px;
}

.intro h1 {
  font-size: clamp(37px, 4.1vw, 68px);
  font-weight: 735;
  letter-spacing: -.073em;
}

.eyebrow, .caption, .section-kicker {
  letter-spacing: .085em;
  font-size: 10px;
  font-weight: 750;
}

.eyebrow {
  color: var(--primary);
}

.intro p {
  color: var(--muted);
}

.card {
  border: 1px solid var(--shade-rim);
  border-top-color: var(--rim);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--rim-shadow), var(--shadow);
}

@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .card {
    background: var(--surface-fill);
    -webkit-backdrop-filter: blur(14px) saturate(124%);
    backdrop-filter: blur(14px) saturate(124%);
  }
}

.btn, .icon-btn, .chip-button, .cal-range {
  border-radius: 14px;
  border-color: var(--shade-rim);
  border-top-color: var(--rim);
  background: var(--surface);
  box-shadow: inset 0 1px 0 var(--rim), 0 7px 12px -11px var(--primary);
  transition: color .16s, background-color .16s, border-color .16s, box-shadow .16s, transform .16s;
}

.btn:not(:disabled):active, .icon-btn:not(:disabled):active, .chip-button:active, .cal-range:active {
  transform: scale(.975);
}

.btn.primary {
  color: #fff9ee;
  border-color: color-mix(in srgb, var(--primary) 89%, #400d20);
  border-top-color: color-mix(in srgb, var(--primary) 69%, #fff5df);
  background: var(--primary);
  box-shadow: inset 0 1px 0 #ffecce56, inset 0 -1px 0 #6a283046, 0 8px 16px -9px var(--primary);
}

.btn.primary:hover {
  color: #fff9ee;
  background: color-mix(in srgb, var(--primary) 92%, #311c21);
}

:root[data-mode="dark"] .btn.primary, :root[data-mode="dark"] .btn.primary:hover {
  color: #321c1d;
}

.btn.ghost, .icon-btn.ghost {
  background: transparent;
  box-shadow: none;
}

.btn.ghost:hover, .icon-btn.ghost:hover {
  background: var(--pane-fill);
}

.btn.appointment-pending::after {
  background: currentColor;
}

.split {
  gap: 18px;
}

.calendar {
  overflow: hidden;
  border-radius: 27px;
}

.cal-tools {
  padding: 13px 15px;
  gap: 10px;
}

.cal-tools .cal-left .btn,
.cal-tools .cal-left .icon-btn,
.cal-range {
  min-height: 40px;
}

.cal-range {
  max-width: 100%;
  padding-inline: 10px;
}

.segment {
  padding: 4px;
  border-radius: 14px;
  border-color: var(--shade-rim);
  background: color-mix(in srgb, var(--primary) 9%, var(--surface));
  box-shadow: inset 0 1px 4px var(--depth);
}

.segment button {
  border-radius: 10px;
}

.segment button[aria-pressed="true"] {
  border-color: var(--shade-rim);
  border-top-color: var(--rim);
  background: var(--raised);
  box-shadow: var(--rim-shadow), 0 4px 8px -6px var(--primary);
}

.week-head,
.month-header {
  background: color-mix(in srgb, var(--surface) 67%, transparent);
}

.day-pick b {
  font-size: 18px;
  font-weight: 720;
  font-variant-numeric: tabular-nums;
}

.day-pick[aria-pressed="true"] b {
  background: var(--primary);
  color: #fff9ee;
  box-shadow: inset 0 1px 0 #ffffff44, 0 4px 9px -5px var(--primary);
}

:root[data-mode="dark"] .day-pick[aria-pressed="true"] b {
  color: #321c1d;
}

.day-lane.selected {
  background-color: color-mix(in srgb, var(--primary) 5%, transparent);
}

.block {
  border-radius: 10px;
  box-shadow: inset 0 1px 0 var(--sheen), 0 5px 8px -8px var(--event);
}

.kind-fixed { --event: var(--primary); }
.kind-task { --event: #76594e; }
.kind-context { --event: #70584b; }
.kind-child { --event: #805958; }
.kind-trip { --event: #805338; }
.kind-deadline { --event: var(--primary); }

:root[data-mode="dark"] .kind-fixed { --event: #efaba8; }
:root[data-mode="dark"] .kind-task { --event: #ddbcaa; }
:root[data-mode="dark"] .kind-context { --event: #d0b29f; }
:root[data-mode="dark"] .kind-child { --event: #e5b3af; }
:root[data-mode="dark"] .kind-trip { --event: #f0c08c; }
:root[data-mode="dark"] .kind-deadline { --event: #efa6a0; }

.agenda-row {
  min-height: 58px;
  margin-block: 3px;
  border-radius: 15px;
}

.agenda-row:hover {
  background: color-mix(in srgb, var(--event) 8%, var(--surface));
}

.agenda-row .when,
.big-time {
  font-variant-numeric: tabular-nums;
}

.event-icon {
  border: 1px solid color-mix(in srgb, var(--event, var(--primary)) 23%, transparent);
  border-top-color: var(--rim);
  border-radius: 11px;
  box-shadow: inset 0 1px 0 var(--sheen);
}

.aside {
  gap: 14px;
}

.aside .panel {
  padding: 17px;
}

.journey {
  background: var(--surface-fill);
}

.big-time {
  letter-spacing: -.075em;
  color: var(--primary);
  font-size: clamp(30px, 3.1vw, 50px);
  font-weight: 730;
}

.mini-row,
.review-entry,
.source-row,
.widget,
.palette,
.notice,
.evidence {
  border-radius: 14px;
}

.widget-host {
  border-color: var(--shade-rim);
  border-top-color: var(--rim);
  border-radius: 24px;
  background: color-mix(in srgb, var(--primary) 12%, var(--surface));
  box-shadow: var(--rim-shadow), var(--shadow);
}

.widget {
  border: 1px solid var(--shade-rim);
  border-top-color: var(--rim);
  border-radius: 23px;
  background: var(--glass);
  box-shadow: var(--rim-shadow), var(--soft-shadow);
}

dialog {
  border-radius: 29px;
  box-shadow: var(--rim-shadow), 0 28px 95px -20px #2d161856;
}

dialog::backdrop {
  background: #2c191c70;
  -webkit-backdrop-filter: blur(7px) saturate(83%);
  backdrop-filter: blur(7px) saturate(83%);
}

.dialog-head {
  background: color-mix(in srgb, var(--raised) 85%, var(--surface));
}

.field input:not([type="checkbox"]),
.field select,
.field textarea {
  border-radius: 12px;
  border-color: var(--shade-rim);
  box-shadow: inset 0 1px 2px var(--depth);
  background: var(--raised);
}

.toast {
  border: 1px solid var(--shade-rim);
  border-top-color: var(--rim);
  box-shadow: var(--rim-shadow), var(--soft-shadow);
}

@media (max-width: 1000px) {
  :root { --rail: 153px; }
  .rail { padding-inline: 9px; }
  .split { gap: 13px; }
}

@media (max-width: 720px) {
  :root { --scene-inset: 9px; --head: 58px; --radius: 21px; }
  .shell { display: block; padding: var(--scene-inset); }
  .rail { display: none; }
  .top { padding-inline: 8px; border-radius: 20px; }
  .top-label .brand { font-size: 22px; }
  .top-label .logo { width: 31px; height: 31px; border-radius: 10px; }
  .top-actions { gap: 4px; }
  .top-actions .btn { min-height: 44px; padding-inline: 8px; }
  .top-actions .icon-btn { width: 44px; min-height: 44px; }
  .section { padding: 18px 0 90px; }
  .intro { margin: 0 4px 15px; }
  .intro h1 { font-size: clamp(32px, 8vw, 52px); }
  .intro p { font-size: 12px; }
  .calendar { border-radius: 23px; }
  .cal-tools { padding: 7px; }
  .cal-tools .cal-left .btn,
  .cal-tools .cal-left .icon-btn,
  .cal-range,
  .segment button { min-height: 44px; }
  .aside .panel { padding: 15px; }
  .agenda-row { min-height: 53px; }
  .mobile-nav {
    left: 9px;
    right: 9px;
    border-radius: 21px;
    box-shadow: var(--rim-shadow), 0 10px 25px -12px #44211a70;
  }
  .mobile-nav .nav-action {
    margin: 0 1px;
    border-radius: 15px;
  }
  .mobile-nav .nav-action[aria-current="page"] {
    background: color-mix(in srgb, var(--primary) 14%, var(--surface));
    box-shadow: inset 0 1px 0 var(--rim), inset 0 -1px 0 var(--shade-rim);
  }
}

@media (max-width: 360px) {
  .top { padding-inline: 6px; }
  .top-actions { gap: 2px; }
  .top-actions .btn { padding-inline: 5px; }
}

@media (max-width: 349px) {
  .top { gap: 2px; }
  .top-label .brand { gap: 0; font-size: 0; }
  .top-actions .btn { gap: 3px; font-size: 11px; padding-inline: 3px; }
  .top-actions .btn svg { width: 14px; height: 14px; }
}

:root[data-solid="true"] .card,
:root[data-solid="true"] .rail,
:root[data-solid="true"] .top,
:root[data-solid="true"] .mobile-nav,
:root[data-solid="true"] dialog,
:root[data-solid="true"] .widget {
  background: var(--surface);
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}

@media (prefers-reduced-transparency: reduce) {
  .card, .rail, .top, .mobile-nav, dialog, .widget {
    background: var(--surface);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
}

/* Optional backdrop optics */
.ambient-scene {
  position: fixed;
  inset: 0;
  z-index: -2;
  overflow: hidden;
  isolation: isolate;
  pointer-events: none;
}

.optical-pane {
  position: absolute;
  z-index: 1;
  inset: -26% -4% 24% 46%;
  border-radius: 47%;
  transform: rotate(-23deg);
  background: transparent;
  -webkit-backdrop-filter: blur(6px) saturate(123%);
  backdrop-filter: blur(6px) saturate(123%);
}

@supports (backdrop-filter: url(#fri-glass-refract)) {
  .optical-pane {
    backdrop-filter: url(#fri-glass-refract) blur(3px) saturate(115%);
  }
}

/* The calendar's foreground glass */
.glass-surface {
  border: 1px solid var(--shade-rim);
  border-top-color: var(--rim);
  background: var(--surface);
  box-shadow: var(--rim-shadow), var(--shadow);
}

@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass-surface {
    background: var(--surface-fill);
    -webkit-backdrop-filter: blur(16px) saturate(129%);
    backdrop-filter: blur(16px) saturate(129%);
  }
}

.calendar-screen {
  display: grid;
  gap: 17px;
  min-width: 0;
}

.calendar-topline,
.calendar-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px 16px;
}

.calendar-screen[data-calendar-view="month"] .calendar-heading {
  max-width: 730px;
}

.calendar-screen[data-calendar-view="year"] .calendar-heading {
  max-width: 788px;
}

.calendar-topline {
  padding: 0 2px;
}

.calendar-crumbs,
.calendar-nav {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.calendar-crumbs {
  color: var(--muted);
  font-size: 12px;
  font-weight: 630;
}

.calendar-crumbs svg {
  width: 13px;
  height: 13px;
}

.calendar-crumbs :is(button, a) {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 0;
  border-radius: 10px;
  min-height: 36px;
  background: transparent;
  color: var(--muted);
  padding: 0 3px;
  font-weight: inherit;
  text-decoration: none;
}

.calendar-crumbs :is(button, a):hover {
  color: var(--primary);
}

.calendar-crumbs [aria-current] {
  color: var(--text);
  font-weight: 730;
}

.calendar-topline > .segment {
  background: var(--pane-fill);
}

.calendar-topline > .segment button {
  min-width: clamp(49px, 5vw, 73px);
  min-height: 34px;
}

.calendar-heading {
  padding: 4px 2px 8px;
  align-items: end;
}

.calendar-title {
  min-width: 0;
}

.calendar-title h1,
h1.calendar-title {
  color: var(--text);
  font-size: clamp(40px, 5.3vw, 83px);
  font-weight: 740;
  letter-spacing: -.087em;
  line-height: .97;
  text-wrap: balance;
}

.calendar-title h1 {
  margin-block: 8px 10px;
}

.calendar-kicker {
  color: var(--primary);
  font-size: 10px;
  font-weight: 780;
  text-transform: uppercase;
  letter-spacing: .155em;
}

.calendar-subtitle {
  color: var(--muted);
  font-size: 14px;
  font-weight: 540;
}

.calendar-nav {
  justify-content: flex-end;
  flex-wrap: wrap;
  padding-bottom: 2px;
}

.calendar-nav .icon-btn,
.calendar-nav .btn {
  min-height: 44px;
  border-radius: 15px;
}

.day-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(252px, 325px);
  gap: clamp(17px, 2vw, 30px);
  align-items: start;
  min-width: 0;
}

.day-feed,
.day-sidebar,
.activity-list {
  display: grid;
  align-content: start;
  gap: 11px;
  min-width: 0;
}

.activity-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 14px;
  padding: 0 3px 2px;
}

.activity-header h2 {
  color: var(--text);
  font-size: 23px;
  line-height: 1.12;
  letter-spacing: -.045em;
}

.activity-header h2 span {
  display: inline-grid;
  min-width: 25px;
  height: 25px;
  margin-left: 4px;
  place-items: center;
  border: 1px solid var(--shade-rim);
  border-top-color: var(--rim);
  border-radius: 20px;
  background: var(--surface-fill);
  color: var(--primary);
  vertical-align: 3px;
  font-size: 11px;
  font-weight: 760;
  letter-spacing: 0;
}

.activity-header p,
.activity-header small {
  color: var(--muted);
  font-size: 12px;
}

.activity-post {
  --post-color: var(--event, var(--primary));
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  position: relative;
  gap: 0;
  padding: 0;
  min-width: 0;
  border-radius: 21px;
  background: var(--surface-fill);
  box-shadow: inset 0 1px 0 var(--rim), inset 0 -1px 0 var(--shade-rim), 0 12px 22px -18px var(--post-color);
  transition: border-color .2s, box-shadow .2s, transform .23s;
}

.activity-post::before {
  content: "";
  position: absolute;
  inset: 15px auto 15px 0;
  width: 3px;
  border-radius: 0 8px 8px 0;
  background: color-mix(in srgb, var(--post-color) 58%, transparent);
  box-shadow: 3px 0 9px -2px var(--post-color);
  pointer-events: none;
}

.activity-post:hover,
.activity-post:focus-within {
  border-color: color-mix(in srgb, var(--post-color) 49%, var(--rim));
  box-shadow: inset 0 1px 0 var(--rim), inset 0 -1px 0 var(--shade-rim), 0 18px 30px -22px var(--post-color);
}

.activity-post.kind-child {
  margin-left: clamp(8px, 2vw, 28px);
  border-style: dashed;
}

.activity-open {
  display: grid;
  grid-template-columns: clamp(61px, 9vw, 111px) minmax(0, 1fr);
  justify-items: start;
  align-items: center;
  gap: 12px;
  min-width: 0;
  min-height: 86px;
  padding: 12px 11px 12px 17px;
  border: 0;
  border-radius: inherit;
  background: transparent;
  color: var(--text);
  text-align: left;
}

.activity-time {
  display: grid;
  gap: 2px;
  color: var(--text);
  line-height: 1.16;
  font-variant-numeric: tabular-nums;
  align-self: center;
}

.activity-time strong {
  font-size: clamp(16px, 1.65vw, 24px);
  font-weight: 730;
  letter-spacing: -.07em;
}

.activity-time small {
  color: var(--muted);
  font-size: 11px;
  font-weight: 540;
}

.activity-copy {
  min-width: 0;
  overflow-wrap: anywhere;
}

.activity-kind {
  display: flex;
  align-items: center;
  gap: 3px;
  margin-bottom: 3px;
  color: var(--post-color);
  font-size: 10px;
  font-weight: 775;
  letter-spacing: .067em;
  text-transform: uppercase;
}

.activity-meta {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

.activity-title {
  display: block;
  font-size: clamp(15px, 1.43vw, 21px);
  font-weight: 720;
  line-height: 1.19;
  margin-block: 1px;
  letter-spacing: -.04em;
}

.activity-copy svg {
  width: 13px;
  height: 13px;
}

.activity-tick,
.day-complete {
  position: relative;
  display: inline-grid;
  place-items: center;
  width: 44px;
  height: 44px;
  flex: 0 0 auto;
  padding: 0;
  border: 1px solid var(--shade-rim);
  border-top-color: var(--rim);
  border-radius: 50%;
  background: var(--surface);
  color: var(--muted);
  box-shadow: var(--rim-shadow), 0 7px 12px -10px var(--post-color, var(--primary));
  transition: background-color .18s, color .18s, transform .18s;
}

.activity-tick {
  margin: 7px 12px 7px 0;
}

.activity-tick:hover,
.day-complete:hover {
  color: var(--primary);
  transform: translateY(-1px);
}

.activity-tick:is([aria-checked="true"], [aria-pressed="true"]),
.day-complete:is([aria-checked="true"], [aria-pressed="true"]) {
  color: var(--good);
  background: color-mix(in srgb, var(--good) 19%, var(--raised));
}

.activity-tick svg,
.day-complete svg {
  width: 18px;
  height: 18px;
}

.day-sidebar {
  gap: 13px;
}

.day-progress {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: clamp(12px, 2vw, 20px);
  min-width: 0;
  min-height: 116px;
  padding: 17px;
  border-radius: 24px;
}

.day-progress h2,
.day-progress h3 {
  font-size: clamp(17px, 1.55vw, 23px);
}

.day-progress p,
.day-progress small {
  color: var(--muted);
  font-size: 12px;
}

.day-ring {
  position: relative;
  width: clamp(76px, 7.9vw, 106px);
  aspect-ratio: 1;
  padding: 7px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--surface-fill);
  box-shadow: inset 0 1px 1px var(--rim), 0 8px 22px -17px var(--primary);
}

.day-ring-meter {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
}

.day-ring-meter svg {
  display: block;
  width: 100%;
  height: 100%;
}

.day-ring-track,
.day-ring-value {
  fill: none;
  stroke-width: 6px;
}

.day-ring-track {

    for (const other of items) {
      if (other.id === item.id) continue;
      const blocking = takesAttention(other) || (other.kind === 'context' && !sameLocation(item, other));
      if (!blocking) continue;
      const range = interval(other);
      if (range) free = subtract(free, range);
    }
    return {free, dayStart, capacity: free.reduce((sum, window) => sum + window.end - window.start, 0), minutes};
  }

  function issuesForDay(items, date) {
    const active = items.filter(item => isDayItem(item, date));
    const conflicts = [];
    const seen = new Set();
    for (const item of active) {
      if (!interval(item) || item.kind === 'context') continue;
      const check = previewPlacement(item, active);
      if (check.ok) continue;
      const ids = check.itemIds || [item.id];
      const key = [...ids].sort().join('|');
      if (seen.has(key)) continue;
      seen.add(key);
      const title = check.code === 'travel' ? 'Travel conflict' :
        check.code === 'parent' ? 'Check nested activity' :
          check.code === 'location' ? 'Location conflict' : 'Calendar conflict';
      conflicts.push({...check, title, itemIds: ids});
    }
    return conflicts;
  }

  function plan(items, date, options = {}) {
    const baseRevision = options.revision ?? options.baseRevision ?? null;
    const working = [...items];
    const conflicts = issuesForDay(working, date);
    const pending = working.filter(item => item.kind === 'task' && !item.done && !item.locked &&
      item.date === date && (!options.targetId || options.targetId === item.id) &&
      (!interval(item) || options.reschedule === true) && Number.isInteger(item.effort) && item.effort > 0)
      .map(item => ({item, slack: placementWindows(item, working, date, options).capacity - item.effort}))
      .sort((a,b) => a.slack - b.slack || (deadlineAt(a.item,date) ?? Infinity) - (deadlineAt(b.item,date) ?? Infinity) ||
        (b.item.priority ?? 0) - (a.item.priority ?? 0) || a.item.id.localeCompare(b.item.id));
    const placements = [];
    const shortages = [];
    for (const {item} of pending) {
      const {free, dayStart, capacity, minutes} = placementWindows(item, working, date, options);
      const oldRange = interval(item);
      const retained = oldRange && free.some(window => window.start <= oldRange.start && window.end >= oldRange.end);
      if (retained) continue;
      const fit = free.find(window => window.end - window.start >= minutes);
      if (fit) {
        const start = fit.start - dayStart;
        const placement = {...item, start, end: start + minutes, endDate: date, generated: true, reason: 'This open slot fits the duration and location.'};
        if (previewPlacement(placement, working).ok) {
          placements.push(placement);
          working[working.findIndex(entry => entry.id === item.id)] = placement;
          continue;
        }
      }
      const amount = capacity < minutes ? minutes - capacity : null;
      shortages.push({
        code: amount === null ? 'no-contiguous-time' : 'capacity',
        title: item.title,
        message: amount === null
          ? 'There are ' + capacity + ' minutes free, but no single block of ' + minutes + ' minutes.'
          : 'At least ' + amount + ' more minutes are needed in eligible slots on this day.',
        minutes: amount,
        capacity,
        itemIds: [item.id]
      });
    }
    const constraints = {start: options.start, end: options.end};
    for (const field of ['availability', 'breaks']) {
      if (options[field]) constraints[field] = options[field].map(window => ({start: window.start, end: window.end}));
    }
    return {baseRevision, date, placements, conflicts, shortages, constraints};
  }

  function commitPlan(state, proposal) {
    if (!proposal || proposal.baseRevision !== state.revision) {
      return {ok: false, state, code: 'stale', message: 'The calendar changed. Preview the plan again.'};
    }
    const items = [...state.items];
    const applied = new Set();
    for (const proposed of proposal.placements) {
      const index = items.findIndex(item => item.id === proposed.id && item.kind === 'task' && !item.locked && !item.done);
      const original = items[index];
      const date = proposal.date;
      const placement = original && {...original, start: proposed.start, end: proposed.end, endDate: date, generated: true,
        reason: 'This open slot fits the duration and location.'};
      const range = placement && interval(placement);
      const validTime = range && original.date === date && range.end - range.start === original.effort &&
        placementWindows(original, items, date, proposal.constraints || {}).free
          .some(window => window.start <= range.start && window.end >= range.end);
      if (!validTime || applied.has(original.id) || !previewPlacement(placement, items).ok) {
        return {ok: false, state, code: 'invalid', message: 'The proposed time is no longer available.'};
      }
      items[index] = placement;
      applied.add(original.id);
    }
    const revision = state.revision + Number(proposal.placements.length > 0);
    return {ok: true, state: {...state, items, revision}, items, revision};
  }

  function snapshot(items, date, revision, now = 420) {
    const day = items.filter(item => isDayItem(item, date));
    const progressItems = [...new Map(day.filter(item => ['fixed','child','task','deadline'].includes(item.kind) &&
      !item.transparent && item.tracked !== false && (interval(item) || item.kind === 'deadline'))
      .map(item => [item.id, item])).values()];
    const sortByTime = (a,b) => (a.start ?? DAY) - (b.start ?? DAY) || String(a.id).localeCompare(String(b.id));
    const milestones = progressItems.filter(item => !item.done && (item.end ?? item.start ?? DAY) >= now).sort(sortByTime);
    const trips = day.filter(item => item.kind === 'trip').map(travelBlock).filter(Boolean).sort(sortByTime);
    const trip = trips.find(item => absoluteMinute(item.leaveDate, item.leaveAt) >= absoluteMinute(date, now)) || null;
    const reminders = trips.map(item => ({
      id: 'leave-' + item.id, itemId: item.id, date: item.leaveDate, minute: item.leaveAt,
      revision, label: 'Time to leave', enabled: false, status: 'preview'
    }));
    return {
      date, revision, timezone: DEMO_ZONE, next: milestones[0] || null, trip,
      completed: progressItems.filter(item => item.done).length,
      total: progressItems.length, milestones: milestones.slice(0, 3), reminders
    };
  }

  const diffFields = ['title','kind','date','endDate','start','end','location','timezone','allDay','transparent','canceled'];

  function candidateDiff(original, incoming) {
    return diffFields.flatMap(field => {
      const before = original?.[field] ?? null;
      const after = incoming?.[field] ?? null;
      return Object.is(before, after) ? [] : [{field, before, after}];
    });
  }

  function demoBatch() {
    return [
      {kind: 'image', name: 'lab-team-chat.png', fixture: true, text: 'Lab team meeting tomorrow at 7 at Room B2'},
      {kind: 'image', name: 'storyboard-portal.png', fixture: true, text: 'Submit storyboard draft | 2026-11-25 | 17:00 | LMS'},
      {kind: 'link', name: 'Workshop calendar · ICS', fixture: true, url: 'https://demo.fri.example/lich-thuc-hanh.ics', text:
        'BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nUID:fri-workshop-2026\nSUMMARY:Review the prototype with the team\nDTSTART;TZID=Asia/Ho_Chi_Minh:20261123T113000\nDTEND;TZID=Asia/Ho_Chi_Minh:20261123T120000\nLOCATION:Room B2\nEND:VEVENT\nEND:VCALENDAR'},
      {kind: 'link', name: 'Student portal calendar', fixture: true, fail: true, url: 'https://demo.fri.example/lich-can-dang-nhap'}
    ];
  }

  function demoState() {
    const monday = DEMO_DATE;
    const day = (offset, fields) => ({date: addDays(monday, offset), location: '', ...fields});
    const items = [
      day(0, {id:'notes', title:'Prepare robotics materials', kind:'task', start:390, end:410, effort:20, done:true}),
      day(0, {id:'review', title:'Review team notes', kind:'task', start:410, end:420, effort:10, done:true}),
      day(0, {id:'school-trip', title:'Head to campus', kind:'trip', start:435, end:470, arriveBy:470, appointmentAt:480, duration:30, buffer:5, origin:'Home', destination:'Campus', location:'Home → Campus'}),
      day(0, {id:'campus', title:'On campus', kind:'context', start:470, end:720, location:'Campus'}),
      day(0, {id:'robotics', title:'Robotics', kind:'fixed', start:480, end:630, location:'Room B2 · Campus', site:'Campus'}),
      day(0, {id:'robotics-report', title:'Class report', kind:'child', start:570, end:600, parentId:'robotics', location:'Room B2 · Campus', site:'Campus', tracked:false}),
      day(0, {id:'slides', title:'Work on Demo Day slides', kind:'task', start:840, end:900, effort:60, deadline:1020, location:'', reason:'A 60-minute focus block before the deadline.'}),
      day(0, {id:'storyboard', title:'Submit storyboard draft', kind:'deadline', start:1020, end:null, location:'LMS'}),
      day(0, {id:'prototype-review', title:'Write the prototype report', kind:'task', start:null, end:null, effort:60, deadline:1020, location:'Campus'}),
      day(1, {id:'ux-research', title:'UX Research class', kind:'fixed', start:540, end:630, location:'Room A.305'}),
      day(1, {id:'interview', title:'User interview', kind:'fixed', start:660, end:705, location:'Online'}),
      day(2, {id:'syllabus', title:'Read the syllabus', kind:'task', start:570, end:630, effort:60}),
      day(3, {id:'club', title:'Club meeting', kind:'fixed', start:840, end:900, location:'Common room'}),
      day(4, {id:'demo-day', title:'Demo Day', kind:'fixed', start:870, end:930, location:'Auditorium A'})
    ];
    const demoNotes = {
      notes:'Gather your robotics kit, the wiring diagram and the notes from the last session.',
      review:'Read the team’s feedback and bring one open question to class.',
      'school-trip':'Leave home at 07:15. There are 30 minutes for travel and a 5-minute buffer before you need to be on campus.',
      campus:'You’ll be on campus until noon. Fri can fit tasks into free time around class.',
      robotics:'Bring the prototype and test the sensor calibration in Room B2.',
      'robotics-report':'Share the test results and record the next iteration during the Robotics session.',
      slides:'Rework the opening and add the latest prototype screenshots before the 17:00 deadline.',
      storyboard:'Upload the storyboard draft to the course portal by 17:00.',
      'prototype-review':'Write the summary and list the next experiments. Set aside one uninterrupted hour on campus.',
      'ux-research':'Bring the interview guide and check your questions with the group before going into the field.',
      interview:'Join the call a few minutes early. Capture quotes and follow-up questions in the shared notes.',
      syllabus:'Review the assessment dates and add anything you need to plan for.',
      club:'Bring a short update for the committee and confirm next week’s meeting time.',
      'demo-day':'Arrive early enough to connect the laptop and run through the demo once.'
    };
    for (const item of items) item.notes = demoNotes[item.id];
    return {items, sources:[], candidates:[], revision:1};
  }

  function appointmentQuestions(rows) {
    return rows.flatMap(row => {
      const ask = (field, reason) => ({rowId: row.id, field, reason});
      const questions = [];
      const start = parseTime(row.start);
      const end = parseTime(row.end);
      if (!row.title?.trim()) questions.push(ask('title'));
      if (!calendarDate(row.date)) questions.push(ask('date'));
      else if (row.overnight && !calendarDate(addDays(row.date,1))) questions.push(ask('date','overnight-range'));
      if (start == null) questions.push(ask('start'));
      if (end == null) questions.push(ask('end'));
      else if (start != null && end <= start && !row.overnight) questions.push(ask('end','order'));
      return questions;
    });
  }

  function appointmentItem(row) {
    if (appointmentQuestions([row]).length) return null;
    const item = {
      id: row.id, kind: 'fixed', title: row.title.trim(), date: row.date,
      endDate: row.overnight ? addDays(row.date,1) : row.date, timezone: DEMO_ZONE,
      start: parseTime(row.start), end: parseTime(row.end),
      location: (row.location || '').trim(), notes: (row.notes || '').trim()
    };
    return calendarDate(item.endDate) && validateItem(item).ok ? item : null;
  }

  return {
    DEMO_DATE, DEMO_ZONE, calendarDate, addDays, startOfWeek, dateLabel, formatTime, parseTime,
    hash, normalizeUrl, parseIcs, parseJsonLd, parseSourceText, demoBatch, demoState,
    isDayItem, overlaps, travelBlock, validateItem, previewPlacement, plan, commitPlan, snapshot, candidateDiff,
    appointmentQuestions, appointmentItem
  };
})();
