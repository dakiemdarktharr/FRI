  }).sort((a,b) => (a.start ?? -1) - (b.start ?? -1) || (a.kind === 'context' ? -1 : 0) - (b.kind === 'context' ? -1 : 0));
}

const dayHeading = new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric',timeZone:'UTC'});
const monthHeading = new Intl.DateTimeFormat('en-US',{month:'long',timeZone:'UTC'});
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const expandedWidgets = new Set();
const completionKinds = new Set(['fixed','task','child','deadline']);
const hoverCard = document.querySelector('#fri-hover');
let hoverTarget = null;
let hoverTimer;
let pointer = {x:0,y:0,at:0,vx:0,vy:0};

function calendarItems(date) {
  return sortedItems(date).sort((a,b) => (a.start ?? 1441) - (b.start ?? 1441) || Number(a.done) - Number(b.done));
}

function canComplete(item) {
  return completionKinds.has(item.kind) && !item.transparent;
}

function dayStats(date) {
  const tasks = state.items.filter(item => canComplete(item) && D.isDayItem(item,date));
  const completed = tasks.filter(item => item.done).length;
  const total = tasks.length;
  const signature = tasks.map(item => item.id).sort().join('|');
  const ready = total > 0 && completed === total;
  return {completed,total,signature,ready,finished:ready && state.completedDays?.[date] === signature};
}

function reconcileDayMarks() {
  for (const date of Object.keys(state.completedDays || {})) {
    if (!dayStats(date).finished) delete state.completedDays[date];
  }
}

function completeDay(date) {
  const stats = dayStats(date);
  if (!stats.ready) return;
  state.completedDays ??= {};
  if (stats.finished) delete state.completedDays[date];
  else state.completedDays[date] = stats.signature;
  persist({bump:true});
  render({keepFocus:true});
  announce(stats.finished ? 'Day reopened.' : 'Day marked complete.');
}

function tickActivity(itemId) {
  const item = state.items.find(entry => entry.id === itemId);
  if (!item || !canComplete(item)) return;
  item.done = !item.done;
  persist({bump:true});
  render({keepFocus:true});
  announce(item.done ? `${item.title} marked complete.` : `${item.title} reopened.`);
}

function activityClock(item) {
  if (!Number.isFinite(item.start)) return [item.kind === 'task' ? 'Anytime' : 'All day',''];
  const display = time(item.start);
  if (item.kind === 'deadline') return [display,'Due'];
  if (item.kind === 'trip') return [display,'Leave'];
  if (!Number.isFinite(item.end) || item.end === item.start) return [display,''];
  return [display,`to ${time(item.end)}`];
}

function activityMetadata(item) {
  const parent = item.parentId ? state.items.find(entry => entry.id === item.parentId) : null;
  return [item.location,parent ? `Inside ${parent.title}` : '',item.kind === 'task' && !Number.isFinite(item.start) ? `${item.effort} min to schedule` : '',item.locked ? 'Locked' : ''].filter(Boolean).join(' · ');
}

function activityPost(item) {
  const [label,glyph] = kinds[item.kind] || kinds.fixed;
  const [start,end] = activityClock(item);
  const metadata = activityMetadata(item);
  const tick = canComplete(item) ? `<button type="button" class="activity-tick" role="checkbox" aria-checked="${Boolean(item.done)}" aria-label="Complete ${e(item.title)}" data-action="activity-tick" data-id="${e(item.id)}">${icon('check')}</button>` : '';
  return `<article class="activity-post glass-surface kind-${e(item.kind)}${item.done ? ' is-complete' : ''}" data-hover-kind="activity" data-id="${e(item.id)}">
    <button class="activity-open" type="button" data-action="activity-open" data-id="${e(item.id)}" aria-label="${e(item.title)}">
      <span class="activity-time"><strong>${e(start)}</strong>${end ? `<small>${e(end)}</small>` : ''}</span>
      <span class="activity-copy"><span class="activity-kind">${icon(glyph)}${e(label)}</span><span class="activity-title" role="heading" aria-level="3">${e(item.title)}</span>${metadata ? `<span class="activity-meta">${e(metadata)}</span>` : ''}</span>
    </button>${tick}
  </article>`;
}

function dayProgress(date) {
  const {completed,total,ready,finished} = dayStats(date);
  const label = finished ? 'Day complete' : 'Day progress';
  const description = total ? `${completed} of ${total} complete` : 'No activities to complete';
  const announcement = finished ? 'Day marked complete.' : ready ? 'All activities are done. You can mark the day complete.' : 'Complete each activity to unlock the day check.';
  const percent = total ? 100*completed/total : 0;
  const ring = `<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><circle class="day-ring-track" cx="50" cy="50" r="46"/><circle class="day-ring-value" cx="50" cy="50" r="46" pathLength="100" stroke-dasharray="${percent} 100" transform="rotate(-90 50 50)"${percent ? '' : ' hidden'}/></svg>`;
  return `<section class="day-progress glass-surface${finished ? ' is-finished' : ''}" aria-label="Day completion"><div class="day-progress-copy"><h2>${label}</h2><p>${description}</p></div>
    <div class="day-ring"><div class="day-ring-meter" role="progressbar" aria-label="Day progress" aria-valuemin="0" aria-valuemax="${Math.max(total,1)}" aria-valuenow="${completed}" aria-valuetext="${e(description)}">${ring}</div><button class="day-complete" type="button" data-action="day-complete" data-id="${date}" aria-label="${finished ? 'Reopen day' : 'Complete day'}" aria-pressed="${finished}" aria-describedby="day-unlock" ${ready ? '' : 'disabled'}>${icon('check')}</button></div><span class="sr" id="day-unlock">${announcement}</span>
  </section>`;
}

function upcomingActivities(date) {
  const now = state.demo && date === D.DEMO_DATE ? 420 : !state.demo && date === realDate() ? D.parseTime(clockFormat.format(new Date())) : 0;
  return calendarItems(date).filter(item => !item.done && item.kind !== 'context' && Number.isFinite(item.start) && (item.end ?? item.start) >= now);
}

function squareWidget(date, key) {
  const {completed,total} = dayStats(date);
  const upcoming = upcomingActivities(date);
  const next = upcoming[0];
  const expanded = expandedWidgets.has(key);
  const name = expanded ? 'Hide upcoming activities' : 'Show upcoming activities';
  const deckId = `widget-deck-${key}`;
  return `<div class="widget-unit${expanded ? ' expanded' : ''}">
    <div class="fri-widget glass-surface${state.prefs.tint ? ' tinted' : ''}"><button type="button" class="widget-face" data-action="widget-toggle" data-id="${key}" aria-label="${name}" aria-expanded="${expanded}" aria-controls="${deckId}">
      <span class="widget-progress"><span class="widget-caption">${icon('fri')} Daily progress</span><span class="widget-count"><strong>${completed}</strong><span> / ${total} complete</span></span><span class="widget-meter" aria-hidden="true"><i style="width:${total ? 100*completed/total : 0}%"></i></span></span>
      <span class="widget-next"><span class="widget-caption">Up next</span><strong>${e(next?.title || 'Nothing on the schedule')}</strong>${next ? `<small>${next.kind === 'trip' ? 'Leave at ' : ''}${e(time(next.start))}</small>` : ''}</span>
      <span class="widget-disclosure">${expanded ? 'Close stack' : 'See upcoming'} ${icon(expanded ? 'close' : 'layers')}</span>
    </button></div>
    <div class="widget-deck" id="${deckId}"${expanded ? '' : ' hidden'} aria-label="Upcoming activities">${expanded ? upcoming.length ? upcoming.map((item,index) => `<button type="button" class="widget-stack-row glass-surface kind-${e(item.kind)}" data-action="widget-item" data-id="${e(item.id)}" style="--stagger:${Math.min(index,8)*52}ms"><i class="event-icon">${icon((kinds[item.kind] || kinds.fixed)[1])}</i><span><strong>${e(item.title)}</strong><small>${e(timeRange(item))}</small></span>${icon('right')}</button>`).join('') : '<p class="widget-stack-row glass-surface">Nothing else is scheduled.</p>' : ''}</div>
  </div>`;
}

function dailyCalendar(date) {
  const items = calendarItems(date);
  const report = D.plan(state.items,date);
  const issues = [...report.conflicts,...report.shortages];
  const trip = upcomingActivities(date).find(item => item.kind === 'trip');
  const planButton = button('Plan tasks','plan',{icon:'spark'});
  const travelQuick = trip ? `<button type="button" class="day-travel-callout glass-surface" data-action="item" data-id="${e(trip.id)}"><i class="event-icon kind-trip">${icon('route')}</i><span><small>Departure</small><strong>${e(time(trip.start))} · ${e(trip.destination || trip.title)}</strong></span>${icon('right')}</button>` : '';
  return `<div class="day-layout">
    <section class="day-feed" aria-labelledby="activity-title"><header class="activity-header"><h2 id="activity-title">Activities <span>${items.length}</span></h2>${planButton}</header>${travelQuick}<div class="activity-list">${items.length ? items.map(activityPost).join('') : `<div class="card glass-surface">${empty('Nothing planned for this day','',button('Add appointment','appointment',{icon:'plus',id:date}))}</div>`}</div></section>
    <aside class="day-sidebar" aria-label="Daily overview">${dayProgress(date)}${squareWidget(date,'daily')}${issues.length ? `<button class="day-notice glass-surface" type="button" data-action="plan">${icon('warning')}<span><strong>${issues.length} scheduling ${issues.length === 1 ? 'issue' : 'issues'}</strong><small>${e(issues[0].message)}</small></span>${icon('right')}</button>` : ''}</aside>
  </div>`;
}

function monthCell(date, currentMonth, index, origin) {
  const items = calendarItems(date);
  const selected = date === selectedDate;
  const flagged = dayStats(date).finished;
  const offset = Math.round(Math.hypot(index % 7 - origin % 7, Math.floor(index / 7) - Math.floor(origin / 7)) * 24);
  const markers = items.slice(0,3).map(item => `<i class="tile-marker kind-${e(item.kind)}"></i>`).join('');
  return `<button type="button" class="month-tile${date.slice(0,7) === currentMonth ? '' : ' tile-offmonth'}${selected ? ' tile-selected' : ''}" data-action="open-day" data-id="${date}" data-hover-kind="date" data-bobble data-stagger style="--stagger:${offset}ms" aria-label="${e(`${fullDay(date)}, ${items.length} ${items.length === 1 ? 'activity' : 'activities'}`)}" ${selected ? 'aria-current="date"' : ''}>
    <span class="tile-number">${Number(date.slice(8,10))}</span>${flagged ? `<span class="tile-complete" aria-hidden="true">${icon('check')}</span>` : ''}<span class="tile-markers" aria-hidden="true">${markers}</span>${items.length ? `<small class="tile-count">${items.length} ${items.length === 1 ? 'activity' : 'activities'}</small>` : ''}
  </button>`;
}

function monthDates(month) {
  const first = `${month}-01`;
  const start = D.startOfWeek(first);
  const dates = Array.from({length:42},(_, index) => D.addDays(start,index));
  return dates.slice(0,Math.ceil((dates.findLastIndex(date => date?.slice(0,7) === month) + 1) / 7) * 7);
}

function monthCalendar(date) {
  const month = date.slice(0,7);
  const dates = monthDates(month);
  const origin = Math.max(0,dates.indexOf(date));
  return `<section class="calendar-month glass-surface" aria-label="Month calendar"><div class="month-weekdays" aria-hidden="true">${weekdays.map(label => `<span>${label}</span>`).join('')}</div><div class="month-tiles">${dates.map((entry,index) => monthCell(entry,month,index,origin)).join('')}</div></section>`;
}

function yearCalendar(date) {
  const year = date.slice(0,4);
  const origin = Number(date.slice(5,7))-1;
  return `<section class="year-tiles" aria-label="Year calendar">${Array.from({length:12},(_,index) => {
    const month = `${year}-${String(index+1).padStart(2,'0')}`;
    const label = monthHeading.format(new Date(`${month}-01`));
    const offset = Math.round(Math.hypot(index%4-origin%4,Math.floor(index/4)-Math.floor(origin/4))*50);
    const dates = monthDates(month);
    const active = dates.some(day => day.slice(0,7) === month && state.items.some(item => D.isDayItem(item,day)));
    const cells = dates.map(day => {
      if (day.slice(0,7) !== month) return '<i class="mini-date empty"></i>';
      const busy = active && state.items.some(item => D.isDayItem(item,day));
      return `<i class="mini-date${busy ? ' busy' : ''}${day === selectedDate ? ' chosen' : ''}">${Number(day.slice(8,10))}</i>`;
    }).join('');
    return `<button class="year-tile glass-surface${index === origin ? ' year-selected' : ''}" type="button" data-action="open-month" data-id="${month}" data-stagger style="--stagger:${offset}ms" aria-label="${e(`${label} ${year}`)}"><span class="year-month-name">${e(label)}</span><span class="mini-calendar" aria-hidden="true">${cells}</span></button>`;
  }).join('')}</section>`;
}

function calendarPage() {
  const date = new Date(selectedDate);
  const month = monthHeading.format(date);
  const isDay = calendarView === 'day';
  const isMonth = calendarView === 'month';
  const heading = isDay ? dayHeading.format(date) : isMonth ? monthFormat.format(date) : selectedDate.slice(0,4);
  const caption = isDay ? weekdayFormat.format(date) : isMonth ? 'Month overview' : 'Year overview';
  const trail = `<button type="button" data-action="view" data-id="year">${selectedDate.slice(0,4)}</button>${isDay || isMonth ? `${icon('right')}<button type="button" data-action="view" data-id="month">${e(month)}</button>` : ''}${isDay ? `${icon('right')}<span>${Number(selectedDate.slice(8,10))}</span>` : ''}`;
  const modes = Object.entries(views).map(([key,label]) => `<button type="button" data-action="view" data-id="${key}" aria-pressed="${key === calendarView}">${label}</button>`).join('');
  const unit = isDay ? 'day' : isMonth ? 'month' : 'year';
  return `<div class="calendar-screen" data-calendar-view="${calendarView}"><div class="calendar-topline"><nav class="calendar-crumbs" aria-label="Calendar breadcrumb">${trail}</nav><div class="segment" role="group" aria-label="Calendar view">${modes}</div></div>
    <header class="calendar-heading"><div class="calendar-title"><p class="calendar-kicker">${e(caption)}</p><h1>${e(heading)}</h1>${isDay ? '<p class="calendar-subtitle">Vietnam time · GMT+7</p>' : ''}</div><div class="calendar-nav">${button(`Previous ${unit}`,'shift',{id:'-1',icon:'left',iconOnly:true})}${button('Today','today')}${button(`Next ${unit}`,'shift',{id:'1',icon:'right',iconOnly:true})}${button('Jump to date','date-jump',{icon:'calendar',iconOnly:true})}</div></header>
    ${isDay ? dailyCalendar(selectedDate) : isMonth ? monthCalendar(selectedDate) : yearCalendar(selectedDate)}
  </div>`;
}

function shiftDate(amount) {
  if (calendarView === 'day') return D.addDays(selectedDate,amount);
  const cursor = new Date(`${selectedDate}T00:00:00Z`);
  const day = cursor.getUTCDate();
  cursor.setUTCDate(1);
  cursor.setUTCMonth(cursor.getUTCMonth() + amount * (calendarView === 'year' ? 12 : 1));
  const next = new Date(cursor);
  next.setUTCMonth(next.getUTCMonth()+1,0);
  cursor.setUTCDate(Math.min(day,next.getUTCDate()));
  return cursor.toISOString().slice(0,10);
}

function openCalendarLevel(view, date, {focus = false} = {}) {
  if (!Object.hasOwn(views,view)) return;
  calendarView = view;
  if (validDate(date)) selectedDate = date;
  if (page === 'today' && view !== 'day') {
    page = 'calendar';
    history.replaceState(null,'','#calendar');
  }
  hideHoverCard();
  persist();
  render({keepFocus:!focus});
  if (focus) {
    const selector = view === 'month' ? `.month-tile[data-id="${selectedDate}"]` : '.calendar-heading h1';
    const target = main.querySelector(selector);
    target?.setAttribute('tabindex',target.matches('button') ? '0' : '-1');
    target?.focus({preventScroll:true});
  }
}

function widgetsPage() {
  const snapshot = snapshotForDate(selectedDate);
  const relevant = snapshot.trip || snapshot.next;
  const lock = state.prefs.private ? (snapshot.trip ? `Leave at ${time(snapshot.trip.leaveAt)}` : 'View your day in Fri') : (snapshot.trip ? `${time(snapshot.trip.leaveAt)} · ${snapshot.trip.destination || snapshot.trip.title}` : snapshot.next?.title || 'Nothing scheduled');
  const reminder = state.prefs.reminders && snapshot.reminders.length ? `First departure reminder preview · ${time(snapshot.reminders[0].minute)}` : state.prefs.reminders ? 'No departure reminders.' : 'Departure reminder preview is off.';
  return `${intro('Preview','Widgets','The square widget reads from the same calendar as your day.',button('Settings','page',{id:'settings',icon:'settings'}))}<div class="card glass-surface panel stack widget-settings"><div class="section-title"><h2>${e(readableDate(selectedDate))}</h2></div><div class="actions">${button('Previous day','widget-date',{id:'-1',icon:'left',iconOnly:true})}${button('Next day','widget-date',{id:'1',icon:'right',iconOnly:true})}${prefCheck('System tint','tint')}${prefCheck('Hide details on the lock screen','private')}</div><div class="widget-showcase"><div><p class="caption">Home and desktop</p>${squareWidget(selectedDate,'preview')}</div><section class="widget-lock glass-surface" aria-label="Lock screen preview"><p class="caption">Lock screen</p>${relevant ? `<button type="button" class="widget-lock-link" data-action="widget-item" data-id="${e(relevant.id)}">${icon('lock')}<strong>${e(lock)}</strong>${icon('right')}</button>` : `<p>${e(lock)}</p>`}</section></div><p class="muted">${e(reminder)}</p></div>`;
}

function openActivityDetail(itemId,node) {
  const from = node.closest('.activity-post')?.getBoundingClientRect();
  hideHoverCard();
  openItem(itemId);
  if (!from || !drawer.open || reducedMotion.matches || !drawer.animate) return;
  const to = drawer.getBoundingClientRect();
  drawer.animate([
    {transformOrigin:'top left',transform:`translate(${from.left-to.left}px,${from.top-to.top}px) scale(${from.width/to.width},${from.height/to.height})`,opacity:.65},
    {transformOrigin:'top left',transform:'translate(0,0) scale(1)',opacity:1}
  ],{duration:280,easing:'cubic-bezier(.21,.74,.21,1)'});
}

function compactActivityDetails(item) {
  const body = item.notes || item.reason || activityMetadata(item);
  const [label,glyph] = kinds[item.kind] || kinds.fixed;
  const duration = timeRange(item);
  return `<div class="hover-kicker">${icon(glyph)} ${e(label)}</div><h3>${e(item.title)}</h3><p class="hover-time">${e(duration)}</p>${body ? `<p class="hover-description">${e(body)}</p>` : ''}`;
}

function compactDayDetails(date) {
  const items = calendarItems(date);
  const limit = Math.max(4,Math.floor((innerHeight-155)/38));
  const rows = items.slice(0,limit).map(item => `<div class="hover-event kind-${e(item.kind)}"><i class="pip"></i><span>${e(item.title)}</span><small>${e(activityClock(item)[0])}</small></div>`).join('');
  return `<div class="hover-kicker">${icon('calendar')} ${e(weekdayFormat.format(new Date(date)))}</div><h3>${e(dayHeading.format(new Date(date)))}</h3>${rows ? `<div class="hover-events">${rows}</div>` : '<p class="hover-description">Nothing scheduled.</p>'}${items.length > limit ? `<p class="hover-more">${items.length-limit} more in this day</p>` : ''}`;
}

function positionHoverCard(target, point) {
  if (!target || hoverCard.hidden) return;
  const bounds = target.getBoundingClientRect();
  const width = hoverCard.offsetWidth;
  const height = hoverCard.offsetHeight;
  const x = point?.x ?? bounds.right;
  const y = point?.y ?? bounds.top;
  const left = Math.max(10,Math.min(innerWidth-width-10,x+18));
  const top = Math.max(10,Math.min(innerHeight-height-10,y+18));
  const tilt = target.dataset.hoverKind === 'date' && point && !reducedMotion.matches ? Math.max(-3,Math.min(3,point.vx*.08)) : 0;
  hoverCard.style.transform = `translate3d(${left}px,${top}px,0) skewX(${tilt}deg)`;
}

function hideHoverCard() {
  clearTimeout(hoverTimer);
  hoverTarget?.removeAttribute('aria-describedby');
  hoverTarget?.querySelector('.activity-open')?.removeAttribute('aria-describedby');
  hoverTarget = null;
  hoverCard.hidden = true;
}

function showHoverAfter(target, follow) {
  hideHoverCard();
  hoverTarget = target;
  hoverTimer = setTimeout(() => {
    if (hoverTarget !== target || !target.isConnected || drawer.open) return;
    const {hoverKind,id:itemId} = target.dataset;
    const item = hoverKind === 'activity' && state.items.find(entry => entry.id === itemId);
    if (hoverKind === 'activity' && !item) return;
    hoverCard.innerHTML = item ? compactActivityDetails(visibleItem(item)) : compactDayDetails(itemId);
    hoverCard.hidden = false;
    positionHoverCard(target,follow ? pointer : null);
    (target.matches('button') ? target : target.querySelector('.activity-open')).setAttribute('aria-describedby','fri-hover');
  },target.dataset.hoverKind === 'date' ? 500 : 300);
}

function bobbleTile(tile) {
  if (!tile.animate || reducedMotion.matches) return;
  const speed = Math.min(1,Math.hypot(pointer.vx,pointer.vy)/65);
  const nudge = 3 + speed*7;
  const turn = Math.max(-3,Math.min(3,pointer.vx*.06));
  tile.getAnimations().filter(animation => animation.id === 'tile-bobble').forEach(animation => animation.cancel());
  const animation = tile.animate([
    {translate:'0 0',rotate:'0deg',scale:'1'},
    {translate:`0 ${-nudge}px`,rotate:`${turn}deg`,scale:`${1.03 + speed*.04} ${1.03+speed*.02}`,offset:.33},
    {translate:'0 1px',rotate:`${-turn*.44}deg`,scale:'.992',offset:.66},
    {translate:'0 -1px',rotate:'0deg',scale:'1.006',offset:.83},
    {translate:'0 0',rotate:'0deg',scale:'1'}
  ],{duration:370,easing:'cubic-bezier(.25,.65,.32,1)'});
  animation.id = 'tile-bobble';
}

function bindCalendarMotion() {
  main.addEventListener('pointermove', event => {
    if (event.pointerType === 'touch') return;
    const elapsed = Math.max(8,event.timeStamp-pointer.at);
    pointer = {x:event.clientX,y:event.clientY,at:event.timeStamp,vx:15*(event.clientX-pointer.x)/elapsed,vy:15*(event.clientY-pointer.y)/elapsed};
    if (hoverTarget?.dataset.hoverKind === 'date') positionHoverCard(hoverTarget,pointer);
  });
  main.addEventListener('pointerover', event => {
    const target = event.target.closest('[data-hover-kind]');
    if (!target || target.contains(event.relatedTarget) || event.pointerType === 'touch') return;
    if (performance.now()-pointer.at > 180) pointer = {...pointer,vx:0,vy:0};
    pointer = {...pointer,x:event.clientX,y:event.clientY};
    if (target.hasAttribute('data-bobble')) bobbleTile(target);
    showHoverAfter(target,true);
  });
  main.addEventListener('pointerout', event => {
    if (hoverTarget?.contains(event.target) && !hoverTarget.contains(event.relatedTarget)) hideHoverCard();
  });
  main.addEventListener('focusin', event => {
    if (!event.target.matches('button[data-hover-kind],.activity-open') || !event.target.matches(':focus-visible')) return;
    showHoverAfter(event.target.closest('[data-hover-kind]'),false);
  });
  main.addEventListener('focusout', event => {
    if (hoverTarget?.contains(event.target) && !hoverTarget.contains(event.relatedTarget)) hideHoverCard();
  });
  window.addEventListener('scroll',() => {
    if (!hoverTarget) return;
    if (hoverTarget.contains(document.activeElement) && document.activeElement.matches(':focus-visible')) {
      positionHoverCard(hoverTarget,null);
    } else if (hoverTarget.contains(document.elementFromPoint(pointer.x,pointer.y))) {
      positionHoverCard(hoverTarget,pointer);
    } else hideHoverCard();
  },{passive:true});
  window.addEventListener('resize',hideHoverCard,{passive:true});
}

function moveMonthFocus(event) {
  if (drawer.open || !event.target.matches('.month-tile')) return;
  const deltas = {ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7};
  if (!Object.hasOwn(deltas,event.key)) return;
  event.preventDefault();
  const date = D.addDays(event.target.dataset.id,deltas[event.key]);
  const target = main.querySelector(`.month-tile[data-id="${date}"]`);
  if (target) target.focus();
  else openCalendarLevel('month',date,{focus:true});
}

const option = (value,label,selected) => `<option value="${e(value)}"${value === selected ? ' selected' : ''}>${e(label)}</option>`;
const input = (name,value = '',attributes = '') => `<input name="${e(name)}" value="${e(value)}" ${attributes}>`;

function readAppointmentBatch() {
  try {
    const batch = JSON.parse(localStorage.getItem(APPOINTMENT_KEY));
    if (batch?.version === 1 && batch.id && Array.isArray(batch.rows) && batch.current?.id && ['entry','review'].includes(batch.phase)) return batch;
  } catch {
    // A previously unavailable store can still be used for this session's input.
  }
  return null;
}

function blankAppointment() {
  return {id:id(),title:'',date:'',start:'',end:'',location:'',notes:'',overnight:false};
}

function hasAppointmentValues(row) {
  return Boolean(row && (row.title || row.date || row.start || row.end || row.location || row.notes || row.overnight));
}

function hasAppointmentDraft() {
  return Boolean(appointmentBatch?.rows.length || hasAppointmentValues(appointmentBatch?.current));
}

function writeAppointmentDraft() {
  try {
    if (hasAppointmentDraft()) localStorage.setItem(APPOINTMENT_KEY,JSON.stringify(appointmentBatch));
    else localStorage.removeItem(APPOINTMENT_KEY);
    appointmentStorageError = false;
    return true;
  } catch {
    appointmentStorageError = true;
    return false;
  }
}

function appointmentSaveStatus(form) {
  const storageHint = form.querySelector('[data-appointment-storage]');
  storageHint.hidden = writeAppointmentDraft();
}

function appointmentEntryValues(form) {
  const values = Object.fromEntries(new FormData(form));
  return {...appointmentBatch.current,...values,overnight:values.overnight === 'on'};
}

function updateAppointmentDraft(event) {
  const form = event.target.form;
  if (!appointmentBatch || !form) return;
  if (form.id === 'appointment-entry-form') {
    const hadDraft = hasAppointmentDraft();
    appointmentBatch.current = appointmentEntryValues(form);
    if (hadDraft !== hasAppointmentDraft()) form.querySelector('[data-appointment-secondary]').innerHTML = appointmentSecondary();
  } else if (form.id === 'appointment-review-form') {
    appointmentBatch.answer = {...Object.fromEntries(new FormData(form)),rowId:form.dataset.rowId,field:form.dataset.field};
  } else return;
  if (event.target.getAttribute('aria-invalid') === 'true') {
    event.target.removeAttribute('aria-invalid');
    form.querySelector('[data-error]').hidden = true;
  }
  appointmentSaveStatus(form);
}

function appointmentQueue(rows) {
  if (!rows.length) return '';
  return `<p class="caption">Appointments · ${rows.length}</p><ul class="appointment-queue" aria-label="Draft appointments">${rows.map(row => {
    const missing = D.appointmentQuestions([row]).length;
    return `<li><div><strong>${e(row.title)}</strong><p class="muted">${row.date ? e(dateShort(row.date)) + ' · ' : ''}${missing ? `${missing} details to complete` : `${e(row.start)}–${e(row.end)}${row.overnight ? ' (+1 day)' : ''}`}</p></div>${button(`Edit ${row.title}`,'appointment-edit',{id:row.id,icon:'text',iconOnly:true,kind:'ghost'})}${button(`Remove ${row.title}`,'appointment-remove',{id:row.id,icon:'close',iconOnly:true,kind:'ghost'})}</li>`;
  }).join('')}</ul>`;
}

const appointmentLabels = {title:'Appointment name',date:'Date',start:'Start time',end:'End time'};
const appointmentTypes = {title:'text',date:'date',start:'time',end:'time'};
const appointmentPrompts = {title:'What’s the appointment called?',date:'What day is it?',start:'What time does it start?',end:'What time does it end?'};
const appointmentStorageHint = () => `<p class="error" data-appointment-storage role="status"${appointmentStorageError ? '' : ' hidden'}>The browser couldn’t save your draft. Keep this tab open.</p>`;

function appointmentInput(fieldName,value,attributes = '') {
  const detail = fieldName === 'title' ? ' maxlength="160" placeholder="e.g. Team meeting"' : '';
  return field(appointmentLabels[fieldName],input(fieldName,value,`type="${appointmentTypes[fieldName]}"${detail} ${attributes}`));
}

function appointmentOvernight(checked) {
  return `<label class="field check"><input type="checkbox" name="overnight"${checked ? ' checked' : ''}>Ends the next day</label>`;
}

function appointmentSecondary() {
  return hasAppointmentDraft() ? button('Discard draft','appointment-discard',{kind:'ghost'}) : button('Create another item','item-new',{kind:'ghost'});
}

function openAppointmentEntry() {
  const {current,rows} = appointmentBatch;
  const editing = rows.some(row => row.id === current.id);
  openDialog('Add appointment',`<form class="form appointment-entry" id="appointment-entry-form" novalidate>
    <p class="muted">Choose <strong>Done</strong> to fill in any missing details. All times use Vietnam time.</p>
    ${appointmentInput('title',current.title,'required autofocus')}
    ${appointmentInput('date',current.date)}
    <div class="form-grid">${appointmentInput('start',current.start)}${appointmentInput('end',current.end)}</div>
    ${appointmentOvernight(current.overnight)}
    ${field('Location (optional)',input('location',current.location,'maxlength="160"'))}
    ${field('Notes (optional)',`<textarea name="notes" maxlength="1500">${e(current.notes)}</textarea>`)}
    ${appointmentQueue(rows)}
    <p class="error" data-error role="alert" hidden></p>${appointmentStorageHint()}
    <div class="actions appointment-actions"><div class="actions" data-appointment-secondary>${appointmentSecondary()}</div><div class="actions"><button class="btn" type="submit" value="next">${editing ? 'Save and add another' : 'New appointment'}</button><button class="btn primary" type="submit" value="done">Done</button></div></div>
  </form>`);
}

function openAppointment(date) {
  reconcileAppointmentDraft();
  if (!appointmentBatch) {
    const current = blankAppointment();
    if (validDate(date)) current.date = date;
    appointmentBatch = {version:1,id:id(),rows:[],current,phase:'entry',answered:0,answer:null};
  }
  if (appointmentBatch.phase === 'review') return openAppointmentQuestion();
  openAppointmentEntry();
}

function upsertAppointment(row) {
  const index = appointmentBatch.rows.findIndex(candidate => candidate.id === row.id);
  if (index < 0) appointmentBatch.rows.push(row);
  else appointmentBatch.rows[index] = row;
}

function stageAppointment(form, allowBlank) {
  const row = appointmentEntryValues(form);
  if (!allowBlank || hasAppointmentValues(row)) {
    if (!row.title.trim()) {
      showFormError(form,'Enter an appointment name to continue.');
      form.elements.title.setAttribute('aria-invalid','true');
      form.elements.title.focus();
      return false;
    }
    upsertAppointment({...row,title:row.title.trim()});
  }
  appointmentBatch.current = blankAppointment();
  return true;
}

function submitAppointmentEntry(form, done) {
  if (!stageAppointment(form,done && appointmentBatch.rows.length > 0)) return;
  if (!done) {
    writeAppointmentDraft();
    openAppointmentEntry();
    announce(`Draft saved. Enter the next appointment.`);
    return;
  }
  appointmentBatch.phase = 'review';
  appointmentBatch.answered = 0;
  writeAppointmentDraft();
  if (D.appointmentQuestions(appointmentBatch.rows).length) openAppointmentQuestion();
  else commitAppointments();
}

function editAppointmentDraft(rowId) {
  const form = dialogBody.querySelector('#appointment-entry-form');
  if (!form || !stageAppointment(form,true)) return;
  const row = appointmentBatch.rows.find(candidate => candidate.id === rowId);
  if (!row) return;
  appointmentBatch.current = {...row};
  writeAppointmentDraft();
  openAppointmentEntry();
}

function removeAppointmentDraftRow(rowId) {
  appointmentBatch.rows = appointmentBatch.rows.filter(row => row.id !== rowId);
  if (appointmentBatch.current.id === rowId) appointmentBatch.current = blankAppointment();
  if (appointmentBatch.answer?.rowId === rowId) appointmentBatch.answer = null;
  writeAppointmentDraft();
  openAppointmentEntry();
  announce('Draft appointment removed.');
}

function openAppointmentQuestion() {
  const {rows,answered,answer} = appointmentBatch;
  const questions = D.appointmentQuestions(rows);
  if (!questions.length) return openAppointmentRetry();
  const question = questions[0];
  const row = rows.find(candidate => candidate.id === question.rowId);
  const fieldName = question.field;
  const draftAnswer = answer?.rowId === row.id && answer.field === fieldName ? answer : null;
  const total = answered + questions.length;
  const stage = `Question ${answered + 1}/${total}`;
  const help = question.reason === 'order' ? 'Choose a later end time, or mark the appointment as ending the next day.' : question.reason === 'overnight-range' ? 'Choose a date that allows the appointment to end the next day.' : appointmentPrompts[fieldName];
  const context = [fieldName !== 'date' && row.date ? dateShort(row.date) : null,fieldName === 'end' && row.start ? `Starts at ${row.start}` : null].filter(Boolean).join(' · ');
  openDialog('Complete appointment details',`<form class="form" id="appointment-review-form" data-row-id="${e(row.id)}" data-field="${fieldName}" novalidate>
    <div class="appointment-question"><div class="section-title" style="margin:0"><span class="caption">${stage}</span><span class="muted">${rows.length} draft appointments</span></div>
    <div class="progress" role="progressbar" aria-label="Appointment details progress" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${answered}"><i style="width:${100 * answered / total}%"></i></div>
    <h3>${e(row.title || 'Untitled appointment')}</h3>${context ? `<p class="caption">${e(context)}</p>` : ''}<p class="muted" id="appointment-question-help">${e(help)}</p>
    ${appointmentInput(fieldName,draftAnswer?.[fieldName] ?? row[fieldName],'required autofocus aria-describedby="appointment-question-help"')}
    ${fieldName === 'end' ? appointmentOvernight(draftAnswer ? draftAnswer.overnight === 'on' : row.overnight) : ''}
    <p class="error" data-error role="alert" hidden></p>${appointmentStorageHint()}</div>
    <div class="actions appointment-actions">${button('Back to appointments','appointment-back')}<button class="btn primary" type="submit">Continue</button></div>
  </form>`);
  announce(`${stage}. ${row.title}. ${help}`);
}

function answerAppointmentQuestion(form) {
  const {rowId,field:fieldName} = form.dataset;
  const row = appointmentBatch.rows.find(candidate => candidate.id === rowId);
  const question = D.appointmentQuestions(appointmentBatch.rows)[0];
  if (!row || question?.rowId !== rowId || question.field !== fieldName) return openAppointment();
  const values = new FormData(form);
  const updated = {...row,[fieldName]:String(values.get(fieldName) ?? '').trim()};
  if (fieldName === 'end') updated.overnight = values.has('overnight');
  const issue = D.appointmentQuestions([updated]).find(candidate => candidate.field === fieldName);
  if (issue) {
    showFormError(form,issue.reason === 'order' ? 'The end time must be after the start time.' : `Enter a valid ${appointmentLabels[fieldName].toLocaleLowerCase('en-GB')}.`);
    form.elements[fieldName].setAttribute('aria-invalid','true');
    form.elements[fieldName].focus();
    return;
  }
  upsertAppointment(updated);
  appointmentBatch.answered += 1;
  appointmentBatch.answer = null;
  writeAppointmentDraft();
  if (D.appointmentQuestions(appointmentBatch.rows).length) openAppointmentQuestion();
  else commitAppointments();
}

function openAppointmentRetry(message = 'Your appointments are ready to add to the calendar.') {
  openDialog('Save appointments',`<div class="form"><p class="notice">${e(message)}</p><div class="actions end">${button('Back to appointments','appointment-back')}${button('Save to calendar','appointment-commit',{primary:true,icon:'check'})}</div></div>`);
}

function commitAppointments() {
  const items = appointmentBatch?.rows.map(D.appointmentItem);
  if (!items?.length) return openAppointment();
  if (items.some(item => !item)) return openAppointmentRetry('Check the dates and times in your appointment list.');
  const latest = readSaved();
  if (latest?.revision > state.revision) state = latest;
  const existingIds = new Set(state.items.map(item => item.id));
  const additions = items.filter(item => !existingIds.has(item.id));
  const previousState = state;
  const previousDate = selectedDate;
  const previousView = calendarView;
  state = {...state,items:state.items.concat(additions),lastAppointmentBatchId:appointmentBatch.id};
  selectedDate = items[0].date;
  calendarView = 'day';
  persist({bump:additions.length > 0});
  if (storageError) {
    state = previousState;
    selectedDate = previousDate;
    calendarView = previousView;
    return openAppointmentRetry('The browser couldn’t save to your calendar. Your draft is available to retry.');
  }
  clearAppointmentDraft();
  go('calendar');
  notify(`Added ${items.length} appointments to your calendar.`,additions.length ? () => undoAppointments(additions) : undefined);
}

function undoAppointments(items) {
  const latest = readSaved();
  if (latest?.revision > state.revision) state = latest;
  const ids = new Set(items.map(item => item.id));
  const previous = state;
  state = {...state,items:state.items.filter(item => !ids.has(item.id))};
  persist({bump:true});
  if (storageError) {
    state = previous;
    return notify('The browser couldn’t undo this change.');
  }
  render();
  notify(`Removed ${items.length} added appointments.`);
}

function clearAppointmentDraft() {
  appointmentBatch = null;
  writeAppointmentDraft();
}

function reconcileAppointmentDraft() {
  if (appointmentBatch && appointmentBatch.id === state.lastAppointmentBatchId) clearAppointmentDraft();
}

function changeAppointmentStage(action, rowId) {
  switch (action) {
    case 'appointment': return openAppointment(rowId);
    case 'appointment-edit': return editAppointmentDraft(rowId);
    case 'appointment-remove': return removeAppointmentDraftRow(rowId);
    case 'appointment-back':
      appointmentBatch.phase = 'entry';
      writeAppointmentDraft();
      return openAppointmentEntry();
    case 'appointment-commit': return commitAppointments();
    case 'appointment-discard': return openDialog('Discard draft',`<div class="form"><p>Discard these draft appointments? Saved events stay on your calendar.</p><div class="actions end">${button('Keep draft','appointment')}${button('Discard draft','appointment-discard-confirm',{primary:true})}</div></div>`);
    case 'appointment-discard-confirm':
      clearAppointmentDraft();
      closeDialog();
      renderChrome();
      return notify('Draft discarded.');
  }
}

function itemForm(item, kind = item?.kind || 'fixed', draft = {}) {
  const data = {title:'',date:selectedDate,location:'',effort:60,duration:30,buffer:5,...item,...draft,kind};
  const flex = kind === 'task';
  const trip = kind === 'trip';
  const deadline = kind === 'deadline';
  const child = kind === 'child';
  const timed = !trip && !deadline;
  const endDate = data.endDate || data.date;
  const parents = state.items.filter(candidate => candidate.kind === 'fixed' && candidate.id !== item?.id);
  const typeField = field('Type',`<select name="kind" data-item-kind>${Object.entries(kinds).map(([key,[label]]) => option(key,label,kind)).join('')}</select>`);
  const title = field('Name',input('title',data.title,'required maxlength="160" autofocus placeholder="e.g. Review slides with the team"'));
  const day = field(deadline ? 'Due date' : trip ? 'Arrival date' : 'Date',input('date',data.date,'type="date" required'));
  const place = trip ? '' : field('Location',input('location',data.location,'maxlength="160" placeholder="Optional"'));
  const notes = item?.notes !== undefined ? field('Notes (optional)',`<textarea name="notes" maxlength="1500">${e(data.notes)}</textarea>`) : '';
  const allDay = (kind === 'fixed' || kind === 'context') ? `<label class="field check"><input type="checkbox" name="allDay"${data.allDay === true || data.allDay === 'on' ? ' checked' : ''}>All day</label>` : '';
  const start = (timed || deadline) ? field(deadline ? 'Due time' : flex ? 'Start time (optional)' : 'Start time',input('start',typeof data.start === 'string' ? data.start : clock(data.start),'type="time"')) : '';
  const end = timed ? field(flex ? 'End time (optional)' : 'End time',input('end',typeof data.end === 'string' ? data.end : clock(data.end),'type="time"')) : '';
  const endDay = item?.endDate && endDate !== data.date && timed ? field('End date',input('endDate',endDate,'type="date"')) : '';
  const taskFields = flex ? `<div class="form-grid">${field('Duration (minutes)',input('effort',data.effort,'type="number" min="1" max="1440" required'))}${field('Deadline time',input('deadline',typeof data.deadline === 'string' ? data.deadline : clock(data.deadline?.minute ?? data.deadline),'type="time"'))}</div><p class="help">Leave both times blank for Fri to suggest a slot.</p>` : '';
  const tripFields = trip ? `<div class="form-grid">${field('Origin',input('origin',data.origin,'required maxlength="160"'))}${field('Destination',input('destination',data.destination,'required maxlength="160"'))}${field('Arrive by',input('arriveBy',typeof data.arriveBy === 'string' ? data.arriveBy : clock(data.arriveBy),'type="time" required'))}${field('Appointment time',input('appointmentAt',typeof data.appointmentAt === 'string' ? data.appointmentAt : clock(data.appointmentAt),'type="time"'))}${field('Travel (minutes)',input('duration',data.duration,'type="number" min="1" max="1440" required'))}${field('Buffer (minutes)',input('buffer',data.buffer,'type="number" min="0" max="1439" required'))}</div><p class="help">Fri calculates when to leave using the arrival time, travel time, and buffer.</p>` : '';
  const parent = child ? field('Parent event',`<select name="parentId" required><option value="">Choose a fixed event</option>${parents.map(candidate => option(candidate.id,`${candidate.title} · ${dateShort(candidate.date)} ${time(candidate.start)}`,data.parentId)).join('')}</select>`) : '';
  const zone = item?.timezone && item.timezone !== D.DEMO_ZONE ? `<p class="help">Times shown in Vietnam time. Source time zone ${e(item.timezone)}.</p>` : '';
  return `<form class="form" id="item-form" data-item-id="${e(item?.id || '')}">${title}<div class="form-grid">${typeField}${day}</div>${allDay}${start || end ? `<div class="form-grid">${start}${end}</div>` : ''}${endDay}${parent}${place}${notes}${taskFields}${tripFields}${zone}<p class="error" data-error role="alert" hidden></p><div class="actions end">${button('Cancel','close-dialog')}<button type="submit" class="btn primary">${item ? 'Save changes' : 'New item'}</button></div></form>`;
}

function openItemForm(itemId, kind) {
  const item = state.items.find(candidate => candidate.id === itemId);
  openDialog(item ? 'Edit item' : 'New item',itemForm(item,kind));
}

function showFormError(form, message) {
  const target = form.querySelector('[data-error]');
  target.hidden = false;
  target.textContent = message;
}

function formMinute(value) {
  return value ? D.parseTime(value) : null;
}

function saveItem(form) {
  const data = Object.fromEntries(new FormData(form));
  const existing = state.items.find(item => item.id === form.dataset.itemId);
  const draft = {...existing,id:existing?.id ?? id(),title:data.title.trim(),kind:data.kind,date:data.date,endDate:data.endDate || data.date,location:data.location?.trim() || '',start:formMinute(data.start),end:formMinute(data.end),allDay: data.allDay === 'on',timezone:D.DEMO_ZONE};
  if (data.notes !== undefined) draft.notes = data.notes.trim();
  if (draft.allDay) draft.start = draft.end = null;
  if (draft.kind === 'task') {
    draft.effort = Number(data.effort);
    draft.deadline = formMinute(data.deadline);
    if (draft.start == null && draft.end != null) return showFormError(form,'Enter a start time, or leave both times blank to let Fri schedule this task.');
    if (draft.start != null && draft.end == null) draft.end = draft.start + draft.effort;
    if (draft.start != null && draft.end != null) draft.effort = draft.end - draft.start;
    if (draft.locked && draft.start == null) return showFormError(form,'Unlock this session before clearing its time.');
  }
  if (draft.kind === 'child') draft.parentId = data.parentId;
  if (draft.kind === 'trip') {
    Object.assign(draft,{origin:data.origin.trim(),destination:data.destination.trim(),arriveBy:formMinute(data.arriveBy),appointmentAt:formMinute(data.appointmentAt),duration:Number(data.duration),buffer:Number(data.buffer)});
    if (draft.appointmentAt != null && draft.appointmentAt < draft.arriveBy) return showFormError(form,'The appointment time must be at or after the required arrival time.');
  }
  const validity = D.validateItem(draft);
  if (!validity.ok) return showFormError(form,validity.message);
  const conflict = D.previewPlacement(draft,state.items);
  if (!conflict.ok && (draft.kind === 'task' || draft.kind === 'child')) return showFormError(form,conflict.message);
  const invalidChild = state.items.filter(item => item.parentId === draft.id).find(item => !D.previewPlacement(item,state.items.filter(value => value.id !== draft.id).concat(draft)).ok);
  if (invalidChild) return showFormError(form,`This change would place “${invalidChild.title}” outside the parent event. Edit that activity first.`);
  if (existing?.sourceOriginal) draft.sourceOriginal = existing.sourceOriginal;
  if (existing?.sourceOriginal || existing?.original || existing?.sourceData) {
    const source = existing.sourceOriginal || existing.original || existing.sourceData;
    draft.overrides = Object.fromEntries(D.candidateDiff(source,draft).map(({field,after}) => [field,after]));
  }
  const previous = clone(state.items);
  state.items = state.items.filter(item => item.id !== draft.id).concat(draft);
  selectedDate = draft.date;
  persist({bump:true});
  closeDialog();
  if (page !== 'today' && page !== 'calendar') go('calendar');
  else render();
  notify(conflict.ok ? (existing ? 'Changes saved.' : 'Added to calendar.') : `Saved. ${conflict.message}`,() => undoItems(previous));
}

function undoItems(items) {
  state.items = items;
  persist({bump:true});
  render();
  notify('Calendar change undone.');
}

function openItem(itemId) {
  const original = state.items.find(item => item.id === itemId);
  if (!original) return notify('This event was deleted.');
  const item = visibleItem(original);
  const [label,glyph] = kinds[item.kind] || kinds.fixed;
  const checks = D.plan(state.items,item.date).conflicts.filter(problem => problem.itemIds.includes(item.id));
  const routes = item.kind === 'trip' && Number.isFinite(item.leaveAt) ? `<div class="form-grid"><div class="notice"><span class="caption">Leave</span><div class="big-time">${time(item.leaveAt)}</div><span class="muted">${e(item.origin || 'Unknown origin')}${item.leaveDate !== item.date ? ` · ${dateShort(item.leaveDate)}` : ''}</span></div><div class="notice"><span class="caption">On site</span><div class="big-time">${time(item.arriveBy)}</div><span class="muted">${e(item.destination || 'Unknown destination')}</span></div></div><p class="muted">Estimated arrival ${time(item.arrivalAt)} · ${item.duration} min travel + ${item.buffer} min buffer${Number.isFinite(item.appointmentAt) ? ` · Appointment at ${time(item.appointmentAt)}` : ''}</p><p class="help">${state.prefs.reminders ? 'The reminder appears in the web preview.' : 'Departure reminder preview is off.'}</p>` : '';
  const description = item.kind === 'task' && !Number.isFinite(item.start) ? `Awaiting scheduling · ${item.effort} min` : timeRange(item);
  const overnight = item.endDate > item.date ? ` · until ${dateShort(item.endDate)}` : '';
  const action = item.kind === 'task' && !Number.isFinite(item.start) ? button('Schedule tasks','plan-item',{id:item.id,icon:'spark',primary:true}) : item.kind === 'task' && !item.done && !item.locked ? button('Find another time','plan-item',{id:item.id,icon:'spark'}) : '';
  const tracking = ['fixed','task','child','deadline'].includes(item.kind) ? button(item.done ? 'Mark incomplete' : 'Mark complete','toggle-done',{id:item.id,icon:'check'}) : '';
  const lock = item.kind === 'task' && Number.isFinite(item.start) ? button(item.locked ? 'Unlock session' : 'Lock session','toggle-lock',{id:item.id,icon:'lock'}) : '';
  const changes = checks.map(problem => `<p class="notice warn">${e(problem.message)}</p>`).join('');
  openDialog(item.title,`<div class="form activity-detail"><div class="actions"><span class="event-icon kind-${e(item.kind)}">${icon(glyph)}</span>${badge(label)}${item.done ? badge('Completed','good') : ''}${item.locked ? badge('Locked') : ''}</div><div class="activity-detail-clock"><span>${e(fullDay(item.date))}</span><strong>${e(description + overnight)}</strong></div>${item.location && item.kind !== 'trip' ? `<p class="muted">${icon('pin')} ${e(item.location)}</p>` : ''}${item.notes ? `<p class="notice appointment-notes">${e(item.notes)}</p>` : ''}${routes}${item.reason ? `<p class="notice">${e(item.reason)}</p>` : ''}${changes}<div class="actions">${action}${tracking}${lock}</div><div class="divider"></div><div class="actions end">${button('Delete item','delete-item',{id:item.id,kind:'danger'})}${button('Edit','item-edit',{id:item.id,primary:true})}</div></div>`);
}

function toggleItem(itemId, property) {
  const item = state.items.find(candidate => candidate.id === itemId);
  if (!item) return;
  const previous = clone(state.items);
  item[property] = !item[property];
  persist({bump:true});
  render();
  openItem(itemId);
  const message = property === 'done' ? (item.done ? 'Marked complete.' : 'Event reopened.') : (item.locked ? 'Session locked.' : 'Session unlocked.');
  notify(message,() => undoItems(previous));
}

function openDelete(itemId) {
  const item = state.items.find(candidate => candidate.id === itemId);
  if (!item) return;
  const children = state.items.filter(candidate => candidate.parentId === itemId);
  openDialog('Delete item',`<div class="form"><p>Delete “${e(item.title)}” from your calendar?${children.length ? ` ${children.length} nested activities will also be deleted.` : ''}</p><div class="actions end">${button('Back','item',{id:itemId})}${button('Delete item','delete-item-confirm',{id:itemId,primary:true})}</div></div>`);
}

function deleteItem(itemId) {
  const previous = clone(state.items);
  state.items = state.items.filter(item => item.id !== itemId && item.parentId !== itemId);
  persist({bump:true});
  closeDialog();
  render();
  notify('Event deleted.',() => undoItems(previous));
}

function openPlan(itemId) {
  const target = state.items.find(item => item.id === itemId);
  const date = target?.date || selectedDate;
  const reschedule = Boolean(target && Number.isFinite(target.start));
  const alternatives = reschedule ? [{start:480,end:Math.min(target.start,1260)},{start:Math.max(target.end,480),end:1260}]
    .filter(window => window.end > window.start) : undefined;
  planPreview = D.plan(state.items,date,{revision:state.revision,targetId:itemId || undefined,reschedule,availability:alternatives});
  const {placements,conflicts,shortages} = planPreview;
  const placementRows = placements.map(item => `<div class="notice"><strong>${e(item.title)}</strong><p>${e(timeRange(item))} · ${item.effort} min${item.location ? ` · ${e(item.location)}` : ''}</p><p class="help">Free and fits the required duration${item.location ? ' and location' : ''}.</p></div>`).join('');
  const problems = [...conflicts,...shortages].map(problem => `<div class="notice warn"><strong>${e(problem.title)}</strong><p>${e(problem.message)}</p>${(problem.itemIds || []).filter(itemId => state.items.some(item => item.id === itemId)).map(itemId => `<button type="button" class="link-btn" data-action="item" data-id="${e(itemId)}">${e(state.items.find(item => item.id === itemId).title)} →</button>`).join(' ')}</div>`).join('');
  openDialog('Preview plan',`<div class="form"><p class="muted">${e(fullDay(date))} · ${placements.length} suggestions</p>${placementRows}${problems}${!placements.length && !problems ? empty('No tasks to schedule','Add a flexible task with a duration so Fri can find a free slot.') : ''}<div class="actions end">${button('Close','close-dialog')}${placements.length ? button('Apply plan','plan-apply',{primary:true,icon:'check'}) : ''}</div></div>`);
}

function applyPlan() {
  const latest = readSaved();
  if (latest && latest.revision > state.revision) state = latest;
  const result = D.commitPlan(state,planPreview);
  if (!result.ok) {
    openDialog('Schedule tasks',`<div class="form"><p class="notice warn">${e(result.message)}</p>${button('Preview again','plan',{primary:true})}</div>`);
    return;
  }
  const previous = clone(state.items);
  state = result.state;
  persist();
  closeDialog();
  render();
  notify('Plan applied.',() => undoItems(previous));
}

function settingsPage() {
  const mode = document.documentElement.dataset.mode;
  const colorOffset = mode === 'dark' ? 4 : 1;
  const paletteCards = Object.entries(palettes).map(([key,palette]) => `<button type="button" class="palette" data-action="pref-theme" data-id="${key}" aria-pressed="${state.prefs.theme === key}"><span class="swatches" aria-hidden="true">${palette.slice(colorOffset,colorOffset+3).map(color => `<i style="background:${color}"></i>`).join('')}</span>${e(palette[0])}</button>`).join('');
  const modes = [['system','System'],['light','Light'],['dark','Dark']].map(([key,label]) => `<button type="button" data-action="pref-mode" data-id="${key}" aria-pressed="${state.prefs.mode === key}">${label}</button>`).join('');
  return `${intro('Preferences','Settings','Manage appearance, data, and widgets.')}<div class="settings-layout"><section class="card panel"><div class="setting"><h2>Appearance</h2><div class="segment" role="group" aria-label="Color mode">${modes}</div></div><div class="setting"><h3>Color palette</h3><div class="palettes" role="group" aria-label="Color palette">${paletteCards}</div></div><div class="setting">${prefCheck('Reduce transparency','solid')}<p class="muted">Use solid backgrounds for navigation and widgets.</p></div></section><div class="stack"><section class="card panel stack"><h2>Widgets and reminders</h2>${prefCheck('Hide Lock Screen details','private')}${prefCheck('Preview departure reminder','reminders')}<p class="muted">Reminders appear in this preview.</p>${button('Open widgets','page',{id:'widgets',icon:'widgets'})}</section><section class="card panel stack"><h2>Data</h2><p class="muted">Your calendar and evidence are stored in this browser.</p><div class="actions">${button('Export Fri calendar','export',{icon:'download'})}${button('Manage data','reset',{kind:'ghost'})}</div></section></div></div>`;
}

function prefCheck(label,key) {
  return `<label class="field check"><input type="checkbox" data-pref="${e(key)}"${state.prefs[key] ? ' checked' : ''}>${e(label)}</label>`;
}

function encodeIcs(value) {
  return String(value || '').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
}

function exportIcs() {
  const exported = state.items.filter(item => item.generated && item.kind === 'task' && Number.isFinite(item.start));
  if (!exported.length) return notify('Apply a plan to export sessions scheduled by Fri.');
  const invalid = exported.find(item => !D.previewPlacement(item,state.items).ok);
  if (invalid) return notify(`Resolve the conflict for “${invalid.title}” before export.`);
  const utc = (date,minute) => new Date(Date.parse(`${date}T00:00:00+07:00`) + minute*60000).toISOString().replace(/[-:]|\.\d{3}/g,'');
  const stamp = new Date().toISOString().replace(/[-:]|\.\d{3}/g,'');
  const content = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FRI//Web V1//VI',...exported.flatMap(item => ['BEGIN:VEVENT',`UID:${encodeIcs(item.id)}@fri.local`,`DTSTAMP:${stamp}`,`DTSTART:${utc(item.date,item.start)}`,`DTEND:${utc(item.endDate || item.date,item.end)}`,`SUMMARY:${encodeIcs(item.title)}`,`LOCATION:${encodeIcs(item.location)}`,'END:VEVENT']),'END:VCALENDAR',''].join('\r\n');
  const url = URL.createObjectURL(new Blob([content],{type:'text/calendar;charset=utf-8'}));
  const link = Object.assign(document.createElement('a'),{href:url,download:'fri-plan.ics'});
  link.click();
  setTimeout(() => URL.revokeObjectURL(url),1000);
  notify(`Exported ${exported.length} Fri sessions.`);
}

function searchable(value) {
  return String(value || '').normalize('NFD').replace(/\p{Diacritic}/gu,'').replace(/[đĐ]/g,'d').toLowerCase();
}

function showSearch() {
  openDialog('Search calendar',`<div class="form">${field('Event name or location',input('search','', 'type="search" maxlength="160" placeholder="e.g. Robotics" autocomplete="off" autofocus data-search'))}<div id="search-results" aria-live="polite"></div></div>`);
  updateSearch('');
}

function updateSearch(query) {
  const search = searchable(query).trim();
  const matches = search ? state.items.filter(item => searchable(`${item.title} ${item.location || ''}`).includes(search)).slice(0,15) : [];
  dialogBody.querySelector('#search-results').innerHTML = matches.length ? matches.map(item => `<button type="button" class="mini-row kind-${e(item.kind)}" data-action="widget-item" data-id="${e(item.id)}"><i class="pip"></i><span>${e(item.title)}</span><span>${e(dateShort(item.date))} · ${e(timeRange(item))}</span></button>`).join('') : `<p class="muted">${search ? 'No matching events.' : 'Type to find an event on your calendar.'}</p>`;
}

function resetDialog() {
  openDialog('Manage data',`<div class="form"><p>An empty or sample calendar will replace the calendar and sources saved in this browser.</p><div class="actions end">${button('Cancel','close-dialog')}${button('Empty calendar','reset-confirm',{id:'empty',kind:'danger'})}${button('Restore sample calendar','reset-confirm',{id:'demo',primary:true})}</div></div>`);
}

function resetData(mode) {
  const previousPrefs = state.prefs;
  const revision = state.revision + 1;
  state = mode === 'demo' ? D.demoState() : {items:[],sources:[],candidates:[]};
  state.demo = mode === 'demo';
  state.prefs = previousPrefs;
  state.revision = revision;
  clearAppointmentDraft();
  selectedDate = state.demo ? D.DEMO_DATE : realDate();
  persist();
  go('today');
  notify(state.demo ? 'Sample calendar restored.' : 'Empty calendar created.');
}

function setSelectedDate(date) {
  if (!validDate(date)) return;
  selectedDate = date;
  persist();
  render({keepFocus:true});
}

function openWidgetItem(itemId) {
  const item = state.items.find(candidate => candidate.id === itemId);
  if (!item) return go('today');
  selectedDate = item.date;
  calendarView = 'day';
  persist();
  go('calendar',{hash:false});
  const address = `#calendar/item/${encodeURIComponent(itemId)}`;
  if (location.hash !== address) history.pushState(null,'',address);
  openItem(itemId);
}

function syncHash() {
  const destination = location.hash.slice(1);
  const link = /^calendar\/item\/([a-zA-Z0-9._-]+)$/.exec(destination);
  if (link) return openWidgetItem(link[1]);
  if (destination !== page || drawer.open) go(Object.hasOwn(pages,destination) ? destination : 'today',{hash:false});
}

function dateDialog() {
  openDialog('Choose date',`<form class="form" id="date-form">${field('Date to open',input('date',selectedDate,'type="date" required autofocus'))}<div class="actions end">${button('Cancel','close-dialog')}<button type="submit" class="btn primary">Go to date</button></div></form>`);
}

function launch() {
  reconcileAppointmentDraft();
  bindCalendarMotion();
  document.documentElement.classList.toggle('has-optical-backdrop', /Chrome|Chromium/.test(navigator.userAgent));
  document.querySelector('#close-dialog').innerHTML = icon('close');
  document.querySelector('#close-dialog').addEventListener('click',closeDialog);
  drawer.addEventListener('close',() => {
    if (drawer.open) return;
    if (location.hash.startsWith('#calendar/item/')) history.replaceState(null,'','#calendar');
    renderChrome();
    focusAction(restoreFocus);
  });
  document.addEventListener('click', event => {
    const node = event.target.closest('button[data-action]');
    if (!node || node.disabled) return;
    const {action,id:itemId} = node.dataset;
    if (action === 'appointment' || action.startsWith('appointment-')) return changeAppointmentStage(action,itemId);
    switch (action) {
      case 'page': return go(itemId);
      case 'open-day': return openCalendarLevel('day',itemId,{focus:true});
      case 'open-month': return openCalendarLevel('month',selectedDate.startsWith(itemId) ? selectedDate : `${itemId}-01`,{focus:true});
      case 'day-complete': return completeDay(itemId);
      case 'activity-tick': return tickActivity(itemId);
      case 'activity-open': return openActivityDetail(itemId,node);
      case 'widget-toggle':
        if (expandedWidgets.has(itemId)) expandedWidgets.delete(itemId);
        else expandedWidgets.add(itemId);
        return render({keepFocus:true});
      case 'date-jump': return dateDialog();
      case 'today': return openCalendarLevel('day',state.demo ? D.DEMO_DATE : realDate());
      case 'shift': return setSelectedDate(shiftDate(Number(itemId)));
      case 'widget-date': return setSelectedDate(D.addDays(selectedDate,Number(itemId)));
      case 'view': return openCalendarLevel(itemId);
      case 'item': return openItem(itemId);
      case 'widget-item': return openWidgetItem(itemId);
      case 'item-new': return openItemForm(null,itemId);
      case 'item-edit': return openItemForm(itemId);
      case 'delete-item': return openDelete(itemId);
      case 'delete-item-confirm': return deleteItem(itemId);
      case 'toggle-done': return toggleItem(itemId,'done');
      case 'toggle-lock': return toggleItem(itemId,'locked');
      case 'plan': return openPlan();
      case 'plan-item': return openPlan(itemId);
      case 'plan-apply': return applyPlan();
      case 'pref-mode': state.prefs.mode = itemId; persist(); return render({keepFocus:true});
      case 'pref-theme': state.prefs.theme = itemId; persist(); return render({keepFocus:true});
      case 'close-dialog': return closeDialog();
      case 'search': return showSearch();
      case 'hide-toast': return hideToast();
      case 'undo': if (undoAction) return undoAction(); break;
      case 'reset': return resetDialog();
      case 'reset-confirm': return resetData(itemId);
      case 'export': return exportIcs();
      default: return handleSourceAction(action,itemId,node);
    }
  });
  document.addEventListener('submit', event => {
    if (event.target.id === 'appointment-entry-form') {
      event.preventDefault();
      return submitAppointmentEntry(event.target,event.submitter?.value === 'done');
    }
    if (event.target.id === 'appointment-review-form') {
      event.preventDefault();
      return answerAppointmentQuestion(event.target);
    }
    if (event.target.id === 'date-form') {
      event.preventDefault();
      const date = new FormData(event.target).get('date');
      closeDialog();
      openCalendarLevel('day',date,{focus:true});
      return;
    }
    if (event.target.id !== 'item-form') return handleSourceSubmit(event);
    event.preventDefault();
    saveItem(event.target);
  });
  document.addEventListener('change', event => {
    const node = event.target;
    if (node.form?.id.startsWith('appointment-')) return updateAppointmentDraft(event);
    if (node.dataset.pref) {
      state.prefs[node.dataset.pref] = node.checked;
      persist();
      return applyTheme(), node.dataset.pref !== 'solid' ? render() : undefined;
    }
    if (node.matches('[data-item-kind]')) {
      const form = node.form;
      const existing = state.items.find(item => item.id === form.dataset.itemId);
      const draft = Object.fromEntries(new FormData(form));
      openDialog(existing ? 'Edit item' : 'New item',itemForm(existing,node.value,draft));
      dialogBody.querySelector('[data-item-kind]').focus();
    }
  });
  document.addEventListener('input', event => {
    if (event.target.matches('[data-search]')) updateSearch(event.target.value);
    else updateAppointmentDraft(event);
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'k' && (event.metaKey || event.ctrlKey)) {
      event.preventDefault();
      if (!drawer.open) showSearch();
    }
    if (event.key === 'Escape' && !drawer.open) hideHoverCard();
    moveMonthFocus(event);
  });
  window.addEventListener('storage',event => {
    if (event.key === APPOINTMENT_KEY) {
      appointmentBatch = readAppointmentBatch();
      if (drawer.open && dialogBody.querySelector('[id^="appointment-"]')) {
        if (appointmentBatch) openAppointment();
        else closeDialog();
      }
      renderChrome();
      return;
    }
    if (event.key !== KEY) return;
    const latest = readSaved();
    if (latest?.revision > state.revision) {
      state = latest;
      migrateDemoLabels();
      render();
      announce('Calendar updated from another tab.');
    }
  });
  window.addEventListener('online',() => { render(); announce('Back online.'); });
  window.addEventListener('offline',() => { render(); announce('You’re offline.'); });
  window.addEventListener('hashchange',syncHash);
  mobile.addEventListener('change',renderChrome);
  mediaDark.addEventListener('change',() => { if (state.prefs.mode === 'system') render(); });
  render();
  if (location.hash) syncHash();
}

launch();
</script>
</body>
</html>
