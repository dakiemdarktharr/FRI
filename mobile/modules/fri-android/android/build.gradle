buildscript {
  repositories { google(); mavenCentral() }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${rootProject.ext.kotlinVersion}")
    classpath("com.google.devtools.ksp:symbol-processing-gradle-plugin:${rootProject.ext.kspVersion}")
  }
}
plugins { id 'com.android.library'; id 'expo-module-gradle-plugin' }
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.devtools.ksp'
group = 'expo.modules.friandroid'
version = '0.1.0'
android {
  namespace 'expo.modules.friandroid'
  defaultConfig { versionCode 1; versionName '0.1.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
  buildFeatures { compose true }
  compileOptions { coreLibraryDesugaringEnabled true }
  testOptions { unitTests.returnDefaultValues = true }
}
ksp { arg('room.schemaLocation', "$projectDir/schemas") }
dependencies {
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
  implementation 'androidx.room:room-runtime:2.8.5'
  implementation 'androidx.room:room-ktx:2.8.5'
  ksp 'androidx.room:room-compiler:2.8.5'
  implementation 'androidx.glance:glance-appwidget:1.2.0'
  implementation 'androidx.work:work-runtime-ktx:2.12.0'
  implementation 'androidx.activity:activity-compose:1.13.0'
  implementation 'androidx.compose.ui:ui:1.12.1'
  implementation 'androidx.compose.foundation:foundation:1.12.1'
  implementation 'androidx.compose.material3:material3:1.4.0'
  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20250517'
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
  androidTestImplementation 'androidx.room:room-testing:2.8.5'
}
